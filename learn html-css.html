عة تأثيرات متراكمة. والوراثة جزء من الحساب تظهر في النمط المحسوب."}],"tasks":[{"id":"css-01-t1","title":"انقل التنسيق من العنصر إلى ورقة الأنماط","brief":"البطاقة في المحرر مكتوبة بأنماط سطرية داخل سمات `style`. احذف **كل** سمات `style`، واكتب القواعد في محرر CSS بدلًا منها: للصنف `card` خلفية `#f8fafc` وحدّ `1px solid #e2e8f0` وحشوة `20px`، وللصنف `card-title` حجم خط `20px` ولون `#0f172a`، وللصنف `card-text` لون `#475569`. بعد الحذف لن يظهر أي تنسيق حتى تكتب القواعد.","steps":["احذف سمات style من الوسوم الثلاثة","اكتب `.card` واجمع فيها الخلفية والحد والحشوة","أضف قاعدتي `.card-title` و`.card-text`"],"files":{"html":"<div class=\"card\" style=\"background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px;\">\n  <h3 class=\"card-title\" style=\"font-size: 20px; color: #0f172a;\">تمر سكري فاخر<\/h3>\n  <p class=\"card-text\" style=\"color: #475569;\">الكرتون 5 كجم — توصيل مجاني داخل المدينة.<\/p>\n<\/div>","css":"/* ابدأ هنا: لا تنسَ الفاصلة المنقوطة بعد كل تعريف */\n"},"checks":[{"kind":"sourceNot","label":"لم تبقَ أي سمة style","regex":"style\\s*="},{"kind":"cssDecl","label":"قاعدة .card تعلن الخلفية","selector":".card","prop":"background","regex":"#f8fafc"},{"kind":"cssDecl","label":"عنوان البطاقة بحجم 20px","selector":".card-title","prop":"font-size","regex":"20px"},{"kind":"cssDecl","label":"نص البطاقة بلون رمادي","selector":".card-text","prop":"color","regex":"#475569"},{"kind":"computed","label":"الخلفية محسوبة على .card","sel":".card","prop":"background","regex":"#f8fafc|248"}],"hint":"احذف `style=\"...\"` كاملة بعلامات التنصيص، ثم اكتب `.card { ... }` كتلة واحدة تجمع الخصائص الثلاث.","solution":{"html":"<div class=\"card\">\n  <h3 class=\"card-title\">تمر سكري فاخر<\/h3>\n  <p class=\"card-text\">الكرتون 5 كجم — توصيل مجاني داخل المدينة.<\/p>\n<\/div>","css":".card {\n  background: #f8fafc;\n  border: 1px solid #e2e8f0;\n  padding: 20px;\n}\n\n.card-title {\n  font-size: 20px;\n  color: #0f172a;\n}\n\n.card-text {\n  color: #475569;\n}\n"}},{"id":"css-01-t2","title":"بطاقة منتج بثلاث طبقات من المحدِّدات","brief":"نسّق بطاقة المنتج في المحرر بكتابة CSS فقط دون تغيير HTML: اجعل `.product` بحشوة `16px` وحدّ `1px solid #e2e8f0`، وكل عنوان `h3` بلون `#0f172a` وحجم `20px`، والصنف `.price` بلون `#0f766e` ووزن خط `700`، والمعرّف `#note` بلون `#64748b` وحجم `13px`.","steps":["ابدأ بقاعدة `.product` للحاوية","استخدم محدِّد العنصر `h3` للعنوان","أنهِ بالصنف `.price` ثم المعرّف `#note`"],"files":{"html":"<!-- نسّق بكتابة CSS فقط، ولا تغيّر هذا الهيكل -->\n<div class=\"product\">\n  <h3>تمر عجوة المدينة<\/h3>\n  <p class=\"price\">45 ر.س<\/p>\n  <p id=\"note\">السعر شامل ضريبة القيمة المضافة.<\/p>\n<\/div>","css":"/* نسّق البطاقة هنا */\n"},"checks":[{"kind":"cssDecl","label":"حشوة للحاوية .product","selector":".product","prop":"padding","regex":"\\d+px"},{"kind":"cssDecl","label":"عناوين h3 بلون داكن","selector":"h3","prop":"color","regex":"#0f172a"},{"kind":"cssDecl","label":"السعر بخط عريض","selector":".price","prop":"font-weight","regex":"700|bold"},{"kind":"cssDecl","label":"الملاحظة بلون رمادي","selector":"#note","prop":"color","regex":"#64748b"},{"kind":"cssCount","label":"ثلاث قواعد على الأقل تعلن color","prop":"color","min":3}],"hint":"المعرّف يُكتب بـ `#` ويطابق سمة `id`، والصنف بـ `.`. تذكّر أن أولوية `#note` أعلى من `.price`، لكن لكل منهما عنصر مختلف هنا.","solution":{"html":"<div class=\"product\">\n  <h3>تمر عجوة المدينة<\/h3>\n  <p class=\"price\">45 ر.س<\/p>\n  <p id=\"note\">السعر شامل ضريبة القيمة المضافة.<\/p>\n<\/div>","css":".product {\n  padding: 16px;\n  border: 1px solid #e2e8f0;\n}\n\nh3 {\n  color: #0f172a;\n  font-size: 20px;\n}\n\n.price {\n  color: #0f766e;\n  font-weight: 700;\n}\n\n#note {\n  color: #64748b;\n  font-size: 13px;\n}\n"}}],"summary":["HTML تعطي المعنى وCSS تعطي الشكل، والفصل بينهما هو ما يجعل التعديل والصيانة ممكنين","القاعدة = محدِّد + كتلة تعريفات، وكل تعريف ينتهي بفاصلة منقوطة","الملف الخارجي عبر <link> هو الاختيار الافتراضي، والسطري للاختبار السريع فقط","الشلال يرتب: الأهمية ثم الأولوية ثم ترتيب الظهور، والوراثة ليست منافسًا"]},{"id":"css-02","track":"css","chapter":"CSS · الأساسيات","order":2,"title":"المحددات الأساسية","subtitle":"تختار بالضبط العنصر الذي تريده — بالصنف أو العلاقة أو السمة — وتعرف مسبقًا أي قاعدة ستكسب عند التعارض.","minutes":18,"level":"مبتدئ","objectives":["تفرّق بين محددات العنصر والصنف والمعرّف وتعرف متى تستخدم كلًا منها","تصل إلى العناصر عبر العلاقات: السليل والابن والأشقاء","تستخدم محددات السمات لتصفية الروابط والحقول دون إضافة أصناف","تحسب أولوية أي محدِّد قبل أن يطبّق المتصفح قواعده"],"theory":[{"type":"h","text":"المحدِّد جملة شرط لا اسمًا"},{"type":"p","text":"المتصفح لا يبحث عن «عنصر الفقرة»؛ بل يمر على شجرة DOM عنصرًا عنصرًا ويسأل: هل يتحقق هذا الشرط؟ إن تحقق، طُبّقت الكتلة. لذلك المحدِّد `.card` ليس اسمًا لشيء، بل شرط «يحمل الصنف card». وفهم ذلك يفسّر أشهر حيرة عند المبتدئ: كتبت القاعدة ولم يُطبَّق شيء، لأن الشرط لم يتحقق على أي عنصر."},{"type":"compare","left":{"title":"HTML: ما كتبته","code":"<ul class=\"menu\">\n  <li class=\"item active\">\n    <a href=\"/offers\">العروض<\/a>\n  <\/li>\n<\/ul>"},"right":{"title":"CSS: كيف تخاطبه","code":"ul { list-style: none; }\n.menu { padding: 0; }\n.item.active { font-weight: 700; }\n.menu a { color: #1d4ed8; }"}},{"type":"h","text":"العام `*` والمحدِّد بالعنصر"},{"type":"p","text":"`*` يطابق **كل** عنصر في الصفحة، وأولويته صفر. يُستخدم عادةً لضبط `box-sizing` أو لتصفير هوامش محدودة، وليس لتنسيق المحتوى. أما محدِّد العنصر مثل `p` أو `h2` فيطابق كل وسم من هذا النوع، وهو مفيد للأنماط الأساسية التي تُبنى فوقها الأصناف."},{"type":"code","lang":"css","code":"*, *::before, *::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n}\n\nh2 {\n  color: #0f172a;\n}","caption":"الأساس أولًا، ثم الأصناف تخصصه"},{"type":"note","tone":"warn","title":"‏* ليست بديلًا عن التفكير","text":"`* { margin: 0; }` تحذف هوامش كل شيء، بما فيها ما تحتاجه للقراءة، ثم تبدأ بإعادة بناء كل مسافة يدويًا. استخدمها لما تُريده فعلًا: `box-sizing` أشهر استخدام مشروع لها."},{"type":"h","text":"الصنف `.class` والمعرّف `#id`"},{"type":"p","text":"الصنف يُعاد استخدامه على عشرات العناصر، ويمكن أن يحمل العنصر عدة أصناف (`class=\"card featured\"`). المعرّف فريد في الصفحة: عنصر واحد فقط يحمله، وأولويته عالية جدًا، ولهذا يُستحسن تركه للربط الداخلي (`#offers`) وللتعامل معه من JavaScript، لا للتنسيق."},{"type":"code","lang":"html","code":"<section id=\"offers\" class=\"panel featured\">\n  <h2 class=\"panel-title\">عروض الجمعة<\/h2>\n<\/section>","caption":"معرّف واحد للتقسيم، وأصناف متعددة للتنسيق"},{"type":"code","lang":"css","code":".panel { padding: 20px; }\n.panel.featured { border: 2px solid #0f766e; }\n#offers { scroll-margin-top: 80px; }","caption":"الصنف للتنسيق، والمعرّف لسلوك الصفحة"},{"type":"list","items":["الصنف يبدأ بنقطة `.`، والمعرّف بعلامة `#`.","`.panel.featured` تعني عنصرًا يحمل الصنفين معًا، لا أيًّا منهما.","لا تخلط بين `.a .b` (بمسافة: عنصر داخل آخر) و`.a.b` (بلا مسافة: العنصر نفسه)."],"ordered":false},{"type":"h","text":"العلاقات: السليل والابن والأشقاء"},{"type":"p","text":"لغة HTML شجرة، وCSS تسمح بوصف الموقع في الشجرة. السليل (مسافة) يصل إلى أي عمق، والابن `>` يصل إلى الجيل الأول فقط، و`+` يختار الأخ التالي المباشر، و`~` يختار كل الأشقاء التالين."},{"type":"table","head":["المحدِّد","ماذا يختار"],"rows":[["`article p`","كل فقرة داخل article، حتى لو كانت داخل أقسام أعمق"],["`article > p`","الفقرة التي أبيها المباشر article فقط"],["`h2 + p`","الفقرة الأولى التي تأتي **مباشرة** بعد h2"],["`h2 ~ p`","كل الفقرات اللاحقة لـ h2 ولو فصل بينها عنصر"],["`h1, h2, h3`","ثلاثة محددات في قاعدة واحدة، ولكل منها أولويته"]]},{"type":"code","lang":"css","code":".article > p { margin-block: 1em; }\n.article p a { text-decoration: underline; }\nh2 + p { font-size: 1.1rem; color: #475569; }\nh2 ~ figure { margin-top: 24px; }","caption":"أربع علاقات في أربع قواعد"},{"type":"note","tone":"warn","title":"السليل يصل إلى العمق كله","text":"`ul li` تطابق أيضًا عناصر القوائم المتداخلة، فتصبغ المستوى الثالث بلا قصد. إن أردت المستوى الأول فقط فاكتب `ul > li`."},{"type":"h","text":"محددات السمات"},{"type":"p","text":"أحيانًا لا تحتاج صنفًا جديدًا؛ فقيمة السمة نفسها تحمل المعلومة. تريد تمييز الروابط الخارجية؟ `a[href^=\"https\"]`. تريد تمييز ملفات PDF؟ `a[href$=\".pdf\"]`. هذه المحددات تصف **المعنى** الموجود في HTML أصلًا، وتُبقي الوسم نظيفًا."},{"type":"table","head":["الصيغة","تطابق عنصرًا"],"rows":[["`[disabled]`","يملك السمة، أيا كانت قيمتها"],["`[type=\"email\"]`","قيمة السمة تساوي email تمامًا"],["`[href^=\"https\"]`","القيمة تبدأ بـ https"],["`[href$=\".pdf\"]`","القيمة تنتهي بـ .pdf"],["`[class*=\"btn\"]`","القيمة تحتوي btn في أي موضع"],["`[class~=\"btn\"]`","إحدى الكلمات المفصولة بمسافة تساوي btn بالضبط"],["`[lang|=\"ar\"]`","القيمة ar، أو تبدأ بـ ar- مثل ar-SA"]]},{"type":"code","lang":"css","code":"a[target=\"_blank\"] { font-weight: 700; }\na[href^=\"https://\"] { color: #1d4ed8; }\na[href$=\".pdf\"] { color: #b91c1c; }\n[class*=\"btn\"] { border-radius: 6px; }\n[lang|=\"ar\"] { direction: rtl; }","caption":"خمس قواعد بلا صنف واحد"},{"type":"p","text":"قيم السمات حسّاسة لحالة الأحرف عمومًا: `[href$=\".PDF\"]` لا يطابق `guide.pdf`. يمكنك تجاهل الحالة بإضافة `i` بعد القيمة: `[href$=\".pdf\" i]`. وتذكّر أن `~=` تعني «كلمة كاملة»، فلا تخلطها بـ `*=` التي تعني «جزء من النص»."},{"type":"h","text":"الأولوية: كيف يحسبها المتصفح؟"},{"type":"p","text":"لكل محدِّد ثلاثة أعمدة: عدد المعرّفات، عدد الأصناف والسمات والحالات الزائفة، عدد العناصر والعناصر الزائفة. تقارن الأعمدة من اليسار إلى اليمين كأنها ثلاثة أرقام منفصلة، لا رقمًا واحدًا في نظام عشري؛ فـ (0,1,0) أقوى من (0,0,99) مهما كثرت العناصر، و(1,0,0) تقهر أي عدد من الأصناف."},{"type":"table","head":["المحدِّد","معرّفات","أصناف/سمات/حالات","عناصر","الأولوية"],"rows":[["`*`","0","0","0","(0,0,0)"],["`li`","0","0","1","(0,0,1)"],["`ul li`","0","0","2","(0,0,2)"],["`.card`","0","1","0","(0,1,0)"],["`a:hover`","0","1","1","(0,1,1)"],["`#nav .item`","1","1","0","(1,1,0)"],["`#nav .item a`","1","1","1","(1,1,1)"]]},{"type":"code","lang":"css","code":"/* (0,0,1) */\np { color: #334155; }\n\n/* (0,1,0) يفوز */\n.intro { color: #0f766e; }\n\n/* (0,1,1) يفوز على الاثنين */\np.intro { color: #b91c1c; }\n\n/* (1,0,0) يقهر الجميع هنا */\n#summary { color: #0f172a; }","caption":"نفس العنصر، أربع أولويات"},{"type":"note","tone":"info","title":"الفاصلة لا تجمع الأولوية","text":"في `h1, h2 { color: teal; }` تُعامَل كل قائمة كأنها قاعدة مستقلة؛ `h1` بأولوية (0,0,1) و`h2` كذلك. الفاصلة تختصر الكتابة فقط ولا ترفع الأولوية."},{"type":"h","text":"تسمية الأصناف"},{"type":"p","text":"اسم الصنف عقد بين HTML وCSS، ويُقرأ أكثر مما يُكتب. اجعله يصف **الدور** لا المظهر: لو غيّرت الأحمر إلى أزرق غدًا، فالاسم `red-box` يصبح كذبة، أما `alert` فيبقى صحيحًا."},{"type":"list","items":["أحرف لاتينية صغيرة وأرقام وشرطة: `product-card` أو `productCard`، وثبّت على نمط واحد.","لا تبدأ برقم ولا تضع مسافة أو حرفًا عربيًا داخل الاسم.","صف الدور: `alert`, `checkout-btn`, `price-tag`، لا `big-red-thing`.","صنف أساسي واحد + أصناف مساعدة صغيرة أفضل من صنف طويل يخلط كل شيء."],"ordered":false},{"type":"note","tone":"tip","title":"اختبار سريع للتسمية","text":"لو احتاج مصمم جديد إلى معرفة وظيفة العنصر من اسمه وحده، فالتسمية ناجحة. وإن احتاج أن يفتح CSS ليعرف، فأعد التفكير في الاسم."},{"type":"terms","items":[{"term":"محدِّد السليل","desc":"مسافة بين محدِّدين تعني «داخل»، وتصل إلى أي عمق."},{"term":"الابن المباشر `>`","desc":"يختار الجيل الأول فقط تحت الأب."},{"term":"الأولوية (specificity)","desc":"ثلاثة أعمدة: معرّفات، ثم أصناف/سمات/حالات، ثم عناصر."},{"term":"`[attr^=]` و`[attr$=]`","desc":"بداية القيمة ونهايتها؛ و`*=` تحتوي، و`~=` كلمة كاملة."}]}],"examples":[{"title":"‏* تطابق كل شيء ولا تفوز على شيء","prompt":"ما لون عناصر القائمة الثلاثة؟ ولماذا لم تُصبغ بلون القاعدة العامة `*`؟","answer":"الثلاثة بلون `#0f766e` إلا «العروض» فأحمر `#b91c1c`؛ قاعدة `*` طابقت كل عنصر لكنها خسرت أمام كل قاعدة أخرى.","explain":"`*` أولويتها (0,0,0)، فأي محدِّد عنصر مثل `li` يتفوق عليها، والصنف `.active` يتفوق على الاثنين. كثرة المطابقة لا تعني قوة القاعدة.","html":"<ul class=\"menu\">\n  <li>الرئيسية<\/li>\n  <li class=\"active\">العروض<\/li>\n  <li>اتصل بنا<\/li>\n<\/ul>","css":"* {\n  color: #334155;\n}\nli {\n  color: #0f766e;\n}\n.active {\n  color: #b91c1c;\n}"},{"title":"السليل أم الابن؟","prompt":"أي العناصر يصير أخضر؟ وأيها رمادي؟ وأيها عريض؟","answer":"عنصرا المستوى الأول أخضران، والعنصر المتداخل «خصم 10%» رمادي، والثلاثة عريضة.","explain":"`.list > li` تطابق الجيل الأول فقط (عنصرين)، بينما `.list li` تطابق أيضًا `li` داخل القائمة المتداخلة. أي أن العريض وصل إلى العمق كله. ولولا قاعدة `.list ul` لورث العنصر الداخلي الأخضر عن أبيه؛ لكن القائمة الداخلية أعلنت لونها الخاص فقطعت سلسلة الوراثة.","html":"<ul class=\"list\">\n  <li>عروض الصيف\n    <ul>\n      <li>خصم 10%<\/li>\n    <\/ul>\n  <\/li>\n  <li>وصل حديثًا<\/li>\n<\/ul>","css":".list > li {\n  color: #0f766e;\n}\n.list ul {\n  color: #64748b;\n}\n.list li {\n  font-weight: 700;\n}"},{"title":"وسم الروابط بلا أصناف","prompt":"أي رابط سيظهر عريضًا؟ وأيها أحمر؟ وأيها بلا خط تحت؟","answer":"الرابط الخارجي عريض وأزرق، ورابط PDF أحمر، ورابط البريد بلا خط تحت. الرابط الداخلي بقي على حاله الافتراضية.","explain":"كل قاعدة تختبر جزءًا من قيمة السمة: `^=` بداية القيمة، و`$=` نهايتها. رابط PDF لا يبدأ بـ https فلا يصير عريضًا، لكن قاعدته الخاصة للون تفوز على قاعدة `a` العامة.","html":"<p><a href=\"https://example.com\">موقع خارجي<\/a><\/p>\n<p><a href=\"/files/guide.pdf\">دليل المشتري<\/a><\/p>\n<p><a href=\"mailto:info@shop.sa\">راسلنا<\/a><\/p>","css":"a {\n  color: #1d4ed8;\n}\na[href^=\"https://\"] {\n  font-weight: 700;\n}\na[href$=\".pdf\"] {\n  color: #b91c1c;\n}\na[href^=\"mailto:\"] {\n  text-decoration: none;\n}"}],"quiz":[{"q":"أي محدِّد يختار عناصر `li` المباشرة فقط داخل `.menu`؟","options":[".menu li",".menu > li",".menu + li",".menu ~ li"],"answer":1,"explain":"علامة `>` تعني الابن المباشر (الجيل الأول). أما المسافة فتصل إلى أي عمق، و`+` و`~` تخصّان الأشقاء لا الأبناء."},{"q":"ماذا يختار `h2 ~ p`؟","options":["كل فقرة تأتي بعد h2 داخل الأب نفسه","الفقرة التالية لـ h2 مباشرة فقط","كل فقرة داخل h2","الفقرات التي تسبق h2"],"answer":0,"explain":"‏`~` هي الأخ العام: تختار كل الأشقاء اللاحقين المطابقين، ولو فصل بينها عناصر أخرى. التالي المباشر فقط يُكتب بـ `h2 + p`."},{"q":"ما الذي يختاره `a[href$=\".pdf\"]`؟","options":["الروابط التي تنتهي قيمتها بـ .pdf","الروابط التي تبدأ بـ .pdf","الروابط التي تحتوي .pdf في أي موضع","كل الروابط لأن href سمة موجودة"],"answer":0,"explain":"‏`$=` تختبر نهاية القيمة. البداية `^=`، والاحتواء في أي موضع `*=`. وجود السمة وحده يُكتب `[href]`."},{"q":"ما أولوية المحدِّد `#header .nav a`؟","options":["(0,1,1)","(1,1,1)","(0,2,1)","(1,0,0)"],"answer":1,"explain":"معرّف واحد (`#header`)، صنف واحد (`.nav`)، عنصر واحد (`a`)؛ فالناتج (1,1,1) ويُقرأ كثلاثة أعمدة مستقلة لا كرقم واحد."},{"q":"ماذا تفعل الفاصلة في `h1, h2 { color: teal; }`؟","options":["تجمع المحدِّدين في قاعدة واحدة تُطبَّق على كل منهما","تعني أن h2 داخل h1","ترفع الأولوية إلى مستوى المعرّف","تلغي القاعدة إن لم يوجد h2"],"answer":0,"explain":"هي اختصار للكتابة فقط؛ تُعامَل كل قائمة كقاعدة مستقلة بأولويتها الخاصة، ولا ترفع الأولوية ولا تنشئ علاقة بين العنصرين."}],"tasks":[{"id":"css-02-t1","title":"قائمة تنقل بلا أصناف زائدة","brief":"نسّق قائمة التنقل في المحرر باستخدام `.menu` فقط كصنف على الحاوية، دون إضافة أصناف جديدة إلى `li` أو `a` (العنصر النشط يحمل الصنف `active` أصلًا). المطلوب: `.menu ul` بلا نقاط (`list-style: none`) وبحشوة `0` وعرض `flex`، و`.menu a` بلا خط تحت وبلون `#1d4ed8`، و`.menu .active a` بلون `#b91c1c` ووزن خط `700`.","steps":["ابدأ بـ `.menu ul` لتصفير القائمة وتحويلها إلى صف","نسّق كل الروابط بقاعدة `.menu a`","خصص العنصر النشط بـ `.menu .active a`"],"files":{"html":"<!-- لا تضف أصنافًا: استخدم العلاقات بين العناصر -->\n<nav class=\"menu\">\n  <ul>\n    <li><a href=\"/\">الرئيسية<\/a><\/li>\n    <li class=\"active\"><a href=\"/offers\">العروض<\/a><\/li>\n    <li><a href=\"/contact\">اتصل بنا<\/a><\/li>\n  <\/ul>\n<\/nav>","css":"/* اكتب المحدِّدات العلائقية هنا */\n"},"checks":[{"kind":"cssDecl","label":"قائمة .menu في صف أفقي","selector":".menu ul","prop":"display","regex":"flex"},{"kind":"cssDecl","label":"روابط بلا خط تحت","selector":".menu a","prop":"text-decoration","regex":"none"},{"kind":"cssDecl","label":"الرابط النشط بخط عريض","selector":".menu .active a","prop":"font-weight","regex":"700|bold"},{"kind":"cssCount","label":"قاعدتان على الأقل تعلنان color","prop":"color","min":2},{"kind":"selector","label":"ثلاثة عناصر li في القائمة","sel":".menu li","min":3}],"hint":"المسافة تعني «داخل»: `.menu a` تصل إلى الروابط في العمق. ولتمييز العنصر النشط استخدم `.menu .active a` لا `.active a` وحدها.","solution":{"html":"<nav class=\"menu\">\n  <ul>\n    <li><a href=\"/\">الرئيسية<\/a><\/li>\n    <li class=\"active\"><a href=\"/offers\">العروض<\/a><\/li>\n    <li><a href=\"/contact\">اتصل بنا<\/a><\/li>\n  <\/ul>\n<\/nav>","css":".menu ul {\n  list-style: none;\n  padding: 0;\n  display: flex;\n  gap: 16px;\n}\n\n.menu a {\n  color: #1d4ed8;\n  text-decoration: none;\n}\n\n.menu .active a {\n  color: #b91c1c;\n  font-weight: 700;\n}\n"}},{"id":"css-02-t2","title":"تمييز الروابط بالسمة لا بالصنف","brief":"في المحرر أربعة روابط مختلفة. دون إضافة أي صنف جديد، ميّزها بمحددات السمات: `nav a` بلون `#1d4ed8` وبلا خط تحت، والروابط التي تبدأ بـ `https://` بوزن خط `700`، والتي تنتهي بـ `.pdf` بلون `#b91c1c`، والتي تبدأ بـ `mailto:` بحد سفلي `2px solid #0f766e`.","steps":["ابدأ بقاعدة `nav a` العامة","أضف `a[href^=\"https://\"]` للسعر العريض","أكمل بـ `a[href$=\".pdf\"]` و`a[href^=\"mailto:\"]`"],"files":{"html":"<!-- لا تضف أصنافًا: استخدم محددات السمات -->\n<nav class=\"links\">\n  <a href=\"https://developer.mozilla.org\">مرجع MDN<\/a>\n  <a href=\"/files/catalog.pdf\">كتالوج المنتجات<\/a>\n  <a href=\"mailto:sales@dates.sa\">مراسلة المبيعات<\/a>\n  <a href=\"#offers\">العروض<\/a>\n<\/nav>","css":"/* استخدم محددات السمات: [href^=] و[href$=] */\n"},"checks":[{"kind":"cssDecl","label":"روابط بلا خط تحت","selector":"nav a","prop":"text-decoration","regex":"none"},{"kind":"cssDecl","label":"الروابط الخارجية عريضة","selector":"a[href^=\"https://\"]","prop":"font-weight","regex":"700|bold"},{"kind":"cssDecl","label":"ملفات PDF بلون مميز","selector":"a[href$=\".pdf\"]","prop":"color","regex":"#b91c1c"},{"kind":"cssDecl","label":"روابط البريد بحد سفلي","selector":"a[href^=\"mailto:\"]","prop":"border-bottom","regex":"2px"},{"kind":"cssCount","label":"قاعدتان على الأقل تعلنان color","prop":"color","min":2}],"hint":"ضع القيمة بين علامتي تنصيص داخل القوسين: `a[href$=\".pdf\"]`. وبدون علامات تنصيص تعمل القيم البسيطة أيضًا، لكن التنصيص أوضح وأأمن.","solution":{"html":"<nav class=\"links\">\n  <a href=\"https://developer.mozilla.org\">مرجع MDN<\/a>\n  <a href=\"/files/catalog.pdf\">كتالوج المنتجات<\/a>\n  <a href=\"mailto:sales@dates.sa\">مراسلة المبيعات<\/a>\n  <a href=\"#offers\">العروض<\/a>\n<\/nav>","css":"nav a {\n  color: #1d4ed8;\n  text-decoration: none;\n}\n\na[href^=\"https://\"] {\n  font-weight: 700;\n}\n\na[href$=\".pdf\"] {\n  color: #b91c1c;\n}\n\na[href^=\"mailto:\"] {\n  border-bottom: 2px solid #0f766e;\n}\n"}}],"summary":["المحدِّد شرط يمر عليه المتصفح عنصرًا عنصرًا، لا اسمًا لشيء","الصنف للتنسيق القابل لإعادة الاستخدام، والمعرّف لسلوك فريد في الصفحة","المسافة تعني أي عمق، و> تعني الجيل الأول، و+/~ تخصّان الأشقاء","محددات السمات تصف المعنى الموجود في HTML بلا أصناف إضافية","الأولوية ثلاثة أعمدة تُقارن من اليسار لليمين، لا رقم واحد"]},{"id":"css-03","track":"css","chapter":"CSS · الأساسيات","order":3,"title":"المحددات الزائفة والعناصر الزائفة","subtitle":"تنسّق العنصر في حالته وفي أجزائه التي لا وجود لها في HTML: عند المرور، عند التركيز، الصفوف الفردية، والنقطة قبل النص.","minutes":22,"level":"متوسط","objectives":["تفرّق بين الحالة الزائفة `:` والعنصر الزائف `::` وتستخدم كليهما في موضعه","تنسّق حالات التفاعل والنماذج دون أن تُفسد تجربة لوحة المفاتيح","تصل إلى العناصر بالموقع بين أخوتها وبـ nth-child بأنماط an+b","تستخدم :is و:where و:has وتعرف أثر كل منها على الأولوية"],"theory":[{"type":"h","text":"نقطتان أم أربع؟"},{"type":"p","text":"هذه المحددات تحل مشكلة لا تحلها الأصناف: الحالة أو الجزء لا وجود له في HTML. لا تستطيع كتابة `class=\"hover\"` على عنصر لأن الحالة تتبدل مئة مرة في الثانية، ولا تستطيع إضافة وسم للنقطة التي تسبق نصًا لأنها ليست عنصرًا في الشجرة. النقطتان `:` للحالة (pseudo-class)، والأربع `::` للجزء (pseudo-element)."},{"type":"compare","left":{"title":"HTML: لا شيء يصف الحالة","code":"<button class=\"btn\">أضف إلى السلة<\/button>\n<p class=\"note\">السعر شامل الضريبة<\/p>"},"right":{"title":"CSS: الحالة والجزء","code":".btn:hover { background: #115e59; }\n.btn:focus-visible { outline: 3px solid #5eead4; }\n.note::before { content: \"* \"; }"}},{"type":"h","text":"حالات التفاعل"},{"type":"table","head":["الحالة","متى تنطبق"],"rows":[["`:hover`","المؤشر فوق العنصر (لا وجود لها على شاشة اللمس وحدها)"],["`:focus`","العنصر يستقبل التركيز: نقرة، أو Tab، أو برمجة"],["`:focus-visible`","التركيز جاء من لوحة المفاتيح أو يحتاج مؤشرًا واضحًا"],["`:active`","اللحظة التي يُضغط فيها العنصر"],["`:visited`","رابط زاره المستخدم سابقًا"]]},{"type":"code","lang":"css","code":".btn {\n  background: #0f766e;\n  color: #ffffff;\n}\n.btn:hover { background: #115e59; }\n.btn:active { transform: translateY(1px); }\n.btn:focus-visible {\n  outline: 3px solid #5eead4;\n  outline-offset: 2px;\n}","caption":"الحالة تُضاف إلى المحدِّد لا إلى الوسم"},{"type":"note","tone":"warn","title":"‏:visited ليست أداة تتبع","text":"المتصفح يقيّد ما يمكن تغييره في الرابط المزار إلى خصائص الألوان وبعض خصائص الرسم، ولا يسمح بقراءة `getComputedStyle` للون الزيارة. هذا حماية لخصوصية المستخدم، فلا تبنِ على `:visited` أي منطق."},{"type":"h","text":"حالات النماذج"},{"type":"table","head":["الحالة","تنطبق على"],"rows":[["`:checked`","مربع اختيار أو زر راديو محدد"],["`:disabled`","حقل معطّل لا يقبل التفاعل"],["`:enabled`","حقل قابل للتفاعل"],["`:required`","حقل مطلوب (يحمل السمة required)"],["`:invalid`","قيمة الحقل لا تحقق شروط التحقق الحالية"],["`:placeholder-shown`","الحقل يعرض نصه الإرشادي، أي أنه فارغ"]]},{"type":"code","lang":"css","code":"input:focus { border-color: #0f766e; }\ninput:required { border-inline-start: 3px solid #b91c1c; }\ninput:invalid:not(:placeholder-shown) { border-color: #b91c1c; }\ninput:disabled { background: #f1f5f9; color: #94a3b8; }\ninput[type=\"checkbox\"]:checked + label { font-weight: 700; }","caption":"تنسيق الحقل حسب حالته الحقيقية"},{"type":"note","tone":"tip","title":"فخ :invalid عند فتح الصفحة","text":"الحقل المطلوب الفارغ غير صالح من اللحظة الأولى، فيظهر إطار أحمر قبل أن يكتب المستخدم حرفًا. الحل الشائع: `input:invalid:not(:placeholder-shown)` أي «غير صالح **و** ليس فارغًا»، أو استخدام `:user-invalid` حيث يدعمه المتصفح."},{"type":"h","text":"المحددات البنيوية"},{"type":"p","text":"هذه المحددات لا تنظر إلى الصنف بل إلى **الموقع** بين الأخوة. `:first-child` يعني «أول ابن لأبيه»، لا «أول عنصر من نوعه»، وهذا أشهر التباس في CSS: `p:first-child` لا تطابق شيئًا إذا سبق الفقرةَ عنوانٌ داخل الأب نفسه."},{"type":"code","lang":"css","code":"li:first-child { border-top: 0; }\nli:last-child { border-bottom: 0; }\nli:only-child { margin: 0 auto; }\n\n/* الأنماط an+b */\ntr:nth-child(odd) { background: #f8fafc; }\ntr:nth-child(even) { background: #f1f5f9; }\ntr:nth-child(3n) { color: #0f766e; }\ntr:nth-child(2n + 1) { border-top: 1px solid #e2e8f0; }\n\np:nth-of-type(2) { font-weight: 700; }","caption":"الموقع بين الأخوة يحدد المطابقة"},{"type":"table","head":["الصيغة","تختار"],"rows":[["`odd` = `2n+1`","الفردي: 1، 3، 5…"],["`even` = `2n`","الزوجي: 2، 4، 6…"],["`3n`","كل ثالث: 3، 6، 9…"],["`2n+3`","بدءًا من الثالث ثم كل ثاني: 3، 5، 7…"],["`-n+3`","أول ثلاثة عناصر فقط"]]},{"type":"note","tone":"warn","title":"‏:nth-child أم :nth-of-type؟","text":"`nth-child` يعدّ **كل** الأخوة، و`nth-of-type` يعدّ أخوة الوسم نفسه فقط. في حاوية فيها `h2` ثم ثلاث فقرات: `p:nth-child(2)` تطابق الفقرة الأولى، أما `p:nth-of-type(2)` فتطابق الثانية."},{"type":"h","text":"‏:not و:is و:where و:has"},{"type":"p","text":"هذه الأربع تعمل كدوال تأخذ محددات كوسائط. `:not()` تستثني، و`:is()` تختصر قائمة بدائل، و`:where()` مثل `:is` لكن بأولوية صفر، و`:has()` تختار الأب بناءً على ما يحتويه — أي أنها تنظر إلى أسفل الشجرة بعد أن كانت CSS تنظر إلى أعلى فقط."},{"type":"code","lang":"css","code":"/* استثناء */\nli:not(:last-child) { border-bottom: 1px solid #e2e8f0; }\n\n/* اختصار بدائل */\n:is(h1, h2, h3) + p { margin-top: 0; }\n\n/* نفس الاختصار بأولوية صفر */\n:where(h1, h2, h3) { margin-block: 1.5em 0.5em; }\n\n/* الأب الذي يحتوي على شيء */\n.card:has(img) { padding: 0; }\n.card:has(.badge) { border-color: #0f766e; }","caption":"أربع أدوات لوصف شروط مركّبة"},{"type":"p","text":"الفرق العملي بين `:is` و`:where` هو الأولوية وحدها. `:is(.a, #b)` تأخذ أولوية **أقوى** وسيط داخلها، أي (1,0,0) هنا، وقد تفاجئك. أما `:where(...)` فأولويتها (0,0,0) دائمًا، ولهذا تُستخدم في أنماط الأساس والتصفير حيث تريد أن يسهل تجاوزها لاحقًا."},{"type":"table","head":["الصيغة","الأولوية","الاستخدام"],"rows":[["`:is(.a, #b)`","(1,0,0)","اختصار قوائم مع الحفاظ على قوة المحدد"],["`:where(.a, #b)`","(0,0,0)","أنماط أساس يسهل تجاوزها"],["`:not(.a)`","أولوية الوسيط","استثناء عنصر من قاعدة"],["`:has(.a)`","أولوية الوسيط","تنسيق الأب حسب محتواه"]]},{"type":"h","text":"العناصر الزائفة"},{"type":"p","text":"العنصر الزائف ينشئ **جزءًا** من العنصر يمكن تنسيقه. `::before` و`::after` ينشئان صندوقًا داخل العنصر قبل محتواه وبعده، ولا يظهران إلا إذا أعلنت `content` ولو فارغًا `content: \"\"`؛ وهما في السلوك `inline` افتراضيًا حتى تغيّر `display`."},{"type":"table","head":["العنصر الزائف","ماذا يمثّل"],"rows":[["`::before`","محتوى يُدرج قبل محتوى العنصر"],["`::after`","محتوى يُدرج بعد محتوى العنصر"],["`::first-letter`","الحرف الأول من الكتلة، لتنسيق الاستهلال"],["`::first-line`","السطر الأول كما يراه المتصفح بعد التنسيق"],["`::selection`","النص الذي حدده المستخدم"],["`::placeholder`","نص `placeholder` داخل الحقل"],["`::marker`","النقطة أو الرقم في عنصر القائمة"],["`::file-selector-button`","زر اختيار الملف في `input type=\"file\"`"]]},{"type":"code","lang":"css","code":"blockquote::before {\n  content: \"”\";\n  font-size: 40px;\n  color: #0f766e;\n}\n\np::first-letter { font-size: 1.6em; font-weight: 700; }\np::first-line { letter-spacing: 0.02em; }\n::selection { background: #99f6e4; }\ninput::placeholder { color: #94a3b8; }\nli::marker { color: #0f766e; }\ninput[type=\"file\"]::file-selector-button {\n  padding: 8px 14px;\n  border: 0;\n  border-radius: 6px;\n  background: #0f766e;\n  color: #fff;\n}","caption":"أجزاء لا وجود لها في HTML، لكنها قابلة للتنسيق"},{"type":"note","tone":"info","title":"‏content للنص الزخرفي فقط","text":"المحتوى الذي تضيفه `::before` و`::after` لا يدخل في النص المنسوخ ولا تقرأه معظم قارئات الشاشة. لا تستخدمه لرسائل مهمة أو لعلامات إلزامية، بل استخدم HTML حقيقيًا."},{"type":"terms","items":[{"term":"حالة زائفة `:`","desc":"تنسّق عنصرًا موجودًا في حالة معينة مثل `:hover` و`:checked`."},{"term":"عنصر زائف `::`","desc":"ينشئ جزءًا من العنصر يمكن تنسيقه مثل `::before` و`::marker`."},{"term":"‏an+b","desc":"نمط عدّ في `nth-child`: `2n` الزوجي، `2n+1` الفردي، `3n` كل ثالث."},{"term":"‏:where() بأولوية صفر","desc":"مثل `:is` لكنها لا تزيد الأولوية، فتُستخدم لأنماط الأساس."},{"term":"‏:has()","desc":"تختار الأب حسب ما يحتويه من عناصر، عكس اتجاه البحث المعتاد."}]}],"examples":[{"title":"الماوس ولوحة المفاتيح","prompt":"ما الذي يتغير عند مرور الماوس، وما الذي يتغير عند الوصول بـ Tab؟ ولماذا لم نستخدم `:focus` وحدها؟","answer":"بالماوس يتغير لون الخلفية فقط. بالوصول بـ Tab يتغير اللون أيضًا ويظهر إطار خارجي بلون فاتح. استخدمنا `:focus-visible` ليظهر الإطار لمن يتنقل بلوحة المفاتيح دون أن يظهر عند النقر بالماوس.","explain":"`:focus` تنطبق على أي تركيز، بما فيه النقرة، فيظهر الإطار لكل من ينقر بالماوس ويراه تشويشًا. `:focus-visible` يترك القرار للمتصفح: يعرض المؤشر حين يكون التركيز قادمًا من لوحة المفاتيح أو حين يحتاجه المستخدم فعلًا. لاحظ أن الترتيب مهم: قاعدة الحالة تأتي بعد القاعدة الأساسية وإلا غلبها اللون الأساسي عند التساوي.","html":"<button class=\"btn\">أضف إلى السلة<\/button>\n<a class=\"btn\" href=\"#help\">تحتاج مساعدة؟<\/a>","css":".btn {\n  display: inline-block;\n  padding: 10px 18px;\n  background: #0f766e;\n  color: #ffffff;\n  border: 0;\n  border-radius: 6px;\n}\n.btn:hover {\n  background: #115e59;\n}\n.btn:focus-visible {\n  outline: 3px solid #5eead4;\n  outline-offset: 2px;\n}"},{"title":"تخطيط صفوف الجدول","prompt":"أي صفوف البيانات تصير رمادية؟ وهل يتأثر صف العنوان؟","answer":"الصف الثاني والرابع (متقدمة ومؤسسات) لأن العدّ يبدأ داخل `tbody`، وصف العنوان في `thead` لا يدخل في العدّ أصلًا. والصف الأخير بخط عريض عبر `:last-child`.","explain":"‏`nth-child` تعدّ الأخوة داخل الأب نفسه، و`thead` أب منفصل عن `tbody`. ولو كتبت `tr:nth-child(odd)` على مستوى الجدول لاختلط العدّ، ولهذا نقيّد المحدِّد بـ `.prices tbody tr`.","html":"<table class=\"prices\">\n  <thead>\n    <tr><th>الخطة<\/th><th>السعر<\/th><\/tr>\n  <\/thead>\n  <tbody>\n    <tr><td>أساسية<\/td><td>19<\/td><\/tr>\n    <tr><td>متقدمة<\/td><td>39<\/td><\/tr>\n    <tr><td>احترافية<\/td><td>79<\/td><\/tr>\n    <tr><td>مؤسسات<\/td><td>199<\/td><\/tr>\n  <\/tbody>\n<\/table>","css":".prices {\n  border-collapse: collapse;\n  width: 100%;\n}\n.prices th,\n.prices td {\n  padding: 8px 12px;\n  border-bottom: 1px solid #e2e8f0;\n  text-align: right;\n}\n.prices tbody tr:nth-child(even) {\n  background: #f1f5f9;\n}\n.prices tbody tr:last-child td {\n  font-weight: 700;\n}"},{"title":"الأب يعرف ما بداخله","prompt":"أي بطاقة تحصل على حد أخضر ونجمة قبل اسمها؟ ولماذا لم تحتج إلى صنف إضافي على البطاقة؟","answer":"البطاقة الأولى فقط، لأنها الوحيدة التي تحتوي على `.badge`. الثانية بقيت بحد رمادي وبلا نجمة.","explain":"‏`.card:has(.badge)` تختار البطاقة بشرط احتوائها على شارة، و`:has` تنظر إلى الأبناء بينما المحددات التقليدية تنظر إلى الآباء. والنجمة نفسها من `::before` مع `content`، وهي زخرفة لا تُقرأ كنص.","html":"<div class=\"card\">\n  <p class=\"name\">تمر سكري<\/p>\n  <span class=\"badge\">جديد<\/span>\n<\/div>\n<div class=\"card\">\n  <p class=\"name\">تمر خلاص<\/p>\n<\/div>","css":".card {\n  padding: 14px;\n  border: 1px solid #e2e8f0;\n  border-radius: 8px;\n  margin-bottom: 12px;\n}\n.card:has(.badge) {\n  border-color: #0f766e;\n}\n.card:has(.badge) .name::before {\n  content: \"* \";\n  color: #0f766e;\n}\n.badge {\n  background: #0f766e;\n  color: #ffffff;\n  padding: 2px 8px;\n  border-radius: 999px;\n  font-size: 12px;\n}"}],"quiz":[{"q":"ما الفرق الجوهري بين `:hover` و`::before`؟","options":["لا فرق، كلاهما اختصار للنقطتين","الأولى حالة لعنصر موجود، والثانية جزء يُنشأ داخل العنصر","الأولى تعمل في HTML والثانية في CSS فقط","الثانية أقدم ولا تُستخدم اليوم"],"answer":1,"explain":"الحالة الزائفة `:` تصف عنصرًا موجودًا في وضع معين، والعنصر الزائف `::` يمثّل جزءًا غير موجود في شجرة HTML مثل صندوق قبل المحتوى. النقطتان المزدوجة هي الصيغة الحديثة، وتُقبل المفردة تاريخيًا لأربعة عناصر زائفة قديمة."},{"q":"ما أولوية `:where(.a, #b)`؟","options":["(0,0,0)","(0,1,0)","(1,0,0)","تساوي أولوية أعلى وسيط داخلها"],"answer":0,"explain":"‏`:where` أُضيفت تحديدًا لتكون أولويتها صفرًا مهما كان داخلها، فتصلح لأنماط الأساس. أما `:is(.a, #b)` فتأخذ أولوية أقوى وسيط وهي (1,0,0)."},{"q":"متى لا تطابق `p:first-child` فقرةً هي أول فقرة في الصفحة؟","options":["إذا كان الأب يحمل صنفًا","إذا سبق الفقرةَ أي عنصر آخر داخل الأب نفسه","إذا كانت الفقرة داخل div","لا يمكن أن يحدث ذلك"],"answer":1,"explain":"المحدِّد يعني «أول ابن لأبيه»، لا «أول عنصر من نوعه». فوجود `h2` قبل الفقرة داخل الأب نفسه يجعل أول ابن هو العنوان، فلا تطابق القاعدة. الحل `p:first-of-type` أو `:nth-of-type`."},{"q":"أي عناصر `li` تختارها `li:nth-child(3n)`؟","options":["كل العناصر الفردية","العناصر 3 و6 و9 وما بعدها بمضاعفات الثلاثة","العناصر من الثالث إلى الأخير","العنصر الثالث فقط"],"answer":1,"explain":"الصيغة `an+b` تعني مضاعفات `a` بدءًا من `b`. فـ`3n` تعني 3، 6، 9… و`3n+1` تعني 1، 4، 7… و`-n+3` تعني أول ثلاثة فقط."},{"q":"لماذا يُفضّل `:focus-visible` على `:focus` في أزرار الموقع؟","options":["لأن `:focus` لا تعمل في المتصفحات الحديثة","لأنها تعرض مؤشر التركيز عند التنقل بلوحة المفاتيح دون إظهاره عند كل نقرة بالماوس","لأنها تمنع التركيز على العنصر أصلًا","لأنها تعمل على العناصر المعطّلة فقط"],"answer":1,"explain":"‏`:focus` تنطبق على أي تركيز فيظهر الإطار حتى بالنقر، و`:focus-visible` تترك للمتصفح تقدير الحاجة إلى المؤشر. النتيجة: إتاحة أفضل لمن يتنقل بلوحة المفاتيح، ومظهر أنظف لمن يستخدم الماوس."}],"tasks":[{"id":"css-03-t1","title":"زر يتغير عند المرور والتركيز","brief":"نسّق الأزرار التي تحمل الصنف `btn` (رابط وزر في المحرر): اجعل `.btn` بحشوة `10px 18px` وخلفية `#0f766e` ولون نص `#ffffff` وزوايا `6px` وبلا خط تحت، ثم `.btn:hover` بخلفية أغمق `#115e59`، و`.btn:focus-visible` بإطار `3px solid #5eead4` وإزاحة `2px`.","steps":["اكتب قاعدة `.btn` الأساسية أولًا","أضف حالة المرور بخلفية أغمق","أضف `:focus-visible` بإطار واضح مع `outline-offset`"],"files":{"html":"<!-- لا تغيّر الهيكل: التنسيق كله من CSS -->\n<button class=\"btn\">أضف إلى السلة<\/button>\n<a class=\"btn\" href=\"#help\">تحتاج مساعدة؟<\/a>","css":"/* الحالة تُكتب ملتصقة بالمحدِّد: .btn:hover */\n"},"checks":[{"kind":"cssDecl","label":"الزر بلا خط تحت","selector":".btn","prop":"text-decoration","regex":"none"},{"kind":"cssDecl","label":"حالة المرور بخلفية أغمق","selector":".btn:hover","prop":"background","regex":"#115e59"},{"kind":"cssDecl","label":"إطار تركيز بسماكة 3px","selector":".btn:focus-visible","prop":"outline","regex":"3px"},{"kind":"cssDecl","label":"إزاحة الإطار عن الحافة","selector":".btn:focus-visible","prop":"outline-offset","regex":"2px"},{"kind":"selector","label":"عنصران يحملان الصنف btn","sel":".btn","min":2}],"hint":"لا تكتب مسافة قبل الحالة: `.btn:hover` صحيح، و`.btn :hover` يعني شيئًا آخر تمامًا (حالة على عنصر داخل الزر).","solution":{"html":"<button class=\"btn\">أضف إلى السلة<\/button>\n<a class=\"btn\" href=\"#help\">تحتاج مساعدة؟<\/a>","css":".btn {\n  display: inline-block;\n  padding: 10px 18px;\n  background: #0f766e;\n  color: #ffffff;\n  border: 0;\n  border-radius: 6px;\n  text-decoration: none;\n}\n\n.btn:hover {\n  background: #115e59;\n}\n\n.btn:focus-visible {\n  outline: 3px solid #5eead4;\n  outline-offset: 2px;\n}\n"}},{"id":"css-03-t2","title":"جدول أسعار بصفوف مخططة وعلامات قبل النص","brief":"نسّق جدول الأسعار: اجعل `.prices` بـ `border-collapse: collapse` وعرض `100%`، وخلايا `th` و`td` بحشوة `10px` وحدّ سفلي `1px solid #e2e8f0` ومحاذاة يمين، وصفوف `tbody` الزوجية بخلفية `#f1f5f9`، والصف الأخير بخط `700`، وأضف قبل أول خلية في كل صف (ما عدا الأخير) علامة `content: \"* \"` بلون `#0f766e` باستخدام `::before`.","steps":["ابدأ بتنسيق الجدول والخلايا","لوّن الصفوف الزوجية بـ nth-child(even)","أضف ::before مع content للخلية الأولى مع استثناء الصف الأخير"],"files":{"html":"<!-- الجدول جاهز: كل المطلوب في CSS -->\n<table class=\"prices\">\n  <caption>خطط الاشتراك<\/caption>\n  <thead>\n    <tr><th>الخطة<\/th><th>السعر<\/th><\/tr>\n  <\/thead>\n  <tbody>\n    <tr><td>أساسية<\/td><td>19<\/td><\/tr>\n    <tr><td>متقدمة<\/td><td>39<\/td><\/tr>\n    <tr><td>احترافية<\/td><td>79<\/td><\/tr>\n    <tr><td>مؤسسات<\/td><td>199<\/td><\/tr>\n  <\/tbody>\n<\/table>","css":"/* nth-child تعدّ الأخوة داخل tbody وحده */\n"},"checks":[{"kind":"cssDecl","label":"الصفوف الزوجية بخلفية رمادية","selector":".prices tbody tr:nth-child(even)","prop":"background","regex":"#f1f5f9"},{"kind":"computed","label":"الصف الأخير بخط عريض","sel":".prices tbody tr:last-child td","prop":"font-weight","regex":"700|bold"},{"kind":"ruleSel","label":"علامة ::before بمحتوى","selector":"::before","prop":"content","regex":"\\S"},{"kind":"ruleSel","label":"العلامة بلون مميز","selector":"::before","prop":"color","regex":"#0f766e"},{"kind":"selector","label":"أربعة صفوف بيانات","sel":".prices tbody tr","min":4}],"hint":"استثنِ الصف الأخير داخل المحدِّد نفسه: `tr:not(:last-child) td:first-child::before`. وتذكّر أن `::before` لا يظهر بلا `content`.","solution":{"html":"<table class=\"prices\">\n  <caption>خطط الاشتراك<\/caption>\n  <thead>\n    <tr><th>الخطة<\/th><th>السعر<\/th><\/tr>\n  <\/thead>\n  <tbody>\n    <tr><td>أساسية<\/td><td>19<\/td><\/tr>\n    <tr><td>متقدمة<\/td><td>39<\/td><\/tr>\n    <tr><td>احترافية<\/td><td>79<\/td><\/tr>\n    <tr><td>مؤسسات<\/td><td>199<\/td><\/tr>\n  <\/tbody>\n<\/table>","css":".prices {\n  border-collapse: collapse;\n  width: 100%;\n}\n\n.prices th,\n.prices td {\n  padding: 10px;\n  border-bottom: 1px solid #e2e8f0;\n  text-align: right;\n}\n\n.prices tbody tr:nth-child(even) {\n  background: #f1f5f9;\n}\n\n.prices tbody tr:last-child td {\n  font-weight: 700;\n}\n\n.prices tbody tr:not(:last-child) td:first-child::before {\n  content: \"* \";\n  color: #0f766e;\n}\n"}}],"summary":["‏: للحالة و:: للجزء؛ وكلتاهما تنسّق ما لا يمكن وسمه في HTML","‏:hover و:active للتفاعل، و:focus-visible لإتاحة أفضل للوحة المفاتيح","‏:required و:invalid و:placeholder-shown تنسّق النماذج حسب حالتها الحقيقية","‏nth-child تعدّ كل الأخوة، وnth-of-type تعدّ الوسم نفسه فقط","‏:is تأخذ أولوية أقوى وسيط، و:where أولويتها صفر دائمًا، و:has تنظر إلى الأبناء"]},{"id":"css-04","track":"css","chapter":"CSS · الألوان والنصوص","order":4,"title":"الألوان في CSS","subtitle":"تكتب اللون بأربع صيغ مختلفة، وتفرّق بين شفافية اللون وشفافية العنصر، وتختار ألوانًا يقرأها الجميع.","minutes":16,"level":"مبتدئ","objectives":["تفرّق بين color و background-color في كل عنصر","تكتب اللون بـ hex و rgb و hsl وتضيف الشفافية في كل صيغة","تستخدم transparent و currentColor لتوريث الألوان بذكاء","تختار opacity أو قناة alpha حسب ما تريد أن يشفّ فعليًا","تفحص تباين النص مع الخلفية قبل النشر"],"theory":[{"type":"h","text":"اللون خاصيتان لا واحدة"},{"type":"p","text":"`color` تلوّن **النص**، و`background-color` تلوّن **الخلفية**. أشهر خطأ للمبتدئ أن يكتب `color: black` وينتظر خلفية سوداء فيحصل على نص أسود على خلفية بيضاء. القاعدة: ما تراه خلف الحروف تضبطه `background-color`، والحروف نفسها تضبطها `color`."},{"type":"code","lang":"css","code":".card {\n  color: #1f2937;            /* لون النص */\n  background-color: #f8fafc; /* لون الخلفية */\n  border: 1px solid #cbd5e1;\n  padding: 16px;\n}","caption":"أول بطاقة ملوّنة"},{"type":"p","text":"تفصيل دقيق: خلفية `body` تنتقل إلى مساحة العرض كلها ما دام `html` بلا خلفية، ولهذا يبدو لون الصفحة كاملًا حتى لو كانت `body` قصيرة."},{"type":"h","text":"أسماء الألوان: 148 اسمًا جاهزًا"},{"type":"p","text":"CSS تعرف 148 اسمًا مثل `tomato` و`teal` و`rebeccapurple` و`gold`. ممتازة للتجربة السريعة وشرح فكرة، وسيئة لنظام تصميم: الأسماء قليلة ومتباعدة، ولا تعطيك الدرجة التي بين اسمين. لاحظ أن `gray` و`grey` اسما اللون نفسه، وأن `transparent` حالة خاصة."},{"type":"code","lang":"css","code":".alert {\n  background-color: tomato;\n  color: white;\n}\n\n.alert--info {\n  background-color: teal;\n  color: white;\n}","caption":"أسماء جاهزة للاختبار السريع"},{"type":"h","text":"hex: بثلاث أو ست أو ثماني خانات"},{"type":"p","text":"الصيغة `#RRGGBB` تجمع ثلاث قنوات، كل قناة من `00` إلى `ff` (أي 0–255). و`#f00` اختصار مزدوج لـ `#ff0000`. أضف خانتين في النهاية للشفافية `#RRGGBBAA`، أو استخدم الرباعية المختصرة `#RGBA`."},{"type":"table","head":["الصيغة","المعنى"],"rows":[["#fff","أبيض، اختصار #ffffff"],["#0f766e","أخضر مزرق داكن = rgb(15, 118, 110)"],["#0f766e80","اللون نفسه بشفافية 50% تقريبًا (80 = 128 من 255)"],["#0f78","اختصار رباعي يساوي #00ff7788"]]},{"type":"note","tone":"info","title":"لماذا 8 خانات؟","text":"لأن hex الحديث يحمل الشفافية داخله، فلم تبقَ حاجة لتحويل اللون إلى rgba() لمجرد أنك تريد خلفية شبه شفافة."},{"type":"h","text":"rgb() و rgba(): القنوات بالأرقام"},{"type":"p","text":"الصيغة القديمة `rgb(15, 118, 110)` بفواصل، والحديثة `rgb(15 118 110)` بمسافات مع شفافية بعد شرطة مائلة: `rgb(15 118 110 / 0.4)`. أما `rgba()` فهي اسم قديم ما زال يعمل، لكن `rgb()` الحديثة تقبل الشفافية نفسها، فلا سبب لكتابة rgba في كود جديد."},{"type":"code","lang":"css","code":".badge {\n  background-color: rgb(15 118 110 / 0.12);\n  color: rgb(15 118 110);\n  border: 1px solid rgb(15 118 110 / 0.4);\n  padding: 2px 10px;\n  border-radius: 999px;\n}","caption":"قنوات صريحة وشفافية موضعية"},{"type":"h","text":"hsl(): اللون كما يفكر فيه المصمم"},{"type":"p","text":"`hsl()` تقرأ اللون بثلاثة أرقام: **الدرجة** على عجلة من 0 إلى 360 (0 أحمر، 120 أخضر، 240 أزرق)، ثم **التشبع** 0–100%، ثم **الإضاءة** 0–100% حيث 0% أسود و100% أبيض. قوتها أن تغيير الإضاءة وحدها يعطيك نسخة أفتح أو أغمق من اللون نفسه، وهذا ما تحتاجه لحالة hover وللحدود والخلفيات الخفيفة."},{"type":"code","lang":"css","code":":root { --brand-h: 174; }\n\n.btn {\n  background-color: hsl(var(--brand-h) 72% 40%);\n  color: white;\n}\n.btn:hover {\n  background-color: hsl(var(--brand-h) 72% 33%);\n}\n.btn-ghost {\n  background-color: hsl(var(--brand-h) 72% 40% / 0.1);\n  color: hsl(var(--brand-h) 80% 24%);\n  border: 1px solid hsl(var(--brand-h) 72% 40% / 0.35);\n}","caption":"عائلة لون واحدة بثلاث درجات"},{"type":"note","tone":"warn","title":"خطأ شائع","text":"الرقم الثالث في hsl هو الإضاءة لا التشبع. الخلط بينهما يعطي ألوانًا باهتة أو صارخة بلا سبب واضح، ولهذا تُكتب دائمًا `hsl(174 72% 40%)` وليس `hsl(174 40% 72%)`."},{"type":"h","text":"صيغ أحدث: hwb و lab و lch و oklch"},{"type":"p","text":"`hwb()` تقرأ اللون كدرجة مع نسبة بياض وسواد: `hwb(174 10% 25%)`. و`lab()` و`lch()` تعملان في فضاء أوسع من sRGB فتمثلان ألوان شاشات P3، و`lch()` هي `lab` بإحداثيات قطبية. الأهم عمليًا `oklch()`: سطوعها أقرب إلى إدراك العين، فالتدرّج بين درجتين لا يمرّ بمنتصف رمادي باهت، وتوليد سلّم ألوان متساوي الخطوات يصبح ممكنًا."},{"type":"table","head":["الصيغة","الشكل","متى تستخدمها"],"rows":[["hwb()","hwb(174 10% 25%)","مزج بديهي مع الأبيض والأسود"],["lab()","lab(52% -35 -5)","ألوان خارج نطاق sRGB"],["lch()","lch(52% 35 190)","تعديل التشبع دون تغيير السطوع"],["oklch()","oklch(0.58 0.11 190)","سلالم ألوان وتدرّجات نظيفة"]]},{"type":"p","text":"الدعم جيد في المتصفحات الحديثة، لكن القاعدة الآمنة أن تكتب لونًا احتياطيًا قبله: `color: #0f766e;` ثم `color: oklch(0.55 0.11 190);`. المتصفح الذي لا يفهم السطر الثاني يتجاهله ويُبقي الأول."},{"type":"h","text":"transparent و currentColor"},{"type":"p","text":"`transparent` لون أسود بشفافية صفر، و`currentColor` كلمة تعني «خذ قيمة `color` المحسوبة لهذا العنصر». الثانية أذكى ما في CSS للأيقونات: تلوّن الأب فيتبع الابن تلقائيًا بلا تكرار للقيم."},{"type":"code","lang":"css","code":".icon { color: #0f766e; }\n.icon svg { fill: currentColor; stroke: currentColor; }\n\n.chip {\n  color: #0f766e;\n  border: 1px solid currentColor;\n  padding: 4px 12px;\n}\n.chip:hover { color: #134e4a; } /* الحدود تتبع اللون الجديد */","caption":"لون واحد يقود عنصرًا كاملًا"},{"type":"h","text":"opacity أم قناة alpha؟"},{"type":"p","text":"`opacity: 0.5` تجعل **العنصر كله** نصف شفاف: الخلفية والنص والحدود والظل والأبناء. أما `rgb(15 23 42 / 0.5)` فتجعل **اللون وحده** شفافًا ويبقى النص صريحًا. كما أن `opacity` تنشئ stacking context وقد تغيّر ترتيب العناصر فوق بعضها، وتخفض تباين النص فعليًا."},{"type":"compare","left":{"title":"HTML","code":"<div class=\"promo\">\n  <h3>خصم 30%<\/h3>\n  <p>على جميع الأقمشة<\/p>\n<\/div>"},"right":{"title":"CSS","code":".promo {\n  background-color: rgb(15 23 42 / 0.6);\n  color: #ffffff;\n  padding: 16px;\n}"}},{"type":"note","tone":"warn","title":"لا تُخفِ النص مع الخلفية","text":"استخدام opacity لتخفيف خلفية تحت نص يعني أن النص نفسه سيباهت ويفقد التباين المطلوب. استخدم قناة alpha في `background-color` واترك `color` كما هي."},{"type":"h","text":"color-scheme والوضع الليلي"},{"type":"p","text":"`color-scheme: light dark` تخبر المتصفح أن الصفحة تدعم الوضعين، فيلوّن عناصر النموذج وأشرطة التمرير وخلفية المستند حسب تفضيل المستخدم. وعند بناء ثيم داكن يدويًا اكتب `color-scheme: dark` أيضًا، وإلا بقي حقل الإدخال أبيض وسط صفحة سوداء. مع `prefers-color-scheme` والمتغيرات تحصل على تبديل كامل بلا تكرار."},{"type":"code","lang":"css","code":":root {\n  color-scheme: light dark;\n  --bg: #f8fafc;\n  --fg: #0f172a;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root { --bg: #0f172a; --fg: #e2e8f0; }\n}\n\nbody {\n  background-color: var(--bg);\n  color: var(--fg);\n}","caption":"ثيم يتبع النظام"},{"type":"h","text":"التباين قبل الجمال"},{"type":"p","text":"معيار WCAG يطلب 4.5:1 للنص العادي، و3:1 للنص الكبير (24px، أو 18.66px عريض) وحدود المكوّنات، و7:1 للمستوى AAA. لونان «متناسقان» قد يكونان غير مقروءين: `#f59e0b` على أبيض يبلغ 2.15:1 فقط، و`#94a3b8` يبلغ 2.56:1. أدوات المطوّر في المتصفح تعرض النسبة مباشرة عند فحص النص."},{"type":"list","items":["لا تنقل المعنى باللون وحده (خطأ/نجاح): أضف أيقونة أو كلمة","اجعل `:focus-visible` واضحًا بإطار سميك لا بتغيّر لون فقط","تذكّر أن خلفيات الصور و`opacity` تخفض التباين الفعلي لا المكتوب","اختبر الوضع الفاتح والداكن ووضع `forced-colors` في ويندوز"],"ordered":false},{"type":"note","tone":"tip","title":"طريقة عملية","text":"ابدأ بزوج واحد عالي التباين (نص وخلفية)، ثم اشتق منه الألوان الثانوية بتغيير الإضاءة في hsl أو oklch."},{"type":"terms","items":[{"term":"color","desc":"لون النص، ويورَّث للأبناء ويُستخدم كقيمة لـ currentColor."},{"term":"background-color","desc":"لون الخلفية، ويمتد افتراضيًا حتى الحافة الخارجية للحدود."},{"term":"قناة alpha","desc":"الخانة الرابعة في hex أو القيمة بعد الشرطة المائلة، تضبط شفافية اللون وحده."},{"term":"hsl()","desc":"لون بدرجة وتشبع وإضاءة، الأسهل في توليد درجات فاتحة وداكنة."},{"term":"currentColor","desc":"قيمة color المحسوبة للعنصر نفسه، تُستخدم في الحدود والأيقونات."},{"term":"opacity","desc":"شفافية العنصر بأكمله بما فيه الأبناء، وتنشئ stacking context."},{"term":"color-scheme","desc":"تفضيل فاتح/داكن يطبّقه المتصفح على عناصر النظام."}]}],"examples":[{"title":"بطاقة بست عشري وتباين محسوب","prompt":"ما لون الخلفية والنص؟ وهل التباين بينهما كافٍ لنص عادي؟","answer":"الخلفية `#0f766e` (أخضر مزرق داكن) والنص `#ecfdf5` (شبه أبيض). النسبة بينهما 5.2:1، أي فوق حد 4.5:1 المطلوب للنص العادي.","explain":"`#0f766e` تعني rgb(15, 118, 110) لأن 0f=15 و76=118 و6e=110. حساب التباين يعتمد على السطوع النسبي لا على الإحساس، ولهذا يُقاس بالأرقام لا بالذوق.","html":"<article class=\"card\">\n  <h3>كوب قهوة مختصة<\/h3>\n  <p>حمّص إثيوبي، تحميص فاتح، 250 جرامًا.<\/p>\n  <span class=\"price\">38 ريالًا<\/span>\n<\/article>","css":".card {\n  background-color: #0f766e;\n  color: #ecfdf5;\n  padding: 20px;\n  border-radius: 12px;\n  max-width: 320px;\n}\n.price {\n  display: inline-block;\n  margin-top: 8px;\n  background-color: #0f766e80;\n  padding: 2px 10px;\n  border-radius: 999px;\n}"},{"title":"ثلاث درجات من لون واحد","prompt":"لماذا تبدو الألوان الثلاثة من العائلة نفسها؟ وما الرقم الذي تغيّر فعليًا؟","answer":"لأن الدرجة 174 والتشبع ثابتان، وتغيّرت الإضاءة وحدها: 88% ثم 42% ثم 20%. النتيجة نسخة فاتحة وأساسية وداكنة من اللون نفسه.","explain":"هذا هو سبب تفضيل hsl في أنظمة التصميم: تعديل رقم واحد يعطي درجة مشتقة متوقعة، بينما في hex تحتاج حساب قنوات ثلاث.","html":"<div class=\"chips\">\n  <span class=\"chip light\">فاتح<\/span>\n  <span class=\"chip base\">أساسي<\/span>\n  <span class=\"chip dark\">داكن<\/span>\n<\/div>","css":".chips {\n  display: flex;\n  gap: 10px;\n  font-family: system-ui, sans-serif;\n}\n.chip {\n  padding: 8px 16px;\n  border-radius: 10px;\n  font-weight: 600;\n}\n.light {\n  background-color: hsl(174 60% 88%);\n  color: hsl(174 80% 20%);\n}\n.base {\n  background-color: hsl(174 72% 42%);\n  color: #ffffff;\n}\n.dark {\n  background-color: hsl(174 72% 20%);\n  color: hsl(174 60% 90%);\n}"},{"title":"opacity أمام قناة alpha","prompt":"البطاقتان تستخدمان الشفافية نفسها تقريبًا، فلماذا يبدو نص اليمنى أوضح؟","answer":"لأن اليسرى استخدمت `opacity: 0.5` فشفّت البطاقة كلها بما فيها النص، بينما اليمنى استخدمت `rgb(15 118 110 / 0.5)` فشفّت الخلفية وحدها وبقي النص أبيض صريحًا.","explain":"قناة alpha تُطبَّق على قيمة اللون نفسها فقط، أما opacity فتُطبَّق على العنصر كطبقة كاملة بعد رسمه.","html":"<div class=\"stage\">\n  <div class=\"panel ghost\">\n    <strong>opacity<\/strong>\n    <p>النص باهت مع الخلفية<\/p>\n  <\/div>\n  <div class=\"panel alpha\">\n    <strong>rgb / alpha<\/strong>\n    <p>النص صريح<\/p>\n  <\/div>\n<\/div>","css":".stage {\n  display: flex;\n  gap: 14px;\n  padding: 18px;\n  background-color: #e2e8f0;\n  border-radius: 14px;\n}\n.panel {\n  flex: 1;\n  padding: 16px;\n  border-radius: 10px;\n  background-color: #0f766e;\n  color: #ffffff;\n}\n.panel.ghost { opacity: 0.5; }\n.panel.alpha { background-color: rgb(15 118 110 / 0.5); }"}],"quiz":[{"q":"أي قيمة تساوي الل #0f766e","selector":".note","prop":"color","regex":"#0f766e"},{"kind":"computed","label":"إطار .note يستخدم currentColor (لون النص نفسه)","sel":".note","prop":"border-top-color","regex":"#0f766e|15,\\s*118,\\s*110"},{"kind":"sourceNot","label":"لا يوجد استخدام لـ opacity","regex":"opacity\\s*:"},{"kind":"computed","label":"خلفية .panel محسوبة كـ rgba","sel":".panel","prop":"background-color","regex":"rgba?\\(|color"}],"hint":"currentColor كلمة جاهزة تأخذ قيمة color للعنصر نفسه، فلا تحتاج تكرار اللون مرتين.","solution":{"html":"<section class=\"hero\">\n  <div class=\"panel\">\n    <h2>تخفيضات الصيف<\/h2>\n    <p>حتى 40% على الأجهزة الصغيرة.<\/p>\n  <\/div>\n  <p class=\"note\">الشحن مجاني فوق 200 ريال<\/p>\n<\/section>","css":".hero {\n  background-color: #e2e8f0;\n  padding: 24px;\n  border-radius: 16px;\n}\n\n.panel {\n  background-color: rgb(15 23 42 / 0.62);\n  color: #ffffff;\n  padding: 18px;\n  border-radius: 12px;\n}\n\n.note {\n  color: #0f766e;\n  border: 1px solid currentColor;\n  padding: 6px 12px;\n  border-radius: 999px;\n  display: inline-block;\n}"}}],"summary":["color للنص وbackground-color للخلفية، ولا تُخلط بينهما","hex و rgb و hsl تصف اللون نفسه بطرق مختلفة، والشفافية تُضاف في كل منها","hsl أسهل في توليد درجات فاتحة وداكنة من لون واحد","currentColor تنقل لون النص إلى الحدود والأيقونات تلقائيًا","opacity تشفّ العنصر كله، وقناة alpha تشفّ اللون وحده","لا تنشر زوجًا لونيًا قبل قياس تباينه"]},{"id":"html-05","track":"html","chapter":"HTML · الروابط والوسائط","order":5,"title":"الروابط والصور","subtitle":"من الصفر: كيف تنقل الزائر بين الصفحات وتعرض صورة بشكل صحيح.","minutes":20,"level":"مبتدئ","objectives":["تكتب رابطًا يعمل بـ a و href","تميّز المسار المطلق من النسبي","تفتح الرابط في تبويب جديد بأمان","تضيف صورة مع نص بديل مفيد"],"theory":[{"type":"h","text":"الرابط: وسم a من الصفر"},{"type":"p","text":"الرابط هو الجملة التي تضغط عليها فتنتقل لمكان آخر. الوسم `<a>` اختصار **anchor** (مرساة). وحده لا يعرف إلى أين يذهب، فنعطيه **السمة `href`** (عنوان ا >` تجمع مصطلحًا `<dt>` وشرحه `<dd>`."},{"type":"code","lang":"html","code":"<ul>\n  <li>فواكه\n    <ul><li>تفاح<\/li><\/ul>\n  <\/li>\n<\/ul>","caption":"التداخل داخل li"},{"type":"h","text":"الجداول: صفوف وخلايا"},{"type":"p","text":"الجدول للبيانات المنظمة فقط (أسعار، جداول زمنية) لا لتخطيط الصفحة. `<table>` الحاوية، `<tr>` صف، `<th>` خلية عنوان، `<td>` خلية بيانات. ونقسمه معنويًا إلى `<thead>` و`<tbody>`."},{"type":"code","lang":"html","code":"<table>\n  <thead><tr><th>المنتج<\/th><th>السعر<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>تمر<\/td><td>45<\/td><\/tr>\n  <\/tbody>\n<\/table>","caption":"جدول كامل"},{"type":"note","tone":"tip","title":"دمج الخلايا","text":"`colspan=\"2\"` تمدد الخلية عبر عمودين، و`rowspan` عبر صفين. وأضف `<caption>` أول الجدول لوصفه."},{"type":"h","text":"جداول أسهل قراءة: scope وcaption"},{"type":"p","text":"`caption` وصف الجدول، و`scope=\"col\"` على th يخبر قارئ الشاشة أن هذا عنوان عمود. وكرر نفس البنية في كل الجداول."},{"type":"code","lang":"html","code":"<table>\n  <caption>أسعار الأسبوع<\/caption>\n  <thead><tr><th scope=\"col\">المنتج<\/th><th scope=\"col\">السعر<\/th><\/tr><\/thead>\n  <tbody><tr><td>تمر<\/td><td>45<\/td><\/tr><\/tbody>\n  <tfoot><tr><td colspan=\"2\">الأسعار شاملة الضريبة<\/td><\/tr><\/tfoot>\n<\/table>","caption":"جدول كامل مع tfoot"},{"type":"note","tone":"warn","title":"تنبيه","text":"لا تستخدم الجدول لتخطيط الصفحة؛ للتخطيط Flex وGrid."}],"examples":[{"title":"أين الخطأ؟","prompt":"لماذا هذه القائمة غير صحيحة؟","answer":"النص وُضع مباشرة داخل ul بلا li.","explain":"الأبناء المباشرون لـ ul يجب أن يكونوا li فقط.","html":"<ul>تمر<li>قهوة<\/li><\/ul>","css":""},{"title":"كم عمودًا؟","prompt":"صف فيه td وtd colspan=2؟","answer":"ثلاثة أعمدة","explain":"colspan يحسب خليتين.","html":"<table><tr><td>1<\/td><td colspan='2'>2<\/td><\/tr><\/table>","css":""}],"quiz":[{"q":"أي قائمة للخطوات المرتبة؟","options":["ul","ol","dl","li"],"answer":1,"explain":"ol تضع أرقامًا."},{"q":"أين تُوضع القائمة المتداخلة؟","options":["بع ه حقول، وزر إرسال يرسل القيم إلى `action` بطريقة `method` (GET أو POST). كل حقل يحتاج سمة `name` وإلا لن تُرسل قيمته."},{"type":"code","lang":"html","code":"<form action=\"/signup\" method=\"post\">\n  <label for=\"em\">البريد<\/label>\n  <input id=\"em\" type=\"email\" name=\"email\" required>\n  <button type=\"submit\">سجّل<\/button>\n<\/form>","caption":"نموذج بسيط"},{"type":"h","text":"label: لا حقل بلا تسمية"},{"type":"p","text":"`label` يربط نصًا بحقل عبر `for` = قيمة `id` الحقل. فائدته: الضغط على النص يركّز الحقل، وقارئ الشاشة يعرف ما الحقل."},{"type":"h","text":"أنواع input"},{"type":"terms","items":[{"term":"type=text","desc":"نص عادي"},{"term":"type=email","desc":"بريد، والمتصفح يتحقق من الصيغة"},{"term":"type=password","desc":"نقاط بدل الحروف"},{"term":"type=number","desc":"رقم مع min وmax"},{"term":"type=checkbox","desc":"اختيار متعدد"},{"term":"type=radio","desc":"اختيار واحد: الأزرار تشترك في name واحد"}]},{"type":"p","text":"وللنص الطويل `<textarea>`، ولقائمة منسدلة `<select>` و`<option>`. السمة `required` تمنع الإرسال فارغًا، و`placeholder` تلميح لا يغني عن label."},{"type":"code","lang":"html","code":"<select name=\"city\">\n  <option value=\"r\">الرياض<\/option>\n  <option value=\"j\">جدة<\/option>\n<\/select>","caption":"قائمة منسدلة"},{"type":"note","tone":"warn","title":"placeholder ليس label","text":"يختفي عند الكتابة، فلا تعتمد عليه وحده."},{"type":"h","text":"التحقق المدمج"},{"type":"p","text":"المتصفح يتحقق قبل الإرسال دون JavaScript: `required` إلزامي، `minlength` و`maxlength` للطول، `min` و`max` للأرقام، `pattern` تعبير نمطي. وأضف `autocomplete` ليقترح المتصفح القيم."},{"type":"code","lang":"html","code":"<input type=\"text\" name=\"user\" required minlength=\"3\" maxlength=\"20\" autocomplete=\"username\">\n<input type=\"number\" name=\"qty\" min=\"1\" max=\"10\" value=\"1\">","caption":"قيود جاهزة"},{"type":"note","tone":"info","title":"ملاحظة","text":"التحقق في المتصفح لا يكفي؛ الخادم يتحقق دائمًا أيضًا."},{"type":"h","text":"تجميع الحق ief":"للصنف `.card`: `padding: 20px`، حد `1px solid`، `border-radius: 12px`، و`box-sizing: border-box`.","steps":["اكتب .card","أضف padding وborder","أضف border-radius وbox-sizing"],"files":{"html":"<div class=\"card\">تمر سكري<\/div>","css":"/* ابدأ هنا */\n"},"checks":[{"kind":"cssDecl","label":"حشوة 20px","selector":".card","prop":"padding","regex":"20px"},{"kind":"cssDecl","label":"حد","selector":".card","prop":"border","regex":"1px solid"},{"kind":"cssDecl","label":"زوايا دائرية","selector":".card","prop":"border-radius","regex":"12px"},{"kind":"cssDecl","label":"border-box","selector":".card","prop":"box-sizing","regex":"border-box"}],"hint":"لا تنس الفاصلة المنقوطة."},{"id":"css-05-t2","title":"وسّط الصفحة","brief":"للصنف `.page`: max-width: 960px و margin: 0 auto و padding بالبكسل.","steps":["max-width","margin","padding"],"files":{"html":"<div class=\"page\">محتوى<\/div>","css":""},"checks":[{"kind":"cssDecl","label":"max-width","selector":".page","prop":"max-width","regex":"960px"},{"kind":"cssDecl","label":"margin","selector":".page","prop":"margin","regex":"0\\s+auto"},{"kind":"cssDecl","label":"padding","selector":".page","prop":"padding","regex":"\\d+px"}],"hint":"auto تقسم الباقي بالتساوي."}],"summary":["الصندوق: content وpadding وborder وmargin","border-box يجعل الحجم متوقعًا","rem للنصوص و% للنسب","border-radius وbox-shadow للمظهر"]},{"id":"css-06","track":"css","chapter":"CSS · الصندوق والتخطيط","order":6,"title":"Flexbox: التخطيط المرن","subtitle":"من الصفر: ترتيب العناصر في صف أو عمود وتوزيع المسافات بينها.","minutes":28,"level":"متوسط","objectives":["تفعّل flex على حاوية","تفرّق بين المحور الرئيسي والمتقاطع","تستعمل justify-content وalign-items وgap","تلفّ العناصر بـ flex-wrap"],"theory":[{"type":"h","text":"الفكرة"},{"type":"p","text":"Flexbox يعمل على **حاوية** و**أبنائها المباشرين**. تكتب `display: flex` على الحاوية فقط، فيصطف الأبناء في صف بدل أن ينزل كل واحد في سطر. تخيلها رفًّا تُوزّع عليه الكتب."},{"type":"code","lang":"css","code":".menu {\n  display: flex;\n  gap: 16px;\n}","caption":"الأبناء الآن في صف بينهم 16px"},{"type":"h","text":"المحوران"},{"type":"p","text":"المحور الرئيسي هو اتجاه الصف (`flex-direction: row` الافتراضي)، والمتقاطع عمودي عليه. `column` يبدّل الاتجاه. في العربية RTL يبدأ الصف من اليمين تلقائيًا."},{"type":"terms","items":[{"term":"justify-content","desc":"يوزّع على المحور الرئيسي: flex-start، center، space-between"},{"term":"align-items","desc":"يوزّع على المتقاطع: center، stretch"},{"term":"gap","desc":"مسافة بين الأبناء"},{"term":"flex-wrap: wrap","desc":"ينزل ما لا يتسع لسطر جديد"},{"term":"flex: 1","desc":"الابن يتمدد ليملأ المتبقي"}]},{"type":"code","lang":"css","code":".bar {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}","caption":"شريط: شعار في طرف وروابط في الآخر"},{"type":"note","tone":"tip","title":"توسيط كامل","text":"`display:flex; justify-content:center; align-items:center;` يوسّط أي شيء أفقيًا وعموديًا."},{"type":"h","text":"flex-direction وorder وflex-grow"},{"type":"p","text":"`flex-direction: column` يرصّ الأبناء عموديًا. `order` يغيّر الترتيب البصري. و`flex: 1` تعني «خذ حصتك المتبقية»؛ ثلاثة أبناء بـ flex:1 يتقاسمون العرض بالتساوي."},{"type":"code","lang":"css","code":".row { display: flex; gap: 12px; }\n.row > * { flex: 1; }\n.row > .wide { flex: 2; }","caption":"الأوسط ضعف غيره"},{"type":"code","lang":"css","code":".stack {\n  display: flex;\n  flex-direction: column;\n  align-items: stretch;\n}","caption":"عمود"},{"type":"note","tone":"warn","title":"تنبيه","text":"order يغير الشكل لا ترتيب القراءة بالكيبورد."}],"examples":[{"title":"لماذا لم يتغير شيء؟","prompt":"كتبت justify-content على الأبناء ولم يحدث شيء. لماذا؟","answer":"لأنها خاصية الحاوية، ويجب أن تكون معها display: flex.","explain":"لا تعمل خصائص flex إلا على حاوية فعّلتها.","html":"<div class=\"r\"><i>1<\/i><i>2<\/i><\/div>","css":".r{display:flex;justify-content:center}"},{"title":"ما الحصة؟","prompt":"ثلاثة أبناء: flex:1, flex:1, flex:2","answer":"الربع والربع والنصف","explain":"المجموع 4 أجزاء.","html":"<div class='r'><i>1<\/i><i>2<\/i><i>3<\/i><\/div>","css":".r{display:flex}.r i:nth-child(3){flex:2}"}],"quiz":[{"q":"أين نكتب display:flex؟","options":["على الأبناء","على الحاوية","على body فقط","على الصورة"],"answer":1,"explain":"الحاوية هي المفعّلة."},{"q":"أي خاصية للمسافة بين الأبناء؟","options":["gap","margin-flex","space","pad"],"answer":0,"explain":"gap."},{"q":"للتوسيط على المحور المتقاطع:","options":["justify-content","align-items","flex-wrap","order"],"answer":1,"explain":"align-items."},{"q":"لعمود؟","options":["flex-direction: column","flex-flow: row","order:1","wrap"],"answer":0,"explain":"column."},{"q":"flex:2 يعني؟","options":["ضعف حصة flex:1","عرض 2px","اثنان فقط","لا شيء"],"answer":0,"explain":"حصة نسبية."}],"tasks":[{"id":"css-06-t1","title":"شريط تنقل","brief":"اجعل `.nav` حاوية flex فيها `justify-content: space-between` و`align-items: center` و`gap: 16px`.","steps":["اكتب .nav وفعّل flex","وزّع بـ space-between","وسّط عموديًا وأضف gap"],"files":{"html":"<div class=\"nav\"><b>وسم<\/b><a href=\"#\">الدروس<\/a><a href=\"#\">المحرر<\/a><\/div>","css":"/* ابدأ هنا */\n"},"checks":[{"kind":"cssDecl","label":"display: flex","selector":".nav","prop":"display","regex":"flex"},{"kind":"cssDecl","label":"space-between","selector":".nav","prop":"justify-content","regex":"space-between"},{"kind":"cssDecl","label":"توسيط عمودي","selector":".nav","prop":"align-items","regex":"center"},{"kind":"cssDecl","label":"gap","selector":".nav","prop":"gap","regex":"16px"}],"hint":"الخصائص كلها على `.nav` لا على أبنائه."},{"id":"css-06-t2","title":"ثلاثة أعمدة","brief":"اجعل `.row` flex مع gap، وكل ابن flex:1.","steps":["flex","gap","flex:1"],"files":{"html":"<div class=\"row\"><i>1<\/i><i>2<\/i><i>3<\/i><\/div>","css":""},"checks":[{"kind":"cssDecl","label":"flex","selector":".row","prop":"display","regex":"flex"},{"kind":"cssDecl","label":"gap","selector":".row","prop":"gap","regex":"\\d+px"},{"kind":"cssDecl","label":"حصة","selector":".row > *","prop":"flex","regex":"1"}],"hint":"المحدد `.row > *` يستهدف الأبناء."}],"summary":["flex على الحاوية فقط","justify-content للرئيسي وalign-items للمتقاطع","gap وflex-wrap وflex:1","flex-direction يبدّل المحور"]},{"id":"css-07","track":"css","chapter":"CSS · الصندوق والتخطيط","order":7,"title":"Grid: الشبكة ثنائية الأبعاد","subtitle":"من الصفر: ترتيب العناصر في صفوف وأعمدة معًا.","minutes":26,"level":"متوسط","objectives":["تفعّل grid وتعرّف الأعمدة","تستخدم fr وrepeat","تستخدم auto-fit مع minmax لشبكة متجاوبة","تدمج الخلايا بـ span"],"theory":[{"type":"h","text":"متى Grid؟"},{"type":"p","text":"Flexbox يرتب في **اتجاه واحد**، أما Grid فيرتب في **صفوف وأعمدة معًا** كجدول مرن. مناسب لمعرض بطاقات أو تخطيط صفحة."},{"type":"code","lang":"css","code":".cards {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 16px;\n}","caption":"ثلاثة أعمدة متساوية"},{"type":"p","text":"الوحدة `fr` تعني «جزء من المتبقي»، و`repeat(3, 1fr)` اختصار لتكرارها."},{"type":"h","text":"شبكة متجاوبة بسطر واحد"},{"type":"code","lang":"css","code":".cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 16px;\n}","caption":"عدد الأعمدة يتغير مع عرض الشاشة"},{"type":"p","text":"`minmax(220px, 1fr)` تعني: لا أضيق من 220px ولا أعرض من جزء متساوٍ. و`auto-fit` يضع أكبر عدد يتسع. ولدمج عمودين: `grid-column: span 2`."},{"type":"note","tone":"info","title":"Flex أم Grid؟","text":"صف واحد من العناصر → Flex. شبكة صفوف وأعمدة → Grid. ويمكن وضع أحدهما داخل الآخر."},{"type":"h","text":"مناطق مسماة"},{"type":"p","text":"`grid-template-areas` تتيح رسم التخطيط بالأسماء كأنه خريطة."},{"type":"code","lang":"css","code":".layout {\n  display: grid;\n  grid-template-columns: 1fr 3fr;\n  grid-template-areas:\n    \"head head\"\n    \"side main\"\n    \"foot foot\";\n}\nheader { grid-area: head; }\naside  { grid-area: side; }","caption":"تخطيط صفحة"},{"type":"p","text":"و`grid-row: span 2` تمدد الخلية عبر صفين، و`place-items: center` توسّط /* ====== محرك التحقق ====== */
const rx=s=>new RegExp(s,"i");
const ns=s=>s.replace(/\s+/g,"").replace(/\(even\)/g,"(2n)").replace(/\(odd\)/g,"(2n+1)");
function runChecks(t,html,css){return new Promise(res=>{
  const f=document.createElement("iframe");f.style.cssText="position:absolute;left:-9999px;width:600px;height:400px";
  let done=false;const go=()=>{if(done)return;done=true;const d=f.contentDocument,w=f.contentWindow,src=html+"\n"+css;
    const rules=()=>{const o=[];for(const sh of d.styleSheets)try{for(const r of sh.cssRules)o.push(r)}catch(e){}return o};
    const out=t.checks.map(c=>{let ok=false;try{const a=c.sel?[...d.querySelectorAll(c.sel)]:[];
      if(c.kind=="selector")ok=a.length>=(c.min??1)&&a.length<=(c.max??1e9);
      else if(c.kind=="text")ok=a.some(e=>rx(c.regex).test(e.textContent));
      else if(c.kind=="attr")ok=a.length>0&&a.every(e=>e.hasAttribute(c.attr)&&rx(c.regex).test(e.getAttribute(c.attr)));
      else if(c.kind=="source")ok=rx(c.regex).test(src);
      else if(c.kind=="sourceNot")ok=!rx(c.regex).test(src);
      else if(c.kind=="computed")ok=a.length>0&&a.every(e=>{const v=w.getComputedStyle(e).getPropertyValue(c.prop);return rx(c.regex).test(hex(v)+" "+v)});
      else if(c.kind=="cssDecl")ok=rules().some(r=>r.selectorText&&ns(r.selectorText)==ns(c.selector)&&rx(c.regex).test(hex(r.style.getPropertyValue(c.prop))));
      else if(c.kind=="ruleSel")ok=rules().some(r=>r.selectorText&&rx(c.selector).test(r.selectorText)&&rx(c.regex).test(hex(r.style.getPropertyValue(c.prop))));
      else if(c.kind=="cssDeclAny")ok=rules().some(r=>r.style&&rx(c.regex).test(hex(r.style.getPropertyValue(c.prop))));
      else if(c.kind=="cssCount")ok=rules().filter(r=>r.style&&r.style.getPropertyValue(c.prop)).length>=c.min}catch(e){}
      return{label:c.label,ok}});f.remove();res(out)};
  f.onload=go;setTimeout(go,2500);f.srcdoc=doc(html,css);document.body.appendChild(f)})}

/* ====================================================================
   إضافات النسخة الثانية — شارات، سلسلة أيام، ورقة مراجعة، تنبيه أخطاء،
   ضبط الخط والإضاءة، مشاريع إضافية، تصدير التقدّم، شهادة إتمام.

   ==================================================================== */
(()=>{
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const todayS=()=>new Date().toISOString().slice(0,10);
const dayN=s=>Math.floor(Date.parse(s+"T00:00:00Z")/864e5);
const dayS=n=>new Date(n*864e5).toISOString().slice(0,10);
const daySet=()=>new Set(Object.keys(P.log||{}));

/* ---------- 1+2) سلسلة الأيام والشارات ---------- */
const streak=()=>{const ds=daySet();let t=dayN(todayS());if(!ds.has(dayS(t)))t--;let n=0;while(ds.has(dayS(t))){n++;t--}return n};
const bestStreak=()=>{const a=[...daySet()].map(dayN).filter(x=>x==x).sort((x,y)=>x-y);let b=0,c=0,p=null;a.forEach(d=>{c=(p!==null&&d==p+1)?c+1:1;if(c>b)b=c;p=d});return Math.max(b,streak())};

function cheatPage(){

/* ---------- 4) تنبيه أخطاء المحرر ---------- */
const VOID=new Set("area base br col embed hr img input link meta param source track wbr".split(" "));
const RAW=new Set(["script","style","textarea","title"]);
const tg=n=>`<code>${esc("<"+n+">")}</code>`,tc=n=>`<code>${esc("</"+n+">")}</code>`;
function htmlIssues(src){const out=[],st=[],low=src.toLowerCase();
  const ln=i=>src.slice(0,i).split("\n").length;
  const re=/<!--[\s\S]*?(?:-->|$)|<![^>]*>|<(\/?)([a-zA-Z][\w:-]*)((?:"[^"]*"|'[^']*'|[^'">])*)(>|$)/g;let m;
  while((m=re.exec(src))){if(m[0][1]=="!")continue;
    const close=m[1]=="/",name=m[2].toLowerCase(),line=ln(m.index);
    if(m[4]!=">"){out.push(`الوسم ${tg(name)} (سطر ${line}) ما انتهى بالعلامة <code>&gt;</code>`);continue}
    if(!close){if(VOID.has(name)||/\/\s*$/.test(m[3]))continue;
      st.push({name,line});
      if(RAW.has(name)){const ce=low.indexOf("</"+name,re.lastIndex);if(ce>=0)re.lastIndex=ce}}
    else{let i=-1;for(let k=st.length-1;k>=0;k--)if(st[k].name==name){i=k;break}
      if(i<0)out.push(`وسم الإغلاق ${tc(name)} (سطر ${line}) ما له وسم فتح`);
      else{for(let k=st.length-1;k>i;k--)out.push(`الوسم ${tg(st[k].name)} (سطر ${st[k].line}) ما انغلق قبل ${tc(name)} — لا تنسَ كتابة ${tc(st[k].name)}`);st.length=i}}}
  st.forEach(s=>out.push(`الوسم ${tg(s.name)} (سطر ${s.line}) ما انغلق — لا تنسَ كتابة ${tc(s.name)}`));
  return out}
function cssIssues(src){const s=src.replace(/\/\*[\s\S]*?(\*\/|$)/g,"").replace(/"[^"]*"|'[^']*'/g,'""');
  const o=(s.match(/\{/g)||[]).length,c=(s.match(/\}/g)||[]).length,out=[];
  if(o>c)out.push(`في CSS فيه ${o-c>1?o-c+" أقواس":"قوس"} <code>{</code> ما انغلق بـ <code>}</code>`);
  if(c>o)out.push(`في CSS فيه <code>}</code> زيادة بدون <code>{</code> يقابلها`);
  return out}
function checkBox(cb){const h=$("textarea.h",cb),c=$("textarea.c",cb);if(!h)return;
  const all=[...htmlIssues(h.value).map(x=>["HTML",x]),...(c?cssIssues(c.value).map(x=>["CSS",x]):[])];
  let w=$(".xwarn",cb);
  if(!all.length){if(w)w.remove();return}
  if(!w){w=document.createElement("div");w.className="xwarn";w.setAttribute("role","alert");h.parentElement.insertAdjacentElement("afterend",w)}
  const sh=all.slice(0,4);
  w.innerHTML=`<b>⚠️ تنبيه:</b><ul>${sh.map(([k,x])=>`<li><small style="color:inherit;opacity:.75">${k}</small> · ${x}</li>`).join("")}${all.length>4?`<li>و${all.length-4} تنبيهات أخرى…</li>`:""}</ul>`}
document.addEventListener("input",e=>{const t=e.target;if(t.tagName=="TEXTAREA"&&t.closest(".cbox"))checkBox(t.closest(".cbox"))});
document.addEventListener("click",e=>{const b=e.target.closest(".rs0,.sl");if(!b)return;
  setTimeout(()=>{const host=b.closest("[data-t],[data-p],#fe,.ex");if(host)$$(".cbox",host).forEach(cb=>{if($(".xwarn",cb))checkBox(cb)})},0)});

const UIK="wasm.ui.v1";let UI={fs:0,th:"dark"};
try{UI=Object.assign(UI,JSON.parse(localStorage.getItem(UIK)))}catch(e){}
const FS=[1,1.12,1.25,1.4,1.6];
function applyUI(){UI.fs=Math.max(0,Math.min(FS.length-1,+UI.fs||0));const r=document.documentElement;r.style.setProperty("--fs",FS[UI.fs]);r.dataset.theme=UI.th=="light"?"light":"dark";
  try{localStorage.setItem(UIK,JSON.stringify(UI))}catch(e){}
  const p=$("#xsp");if(p){$("#xfs",p).textContent=Math.round(FS[UI.fs]*100)+"%";$$("[data-th]",p).forEach(b=>b.classList.toggle("on",b.dataset.th==r.dataset.theme))}}
function buildSettings(){
  document.body.insertAdjacentHTML("beforeend",`<button class="xset-b" id="xsb" aria-label="ضبط الخط والإضاءة" title="ضبط الخط والإضاءة">Aa</button>
  <div class="xset hid" id="xsp"><h4>🔤 حجم الخط</h4><div class="r"><button class="btn g" id="xfm" aria-label="تصغير الخط">A−</button><b id="xfs">100%</b><button class="btn g" id="xfp" aria-label="تكبير الخط">A+</button></div>
  <h4>💡 الإضاءة</h4><div class="r"><button class="btn g" data-th="dark">🌙 داكن</button><button class="btn g" data-th="light">☀️ فاتح</button></div></div>`);
  $("#xsb").onclick=()=>$("#xsp").classList.toggle("hid");
  $("#xfm").onclick=()=>{UI.fs--;applyUI()};$("#xfp").onclick=()=>{UI.fs++;applyUI()};
  $$("#xsp [data-th]").forEach(b=>b.onclick=()=>{UI.th=b.dataset.th;applyUI()});
  document.addEventListener("click",e=>{if(!e.target.closest("#xsp,#xsb"))$("#xsp").classList.add("hid")});applyUI()}

  css:"body {\n  font-family: system-ui, sans-serif;\n  background: #fffaf0;\n  padding: 24px;\n}\n\n.menu {\n  max-width: 460px;\n  margin: 0 auto;\n}\n\nh1 {\n  text-align: center;\n  color: #7c2d12;\n}\n\nh2 {\n  color: #9a6b00;\n  border-bottom: 2px solid #d4af37;\n  padding-bottom: 4px;\n}\n\n.item {\n  display: flex;\n  justify-content: space-between;\n  padding: 10px 6px;\n  border-bottom: 1px dashed #cbbd93;\n}\n\n.item:hover {\n  background: #fff1c9;\n}\n\n.price {\n  color: #b45309;\n  font-weight: 700;\n}\n"}},
{id:"proj-6",title:"صفحة هبوط بسيطة",
 desc:"ابنِ صفحة هبوط لتطبيق متخيَّل بهيكل دلالي: `header` و`main` و`footer`. داخل `main` قسم بطل `hero` فيه عنوان رئيسي وفقرة وزر `btn`، وقسم `features` فيه ثلاث بطاقات `feature`. ثم نسّقها بخلفية متدرّجة للبطل، وشبكة للمزايا، وزر بزوايا دائرية يتغيّر عند المرور.",
 goals:["استخدام `header` و`main` و`footer` وبناء قسمي `.hero` و`.features`","إضافة زر `a.btn` برابط داخل البطل وثلاث بطاقات `.feature`","تنسيق البطل بخلفية `gradient` وتوسيط، والمزايا بـ `grid`، والزر بـ `:hover`"],
 steps:["أبقِ <header> في الأعلى، ثم أضف <main> يحتوي القسمين","في <section class=\"hero\"> ضع h1 وفقرة ورابطًا <a class=\"btn\" href=\"#features\">","في <section class=\"features\"> ضع ثلاث بطاقات <div class=\"feature\"> فيها h3 وفقرة، ثم <footer> في الأسفل","في CSS: لوّن .hero بخلفية وتوسيط، ورتّب .features بـ display: grid، ونسّق .btn و.btn:hover"],
 files:{html:"<header>\n  <h1>اسم منتجك</h1>\n</header>\n",css:"body {\n  font-family: system-ui, sans-serif;\n  margin: 0;\n}\n"},
 checks:[
  {kind:"selector",label:"ترويسة الصفحة header",sel:"header",min:1},
  {kind:"selector",label:"المحتوى الرئيسي داخل main",sel:"main",min:1},
  {kind:"selector",label:"تذييل الصفحة footer",sel:"footer",min:1},
  {kind:"text",label:"عنوان رئيسي داخل قسم .hero",sel:".hero h1",regex:".{5,}"},
  {kind:"attr",label:"زر a.btn برابط داخل .hero",sel:".hero a.btn",attr:"href",regex:".+"},
  {kind:"selector",label:"ثلاث بطاقات مزايا بالصنف feature",sel:".features .feature",min:3},
  {kind:"cssDecl",label:"خلفية للبطل (لون أو gradient)",selector:".hero",prop:"background",regex:"gradient|#[0-9a-fA-F]{3,6}"},
  {kind:"cssDecl",label:"توسيط نص البطل",selector:".hero",prop:"text-align",regex:"center"},
  {kind:"cssDecl",label:"المزايا بتخطيط grid أو flex",selector:".features",prop:"display",regex:"grid|flex"},
  {kind:"cssDecl",label:"زر بزوايا دائرية",selector:".btn",prop:"border-radius",regex:"\\d+px"},
  {kind:"ruleSel",label:"تأثير عند مرور الفأرة على الزر (.btn:hover)",selector:"\\.btn:hover",prop:"background",regex:".+"}],
 hint:"`display: grid` مع `grid-template-columns: repeat(3, 1fr)` يوزّع البطاقات في ثلاثة أعمدة متساوية. وللزر اجعل الرابط `display: inline-block` ليأخذ padding كاملًا.",
 solution:{html:"<header>\n  <strong class=\"logo\">تطبيق نجم</strong>\n</header>\n<main>\n  <section class=\"hero\">\n    <h1>نظّم مهامك بذكاء</h1>\n    <p>تطبيق بسيط يساعدك على إنجاز أكثر في وقت أقل.</p>\n    <a class=\"btn\" href=\"#features\">ابدأ الآن</a>\n  </section>\n  <section class=\"features\" id=\"features\">\n    <div class=\"feature\"><h3>سريع</h3><p>أضف مهامك في ثوانٍ.</p></div>\n    <div class=\"feature\"><h3>منظّم</h3><p>رتّب أولوياتك بنظرة واحدة.</p></div>\n    <div class=\"feature\"><h3>مجاني</h3><p>ابدأ بلا أي اشتراك.</p></div>\n  </section>\n</main>\n<footer>\n  <p>© 2026 تطبيق نجم</p>\n</footer>\n",
  css:"body {\n  font-family: system-ui, sans-serif;\n  margin: 0;\n  color: #1b2038;\n}\n\nheader {\n  padding: 14px 24px;\n  background: #101733;\n  color: #f6e3a1;\n}\n\n.hero {\n  background: linear-gradient(135deg, #1c1760, #3b2f9e);\n  color: #ffffff;\n  text-align: center;\n  padding: 60px 20px;\n}\n\n.btn {\n  display: inline-block;\n  padding: 10px 28px;\n  background: #d4af37;\n  color: #1d1600;\n  border-radius: 10px;\n  text-decoration: none;\n  font-weight: 700;\n}\n\n.btn:hover {\n  background: #f6e3a1;\n}\n\n.features {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 16px;\n  padding: 32px 24px;\n}\n\n.feature {\n  background: #f4f4f5;\n  border-radius: 12px;\n  padding: 16px;\n  text-align: center;\n}\n\nfooter {\n  text-align: center;\n  padding: 16px;\n  background: #101733;\n  color: #9aa5c4;\n}\n"}}
);

/* ---------- 7) تصدير / استيراد التقدّم ---------- */
let pending=null;
function ioBlock(){return `<div class="card" style="margin:14px 0"><b>💾 نقل تقدّمك لجهاز ثاني</b><p class="mini" style="margin:4px 0 10px">تقدّمك (النقاط، الأقسام، الشارات، الشهادة) بينحفظ تلقائيًا بهذا المتصفح، ما بتحتاج تعمل شي. هالزرين بس إذا بدك تكمّل من جهاز أو متصفح تاني: «تنزيل» بيحفظ ملف، و«استيراد» بيفتح هالملف على الجهاز التاني ويرجّع تقدّمك.</p>
  <div class="xio"><button class="btn" id="xex">⬇️ تنزيل تقدّمي</button><button class="btn g" id="xim">⬆️ استيراد تقدّم</button><input type="file" id="xfile" accept=".json,application/json"></div><div class="xmsg" id="xmsg"></div></div>`}
function bindIO(){
  const msg=(h,bad)=>{const m=$("#xmsg");m.style.color=bad?"var(--bad)":"var(--ok)";m.innerHTML=h};
  $("#xex").onclick=()=>{persist();const blob=new Blob([JSON.stringify({app:"wasm",v:1,exported:new Date().toISOString(),data:P},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wasm-progress-"+todayS()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    msg("✓ تم تنزيل الملف. احتفظ به، وافتحه من الجهاز الثاني بزر «استيراد تقدّم».")};
  $("#xim").onclick=()=>$("#xfile").click();
  $("#xfile").onchange=e=>{const fl=e.target.files[0];e.target.value="";if(!fl)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.app!="wasm"||!o.data||typeof o.data!="object"||typeof o.data.xp!="number")throw 0;pending=o.data;
      msg(`الملف يحتوي ${pending.xp} XP${pending.user?" باسم "+esc(pending.user.name):""}. الاستيراد <b>يستبدل</b> تقدّمك الحالي. <button class="btn sm" id="xok" style="margin-inline-start:8px">تأكيد الاستيراد</button>`,true);
      $("#xok").onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(pending))}catch(_){}location.hash="#/progress";location.reload()}}
      catch(_){msg("الملف غير صالح، اختر ملفًا نزّلته من وسم.",true)}};r.readAsText(fl)}}

/* ---------- 8) شهادة الإتمام ---------- */
function certPage(){
  const avg=tr=>{const a=L.filter(l=>l.track==tr);return Math.round(a.reduce((s,l)=>s+pct(l),0)/a.length)};
  if(!bothDone()){
    const left=l=>{const t=l.tasks.filter(x=>!P.done[x.id]).length,q=l.quiz.filter((_,i)=>!P.done[l.id+":q"+i]).length;return [t&&t+" تمرين",q&&q+" سؤال"].filter(Boolean).join(" + ")};
    const tot=total(),rows=l=>L.filter(x=>x.track==l).map(x=>`<div class="row"><span dir="${dirOf(x.title)}">${pct(x)==100?"✅ ":""}${esc(x.title)}</span><div class="pb"><i style="width:${pct(x)}%"></i></div><small style="min-width:120px">${pct(x)==100?"مكتمل":"باقي: "+left(x)}</small></div>`).join("");
    const rem=L.filter(x=>pct(x)<100).length;
    $("#m").innerHTML=`<h1>🎓 شهادة الإتمام</h1><div class="card"><p>الشهادة مقفلة لسه 🔒. بتنفتح أول ما تخلّص <b>لغتين كاملين</b> (HTML و CSS) بكل أقسامهما، أي كل التمارين والأسئلة.</p>
    <p><b>وصلت لـ ${tot}%</b> من المطلوب، وباقي <b>${rem}</b> ${rem==1?"قسم":"أقسام"} من ${L.length}.</p><div class="pb"><i style="width:${tot}%"></i></div>
    <h3>HTML — ${avg("html")}%</h3>${rows("html")}<h3>CSS — ${avg("css")}%</h3>${rows("css")}
    <p><a class="btn" href="#/level/${(LV.find(v=>lvPct(v)<100)||LV[0]).id}">▶ كمّل من حيث توقفت</a> <a class="btn g" href="#/map">🗺️ الخريطة</a></p></div>`;return}
  const name=P.user&&P.user.name?esc(P.user.name):"الطالب",dt=new Date((P.certDate||todayS())+"T12:00:00Z").toLocaleDateString("ar",{year:"numeric",month:"long",day:"numeric"});
  $("#m").innerHTML=`<div class="xnp"><h1>🎓 شهادة الإتمام</h1><p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="xpc">🖨️ طباعة / حفظ PDF</button><a class="btn g" href="#/progress">→ تقدّمي</a></p></div>
  <div class="cert-wrap"><div class="cert"><div class="cert-in"><div class="cert-seal">🏅</div><div class="cert-brand">وسم · WASM</div>
  <h2 class="cert-t">شهادة إتمام</h2><p class="cert-s">تشهد منصة وسم بأن</p><div class="cert-name">${name}</div>
  <p class="cert-b">قد أتمّ بنجاح مساري تعلّم <b>HTML</b> و<b>CSS</b> بكامل أقسامهما (${L.length} أقسام)، وأنجز تمارينها العملية وأسئلتها النظرية، وبنى أساسًا متينًا لتصميم صفحات الويب وتنسيقها.</p>
  <div class="cert-meta"><div><b>النقاط</b><span>${P.xp} XP</span></div><div><b>المستوى</b><span>${1+Math.floor(P.xp/100)}</span></div><div><b>التاريخ</b><span>${dt}</span></div></div>
  <div class="cert-sig">Wasm · Learn HTML &amp; CSS</div></div></div></div>`;
  $("#xpc").onclick=()=>PRINTPAGE()}

/* ---------- الربط بالصفحات الموجودة ---------- */
Object.assign(U,{nCheat:A("المراجعة"),nCert:A("🎓 الشهادة")});
const _route=route;
route=function(){const p=location.hash.split("/")[1];
  if(p=="cheat"||p=="cert"){$$("nav a").forEach(a=>a.classList.toggle("on",a.dataset.n==p));(p=="cheat"?cheatPage:certPage)();scrollTo(0,0)}
  else _route();
  try{post()}catch(e){console.error(e)}};
function post(){
  const[,p,id]=location.hash.split("/");
  if(p=="level"||p=="lesson"){const lid=p=="level"?String(id).replace(/-\d$/,""):id;if(L.some(l=>l.id==lid)){P.seen=P.seen||{};if(!P.seen[lid]){P.seen[lid]=1;persist()}}}
  const m=$("#m");
  if($(".hero",m)&&$(".stats",m)&&!$(".xstreak",m)){$(".stats",m).insertAdjacentHTML("afterend",streakCard()+miniBadges()+certBox())}
  if($("#rs",m)&&!$("#xex",m)){const st=$(".stats",m);if(st)st.insertAdjacentHTML("beforebegin",badgesCard()+certBox());$("#rs",m).closest("p").insertAdjacentHTML("afterend",ioBlock());bindIO()}
  chip()}

/* ---------- تشغيل أولي ---------- */
P.seen=P.seen||{};
if(!P.badges){P.badges={};BADGES.forEach(b=>{if(b.ok())P.badges[b.id]=todayS()});if(bothDone())P.certDate=todayS();persist()}
$("nav").insertAdjacentHTML("beforeend",`<a href="#/cert" data-n="cert">🎓 الشهادة</a>`);
$(".xp").insertAdjacentHTML("beforebegin",`<div class="xp" id="stk">🔥 <span id="stkn">0</span></div>`);
buildSettings();chip();
})();

addEventListener("hashchange",route);$("#xp").textContent=P.xp;chrome();route();if(!P.user)askUser();
</script>
