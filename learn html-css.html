<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وسم — تعلّم HTML - CSS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b16;--card:#111830;--ink:#eef0f8;--mut:#9aa5c4;--pri:#d4af37;--pri2:#f6e3a1;--vio:#7c6cf0;--ok:#34d399;--bad:#fb7185;--line:#222b4a;--code:#060914;--gold:linear-gradient(135deg,#b8901f,#f6e3a1 55%,#d4af37)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.9 Tajawal,system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -5%,#2a237a55,transparent 70%),radial-gradient(700px 400px at 5% 10%,#d4af3718,transparent 70%),var(--bg);background-attachment:fixed}
a{color:var(--pri);text-decoration:none}
code,pre,textarea{font-family:"JetBrains Mono",ui-monospace,monospace;direction:ltr;text-align:left}
header{position:sticky;top:0;z-index:9;background:#080b16cc;backdrop-filter:blur(14px);border-bottom:1px solid #d4af3730}
.bar{max-width:1050px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{font-weight:800;font-size:26px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
nav{display:flex;gap:4px;flex:1}nav a{color:var(--mut);padding:4px 16px;border-radius:99px;font-weight:500;transition:.2s}nav a:hover{color:var(--ink)}nav a.on{background:#d4af371f;color:var(--pri2);box-shadow:inset 0 0 0 1px #d4af3755}
.xp{background:#d4af371a;color:var(--pri2);padding:2px 14px;border-radius:99px;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 1px #d4af3755}
main{max-width:1050px;margin:auto;padding:28px 20px 80px}
.hero{position:relative;overflow:hidden;background:radial-gradient(600px 300px at 15% 0%,#d4af3733,transparent 60%),linear-gradient(135deg,#1c1760,#101a45 60%,#0b1130);color:#fff;border:1px solid #d4af3755;border-radius:28px;padding:44px 40px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;box-shadow:0 20px 60px #0008,inset 0 1px 0 #ffffff22}
.hero h1{margin:0;font-size:42px;line-height:1.4;background:linear-gradient(180deg,#fff,#f6e3a1);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#cfd6ee;margin:8px 0 22px}.hero>div:first-child{flex:1;min-width:260px}
.btn{background:var(--gold);color:#1d1600;border:0;padding:9px 26px;border-radius:12px;font:800 16px Tajawal;cursor:pointer;box-shadow:0 6px 18px #d4af3730;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px #d4af3755}
.btn.w{background:var(--gold);color:#1d1600}.btn.g{background:#ffffff0d;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.g:hover{border-color:var(--pri)}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font:800 28px Tajawal;background:conic-gradient(var(--pri) calc(var(--p)*1%),#ffffff1a 0);box-shadow:0 0 40px #d4af3733}
.ring span{width:108px;height:108px;border-radius:50%;background:#0d1230;color:var(--pri2);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0}
.stat,.card{background:linear-gradient(160deg,#151d3a,#0f1530);border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 8px 24px #0006}
.stat b{display:block;font-size:30px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}.stat small,small{color:var(--mut)}
h1,h2,h3{color:var(--ink)}
h2{margin:34px 0 14px;font-size:24px;display:flex;align-items:center;gap:10px}h2::before{content:"";width:6px;height:24px;border-radius:4px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lc{display:block;color:inherit;transition:.25s}.lc:hover{transform:translateY(-4px);border-color:#d4af3788;box-shadow:0 14px 34px #d4af3724}
.tag{font-size:12px;padding:1px 12px;border-radius:99px;background:#d4af3722;color:var(--pri2);font-weight:700;box-shadow:inset 0 0 0 1px #d4af3755}.tag.css{background:#7c6cf026;color:#c4bbff;box-shadow:inset 0 0 0 1px #7c6cf088}
.pb{height:8px;background:#1b2443;border-radius:9px;overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:.4s}
.seg,.etabs{display:inline-flex;direction:ltr;gap:4px;padding:4px;background:#0b1126;border:1px solid var(--line);border-radius:99px;margin:4px 0 18px}
.seg button,.etabs button{border:0;background:transparent;color:var(--mut);padding:6px 30px;border-radius:99px;font:800 15px "JetBrains Mono",monospace;cursor:pointer;transition:.2s}
.seg button:hover,.etabs button:hover{color:var(--ink)}
.seg button.on,.etabs button.on{background:var(--gold);color:#1d1600;box-shadow:0 4px 14px #d4af3744}
.etabs{margin:0 0 8px}.etabs button{padding:4px 22px;font-size:13px}
.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#ffffff08;color:var(--mut);border-radius:99px;padding:4px 18px;font:500 15px Tajawal;cursor:pointer;transition:.2s}
.tabs button:hover{color:var(--ink);border-color:#d4af3766}
.tabs button.on{background:var(--gold);color:#1d1600;border-color:transparent;font-weight:800}
pre{background:var(--code);color:#e2e8f0;padding:14px;border-radius:12px;overflow:auto;line-height:1.6;font-size:14px;border:1px solid var(--line)}
code{background:#d4af3718;color:var(--pri2);padding:1px 6px;border-radius:6px;font-size:.88em}pre code{background:none;padding:0;color:inherit}
mark{background:#d4af3730;color:var(--pri2);padding:0 4px;border-radius:4px}
.note{background:#7c6cf018;border-inline-start:4px solid var(--vio);padding:8px 14px;border-radius:8px}
.hid{display:none}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--line);padding:6px 10px;text-align:start}th{background:#1a2347;color:var(--pri2)}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#0b1126;color:var(--ink);font:inherit;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--pri)}.opt.ok{background:#34d3991f;border-color:var(--ok)}.opt.no{background:#fb71851f;border-color:var(--bad)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.ed{grid-template-columns:1fr}.hero h1{font-size:30px}.hero{padding:28px 22px}}
textarea{width:100%;height:190px;background:var(--code);color:#e2e8f0;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;resize:vertical;outline:0}textarea:focus{border-color:var(--pri)}
iframe{width:100%;height:190px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chk{padding:0;margin:10px 0}.chk li{list-style:none;padding:2px 0}.chk .p::before{content:"✓ ";color:var(--ok);font-weight:700}.chk .f::before{content:"✗ ";color:var(--bad);font-weight:700}
.win{color:var(--ok);font-weight:800}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}.row .pb{flex:1;margin:0}.row span{min-width:150px}
.guide{background:linear-gradient(160deg,#1a2347,#101733);border:1px solid #d4af3755;border-radius:16px;padding:12px 18px;margin:14px 0;box-shadow:0 8px 24px #0005}
.guide .gh{font-weight:800;color:var(--pri2);margin-bottom:2px}
.gl{margin:6px 0;padding-inline-start:24px}.gl li{padding:2px 0}
.mini{color:var(--mut);font-size:14px;margin:8px 0 2px}
.card.ex{margin:18px 0}.exh{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:18px}
.badge{background:var(--gold);color:#1d1600;border-radius:99px;padding:0 14px;font-weight:800;font-size:13px}
.qbox,.abox,.cbox,.rbox{border-radius:14px;padding:10px 14px;margin:10px 0}
.qbox{background:#7c6cf018;border:1px solid #7c6cf055}.qbox p,.abox p{margin:4px 0}
.abox{background:#34d3991a;border:2px solid var(--ok);box-shadow:0 0 0 4px #34d39914}
.why{color:var(--mut);font-size:15px}
.lbl2{font-weight:800;font-size:14px;color:var(--pri2)}.abox .lbl2{color:var(--ok)}
.cbox{background:var(--code);border:1px solid var(--line)}.cbox textarea{border-color:#222b4a;height:150px}
.rbox{background:#0b1126;border:1px solid var(--line)}.rbox iframe{height:170px}
.lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:700}
.acts{display:flex;gap:6px}
.btn.sm{padding:1px 12px;font-size:13px;border-radius:8px;font-weight:700}
.steps{background:#d4af370f;border:1px dashed #d4af3766;border-radius:12px;padding:8px 14px;margin:10px 0}.steps ol{margin:4px 0;padding-inline-start:24px}
.obj{margin:14px 0;border-color:#d4af3755}.obj ul,.sumc ul{margin:6px 0}
.lang{cursor:pointer;white-space:nowrap}
footer.dev{text-align:center;padding:14px 20px 20px;border-top:1px solid #d4af3730;direction:ltr}
footer.dev span{font:700 12px "JetBrains Mono",monospace;letter-spacing:.5px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:700px){.bar{flex-wrap:wrap;gap:8px}nav{order:3;flex-basis:100%;overflow:auto}}
.inp{width:100%;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;margin:6px 0 12px;outline:0}.inp:focus{border-color:var(--pri)}
.ov{position:fixed;inset:0;z-index:99;display:flex;overflow:auto;padding:20px;background:#080b16ee;backdrop-filter:blur(8px)}.ov .card{max-width:420px;width:100%;margin:auto}label{font-weight:700;color:var(--pri2);font-size:15px}
.mn{display:flex;gap:14px;color:inherit}.mn .nd{width:38px;display:flex;flex-direction:column;align-items:center}.mn .nd b{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:#0b1126;border:2px solid var(--line)}.mn .nd i{flex:1;width:3px;background:var(--line);margin:4px 0}.mn.done .nd b{background:var(--gold);color:#1d1600;border-color:transparent}.mn.cur .nd b{border-color:var(--pri);color:var(--pri2);box-shadow:0 0 18px #d4af3755}.mn .card{flex:1;margin-bottom:14px;padding:10px 16px}
.opt:disabled{cursor:default}.vid{aspect-ratio:16/9;height:auto;border-radius:12px}.logo{height:64px;width:auto;background:#fff;border-radius:12px;padding:6px;float:inline-end}

main,footer.dev{zoom:var(--fs,1)}
.xtoast{position:fixed;inset-inline:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:120;pointer-events:none;padding:0 12px}
.xt{pointer-events:auto;background:linear-gradient(160deg,#1a2347,#101733);color:#eef0f8;border:1px solid #d4af3788;border-radius:16px;padding:10px 18px;box-shadow:0 14px 40px #000a;display:flex;align-items:center;gap:12px;max-width:94vw;font-weight:700;animation:xin .35s}
.xt .btn{display:inline-block;white-space:nowrap}
@keyframes xin{from{opacity:0;transform:translateY(14px)}}
#stk{cursor:default;white-space:nowrap}

/* سلسلة الأيام والشارات */
.xstreak{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:22px 0}
.xs-fire{font-size:46px;line-height:1;filter:drop-shadow(0 0 14px #f59e0b88)}
.xs-n{font-size:34px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.xs-t{flex:1;min-width:180px}.xs-t small{display:block}
.xs-days{display:flex;gap:6px;direction:ltr}
.xs-days i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:#ffffff0d;border:1px solid var(--line);color:var(--mut)}
.xs-days i.on{background:var(--gold);color:#1d1600;border-color:transparent;font-weight:800;box-shadow:0 4px 12px #d4af3744}
.xs-days i.td{outline:2px solid #d4af3799;outline-offset:2px}
.xbadges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.xbd{border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;background:#ffffff08}
.xbd b{display:block;font-size:14px;line-height:1.5;margin-top:2px}.xbd small{display:block;font-size:12px;line-height:1.5}
.xbd .ic{font-size:34px;line-height:1.3}
.xbd.on{border-color:#d4af3799;background:#d4af3715;box-shadow:0 6px 18px #d4af3722}
.xbd.off{opacity:.5}.xbd.off .ic{filter:grayscale(1)}
.xmini{display:flex;gap:8px;flex-wrap:wrap}.xmini span{font-size:26px}.xmini .off{opacity:.3;filter:grayscale(1)}
.xcertbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-color:#d4af3799;background:linear-gradient(160deg,#2a2410,#151d3a)}
.xcertbox .ic{font-size:44px}.xcertbox>div{flex:1;min-width:200px}

/* تنبيه الأخطاء بالمحرر */
.xwarn{background:#fbbf2414;border:1px solid #fbbf2488;border-radius:10px;padding:6px 14px;margin:8px 0 2px;font-size:14px;color:#fde68a;direction:rtl;text-align:start;line-height:1.8}
.xwarn b{color:#fbbf24}.xwarn ul{margin:2px 0 0;padding-inline-start:20px}
.xwarn code{background:#fbbf2420;color:#fde68a}

/* ضبط الخط والإضاءة */
.xset-b{position:fixed;left:14px;bottom:14px;z-index:60;width:48px;height:48px;border-radius:50%;border:1px solid #d4af3777;background:var(--card);color:var(--pri2);font:800 17px Tajawal,sans-serif;cursor:pointer;box-shadow:0 8px 24px #0007;transition:.2s}
.xset-b:hover{transform:translateY(-2px);border-color:var(--pri)}
.xset{position:fixed;left:14px;bottom:72px;z-index:60;width:262px;max-width:calc(100vw - 28px);background:var(--card);border:1px solid #d4af3766;border-radius:18px;padding:14px 16px;box-shadow:0 18px 50px #000a}
.xset h4{margin:0 0 8px;font-size:15px;color:var(--pri2)}
.xset .r{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.xset .r .btn{flex:1;padding:6px 8px;font-size:15px}
.xset .r b{min-width:54px;text-align:center;color:var(--ink)}
.xset .btn.g.on{border-color:var(--pri);color:var(--pri2)}

/* ورقة المراجعة */
.xtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.xtools .inp{flex:1;min-width:200px;margin:0;width:auto}
.xcs{margin:16px 0}.xcs h3{margin:0 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xcs td:first-child{white-space:nowrap}

/* تصدير/استيراد */
.xio{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.xio input[type=file]{display:none}
.xmsg{margin:8px 0 0;font-size:15px}
/* الشهادة */
.cert-wrap{page:cert;margin:22px 0}
@page cert{size:A4 landscape;margin:8mm}
.cert{position:relative;max-width:920px;margin:auto;padding:14px;color:#2b2310;background:linear-gradient(135deg,#fffdf4,#fbf3d9);border:10px double #b8901f;border-radius:6px;box-shadow:0 24px 70px #000a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert-in{position:relative;border:2px solid #d4af3799;padding:34px 30px 26px;text-align:center;background:radial-gradient(500px 260px at 50% 0%,#d4af3722,transparent 70%)}
.cert-in::before,.cert-in::after{content:"❖";position:absolute;top:8px;color:#b8901f;font-size:22px}.cert-in::before{inset-inline-start:12px}.cert-in::after{inset-inline-end:12px}
.cert-seal{font-size:56px;line-height:1.3;margin-bottom:4px;filter:drop-shadow(0 4px 8px #b8901f66)}
.cert-brand{font:800 22px Tajawal,sans-serif;letter-spacing:3px;color:#8a6508;margin-top:4px}
.cert h2.cert-t{display:block;margin:6px 0;font-size:46px;color:#8a6508;line-height:1.4;justify-content:center}.cert h2.cert-t::before{display:none}
.cert-s{margin:6px 0;color:#5c4a14;font-size:19px}
.cert-name{font:800 clamp(30px,6vw,54px)/1.5 Tajawal,sans-serif;color:#1b2038;margin:6px auto 10px;padding:0 22px;max-width:92%;border-bottom:3px solid #d4af37;display:inline-block;word-break:break-word}
.cert-b{max-width:700px;margin:10px auto;font-size:18px;color:#3a2f10;line-height:2}
.cert-b b{color:#8a6508}
.cert-meta{display:flex;justify-content:center;gap:clamp(14px,5vw,56px);flex-wrap:wrap;margin:16px 0 8px}
.cert-meta div{min-width:90px}.cert-meta b{display:block;color:#8a6508;font-size:13px;letter-spacing:1px}.cert-meta span{font-size:20px;font-weight:800;color:#1b2038}
.cert-sig{margin-top:14px;padding-top:10px;border-top:1px dashed #b8901f88;font:800 15px "JetBrains Mono",monospace;color:#8a6508;direction:ltr;letter-spacing:1px}
/* طباعة */
@media print{
  :root{--ink:#111;--mut:#444;--pri2:#7a5a00;--pri:#7a5a00;--line:#bbb;--card:#fff}
  header,footer.dev,.xset-b,.xset,.xtoast,.xnp,nav{display:none!important}
  body{background:#fff!important;color:#111}main{zoom:1;padding:0;max-width:none}
  .card,.stat{box-shadow:none!important;background:#fff!important;border-color:#bbb!important;color:#111}
  pre{background:#f4f4f4!important;color:#111!important}
  .cert{box-shadow:none}.cert-wrap{margin:0}
}
/* ====== الوضع الفاتح (اختياري — الافتراضي يبقى داكنًا كما هو) ====== */
:root[data-theme=light]{--bg:#f6f3ea;--card:#ffffff;--ink:#1b2038;--mut:#5c6584;--pri:#9a7410;--pri2:#7a5a00;--line:#d9d3c0}
:root[data-theme=light] body{background:radial-gradient(900px 500px at 85% -5%,#cfc8ff66,transparent 70%),radial-gradient(700px 400px at 5% 10%,#d4af3726,transparent 70%),var(--bg);background-attachment:fixed}
:root[data-theme=light] header{background:#f6f3eacc;border-bottom-color:#b8901f55}
:root[data-theme=light] .brand,:root[data-theme=light] .stat b,:root[data-theme=light] footer.dev span,:root[data-theme=light] .xs-n{background-image:linear-gradient(135deg,#7a5a00,#b8901f 55%,#7a5a00)}
:root[data-theme=light] .stat,:root[data-theme=light] .card{background:linear-gradient(160deg,#ffffff,#fbf8ee);box-shadow:0 8px 24px #3a2f0a14}
:root[data-theme=light] .pb{background:#e8e2cf}
:root[data-theme=light] .seg,:root[data-theme=light] .etabs{background:#efe9d8}
:root[data-theme=light] .opt,:root[data-theme=light] .mn .nd b{background:#fff}
:root[data-theme=light] .rbox{background:#faf7ee}
:root[data-theme=light] .guide{background:linear-gradient(160deg,#fff8e1,#fffdf5);box-shadow:0 8px 24px #3a2f0a12}
:root[data-theme=light] th{background:#f3ecd2}
:root[data-theme=light] .inp{background:#fff;color:var(--ink)}
:root[data-theme=light] .ov{background:#f6f3eaee}
:root[data-theme=light] .btn.g{background:#0000000a}
:root[data-theme=light] .xt{color:#eef0f8}
:root[data-theme=light] .xbd{background:#00000005}
:root[data-theme=light] .xs-days i{background:#0000000a}
:root[data-theme=light] .xcertbox{background:linear-gradient(160deg,#fff4cf,#fffdf4)}
:root[data-theme=light] .xset-b{box-shadow:0 8px 24px #3a2f0a33}
:root[data-theme=light] .hero,:root[data-theme=light] .cbox,:root[data-theme=light] pre{--ink:#eef0f8;--mut:#9aa5c4;--pri2:#f6e3a1;--pri:#d4af37;--line:#222b4a}
:root[data-theme=light] .cbox .etabs{background:#0b1126}
:root[data-theme=light] .cbox .btn.g{background:#ffffff0d}
:root[data-theme=light] .hero .btn.w{color:#1d1600}
header{background:#080b16f5}
:root[data-theme=light] header{background:#f6f3eaf5}
a.btn{display:inline-block;white-space:nowrap}
@media(max-width:700px){.bar nav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.bar nav::-webkit-scrollbar{display:none}nav a{white-space:nowrap;flex:none;padding:4px 12px}}
</style>
</head>







<body>
<header><div class="bar"><div class="brand" id="brand">وسم</div>
<nav><a href="#/" data-n="">الرئيسية</a><a href="#/map" data-n="map">الخريطة</a><a href="#/editor" data-n="editor">المحرر</a><a href="#/projects" data-n="projects">المشاريع</a><a href="#/cheat" data-n="cheat">المراجعة</a><a href="#/progress" data-n="progress">تقدّمي</a></nav>
<div class="xp">⭐ <span id="xp">0</span> XP</div></div></header>

<script>
const DATA={"lessons":[{"id":"html-01","track":"html","chapter":"HTML · الأساسيات","order":1,"title":"كيف يعمل الويب و HTML","subtitle":"تفهم رحلة الصفحة من السيرفر إلى شاشتك، ثم تكتب أول ملف index.html بيدك.","minutes":12,"level":"مبتدئ","objectives":["تشرح الفرق بين لغة التوصيف ولغة البرمجة","تتابع رحلة طلب الصفحة من السيرفر حتى الرسم على الشاشة","تميّز الوسم عن السمة عن العنصر","تكتب ملف index.html صالحًا وتحفظه بترميز UTF-8","تستخدم التعليقات والوسوم ذاتية الإغلاق بثقة"],"theory":[{"type":"h","text":"ما هو HTML؟"},{"type":"p","text":"`HTML` اختصار **HyperText Markup Language** أي «لغة توصيف النص التشعبي». الكلمة المفتاحية هنا هي **توصيف**: أنت لا تعطي المتصفح أوامر منطقية مثل «احسب» أو «كرّر»، بل تُلبس النص ملصقات تقول ما هو: هذا عنوان، هذه فقرة، هذا رابط."},{"type":"p","text":"لهذا لا تُعدّ HTML لغة برمجة: لا متغيرات ولا شروط ولا حلقات. هي **هيكل** فحسب؛ الشكل (الألوان والخطوط والمسافات) تتكفّل به CSS، والسلوك (النقر والتحديث) تتكفّل به JavaScript. الصفحة الجيدة تبقى مفهومة حتى لو تعطّلت الأنماط تمامًا."},{"type":"list","items":["**HTML**: البنية والمعنى — عنوان، فقرة، قائمة، صورة.","**CSS**: المظهر — الألوان، الخطوط، المسافات، التخطيط.","**JavaScript**: السلوك — النقر، الحساب، تحديث المحتوى بلا إعادة تحميل."],"ordered":false},{"type":"quote","text":"اكتب HTML كأن CSS لن تُحمَّل أبدًا: إن بقي المحتوى مفهومًا بلا تنسيق، فالهيكل سليم."},{"type":"h","text":"رحلة الصفحة من السيرفر إلى شاشتك"},{"type":"p","text":"حين تكتب عنوانًا مثل `https://matjar.example/products` في المتصفح، يحدث ما يشبه طلب كتاب من مكتبة بعيدة، على خمس خطوات:"},{"type":"list","items":["يترجم **DNS** اسم النطاق `matjar.example` إلى عنوان IP لخادم بعيد.","يرسل المتصفح طلب **HTTP GET** إلى ذلك الخادم.","يردّ السيرفر بملف نصي عادي هو صفحة HTML، مع رمز حالة مثل `200` أو `404`.","يقرأ المتصفح النص من أعلى إلى أسفل ويبني منه شجرة عناصر.","يحسب التنسيق ويرسم البكسلات على الشاشة."],"ordered":true},{"type":"p","text":"لاحظ أن السيرفر لا يرسل «صورة الصفحة»؛ يرسل **نصًا** فقط. المتصفح هو من يفسّره ويرسمه. لذلك يختلف العرض قليلًا بين المتصفحات، ولذلك أيضًا تستطيع فتح الملف نفسه من قرصك دون إنترنت."},{"type":"note","tone":"info","title":"ملف محلي أم سيرفر؟","text":"إن فتحت `index.html` بنقرة مزدوجة فالعنوان يبدأ بـ `file://` ويقرأ المتصفح الملف من جهازك. وإن جاءت الصفحة من سيرفر فالعنوان يبدأ بـ `https://` أو `http://`."},{"type":"h","text":"ما هو DOM ببساطة؟"},{"type":"p","text":"المتصفح لا يعمل على النص كما هو، بل يحوّله إلى **شجرة كائنات** اسمها DOM اختصار **Document Object Model**. كل وسم يصبح عقدة، والوسوم المتداخلة تصبح فروعًا داخل فروع."},{"type":"code","lang":"html","code":"<body>\n  <h1>متجر التمور<\/h1>\n  <p>أفضل <strong>التمور<\/strong> في المدينة.<\/p>\n<\/body>","caption":"نص HTML قبل التحليل"},{"type":"p","text":"الشجرة الناتجة: `body` في الجذر، وتحته طفلان `h1` و`p`، وداخل `p` عقدة نصية ثم `strong` ثم عقدة نصية. هذه الشجرة هي ما تعمل عليها CSS، وهي ما تستعمله JavaScript للوصول إلى العناصر وتغييرها. وحين نقول «عنصر» في بقية الدروس فنحن نعني عقدة في هذه الشجرة."},{"type":"h","text":"الوسم والسمة والعنصر"},{"type":"p","text":"**الوسم (Tag)** هو العلامة المكتوبة بين قوسين زاويّين. و**السمة (Attribute)** معلومة إضافية تُكتب داخل الوسم الافتتاحي فقط. و**العنصر (Element)** هو المجموع: الوسم الافتتاحي + المحتوى + وسم الإغلاق."},{"type":"code","lang":"html","code":"<p class=\"lead\" id=\"intro\">نصّ الفقرة هنا.<\/p>","caption":"وسم + سمات + محتوى = عنصر واحد"},{"type":"table","head":["الجزء","في المثال","وظيفته"],"rows":[["الوسم الافتتاحي","<p class=\"lead\" id=\"intro\">","يبدأ العنصر ويحمل سماته"],["السمة","class=\"lead\"","تصنيف يستخدمه CSS وJavaScript"],["المحتوى","نصّ الفقرة هنا.","ما يراه الزائر"],["وسم الإغلاق","<\/p>","ينهي العنصر"]]},{"type":"note","tone":"tip","title":"ترتيب السمات لا يهم","text":"`<a href=\"x\" target=\"_blank\">` و`<a target=\"_blank\" href=\"x\">` متساويان تمامًا. المهم ألّا تتكرر السمة نفسها مرتين في العنصر نفسه."},{"type":"h","text":"وسوم مغلقة ووسوم ذاتية الإغلاق"},{"type":"p","text":"معظم الوسوم تحتاج إغلاقًا صريحًا مثل `<\/p>`، لأنها تحتوي محتوى. لكن هناك وسوم **فارغة** لا محتوى لها فتُغلق نفسها: `<br>` و`<hr>` و`<img>` و`<input>` و`<meta>` و`<link>`. في HTML5 تُكتب هكذا `<br>`، ويقبل المتصفح `<br />` أيضًا."},{"type":"code","lang":"html","code":"<p>السطر الأول<br>السطر الثاني<\/p>\n<hr>\n<img src=\"dates.jpg\" alt=\"صندوق تمر على طاولة\">","caption":"ثلاثة وسوم فارغة بلا وسم إغلاق"},{"type":"note","tone":"warn","title":"خطأ شائع","text":"كتابة `<\/br>` أو `<\/img>` خطأ لا معنى له، فالوسوم الفارغة لا تُغلق. المتصفح يتجاهل الخطأ غالبًا ويستمر، لكن الكود يبقى غير صحيح ويُربك من يقرأه بعدك."},{"type":"h","text":"التعليقات: ملاحظات لا يراها الزائر"},{"type":"p","text":"التعليق يبدأ بـ `<!--` وينتهي بـ `-->`، لا يُرسم على الشاشة، لكنه يبقى في شجرة DOM عقدةً من نوع تعليق تستطيع JavaScript رؤيتها. استخدمه لتذكير نفسك بمهمة متبقية، أو لتوضيح سبب قرار غريب في الكود، أو لتعطيل جزء مؤقتًا أثناء التجربة."},{"type":"code","lang":"html","code":"<!-- قائمة المنتجات تُبنى في الدرس القادم -->\n<h1>عروض الأسبوع<\/h1>\n<p>خصم 20% على العجوة.<\/p>","caption":"تعليق فوق العنوان"},{"type":"note","tone":"warn","title":"لا تضع أسرارًا في التعليقات","text":"التعليقات تُرسل إلى المتصفح كاملة، وأي زائر يستطيع قراءتها من «عرض مصدر الصفحة». لا تكتب فيها كلمات مرور ولا مسارات داخلية ولا أسماء عملاء."},{"type":"h","text":"أول ملف لك: index.html"},{"type":"p","text":"افتح محررًا نصيًا مثل VS Code، أنشئ ملفًا باسم `index.html`، اكتب فيه الكود التالي، ثم احفظه بترميز **UTF-8** وافتحه في المتصفح."},{"type":"code","lang":"html","code":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>أول صفحة لي<\/title>\n<\/head>\n<body>\n  <h1>مرحبًا بالعالم<\/h1>\n  <p>هذه أول فقرة أكتبها بيدي.<\/p>\n<\/body>\n<\/html>","caption":"index.html — الصفحة الأولى كاملة"},{"type":"p","text":"إن ظهرت الحروف العربية على شكل رموز غريبة مثل `Ø£` فالسبب أن الملف حُفظ بترميز آخر غير UTF-8؛ أعد الحفظ بالترميز الصحيح. وإن ظهرت الصفحة بيضاء فتحقّق من امتداد الملف أنه `.html` لا `.txt`."},{"type":"list","items":["اسم `index` تقليدي: السيرفر يقدّمه تلقائيًا عند طلب المجلد.","امتداد `.html` يجعل المتصفح يقرأ الملف كصفحة ويب.","أي تعديل في الملف يحتاج تحديثًا للصفحة (F5) لتراه."],"ordered":false},{"type":"h","text":"حالة الأحرف والمسافات"},{"type":"p","text":"أسماء الوسوم والسمات **غير حساسة لحالة الأحرف**: `<H1>` و`<h1>` متساويتان تمامًا، لكن الاصطلاح السائد كتابة الأسماء بحروف صغيرة، وهو ما ستراه في كل مثال. أما **قيم السمات** فقد تكون حساسة: المسار `Images/Logo.png` ليس هو `images/logo.png` على سيرفرات Linux."},{"type":"p","text":"والمتصفح يدمج المسافات المتعددة والأسطر الجديدة في **مسافة واحدة**. اكتب ما شئت من المسافات والأسطر لترتيب كودك، فلن يظهر أثرها في الصفحة. وإن أردت مسافات محفوظة فعلًا فهناك وسم `pre` يأتي في درس لاحق."},{"type":"terms","items":[{"term":"HTML","desc":"لغة توصيف تصف بنية المحتوى ومعناه، وليست لغة برمجة."},{"term":"الوسم Tag","desc":"علامة بين قوسين زاويّين تحدد نوع العنصر مثل `<p>`."},{"term":"السمة Attribute","desc":"معلومة إضافية داخل الوسم الافتتاحي مثل `href` أو `class`."},{"term":"العنصر Element","desc":"الوسم الافتتاحي ومحتواه ووسم إغلاقه معًا."},{"term":"DOM","desc":"شجرة العناصر التي يبنيها المتصفح من نص HTML وتعمل عليها CSS وJavaScript."},{"term":"UTF-8","desc":"ترميز نصي يمثّل حروف العالم ومنها العربية، ويجب حفظ ملفات HTML به."}]}],"examples":[{"title":"أول صفحة لمتجر","prompt":"ماذا سيعرض المتصفح من هذا الكود؟","answer":"عنوان كبير عريض «متجر التمور» في سطر، ثم فقرة عادية تحته.","explain":"المتصفح يطبّق تنسيقًا افتراضيًا على `h1` فيعرضه أكبر وأثقل، أما `p` فبخط النص العادي مع مسافة أعلى وأسفل.","html":"<h1>متجر التمور<\/h1>\n<p>تمور فاخرة تُعبّأ في اليوم نفسه.<\/p>","css":""},{"title":"السمة تغيّر الوجهة","prompt":"إلى أين يؤدي النقر على كلمة «موقعنا»؟ وما الذي تضيفه السمة `title`؟","answer":"ينقل إلى https://example.com، وعند وقوف المؤشر على الكلمة تظهر فقاعة صغيرة نصّها «افتح الموقع».","explain":"`href` تحدد عنوان الوجهة، و`title` نص تلميحي يظهر عند المرور بالمؤشر. لاحظ أن `title` لا يُغني عن نص رابط واضح، لأنه لا يظهر على شاشات اللمس.","html":"<p>زر <a href=\"https://example.com\" title=\"افتح الموقع\">موقعنا<\/a> لمزيد من التفاصيل.<\/p>","css":""},{"title":"تعليق لا يُعرض","prompt":"كم سطرًا سيظهر على الشاشة؟","answer":"سطر واحد فقط: «تحديث الأسعار قريبًا». التعليق لا يظهر إطلاقًا.","explain":"كل ما بين `<!--` و`-->` يُهمله المتصفح عند الرسم، ويبقى في الملف المصدري وفي شجرة DOM عقدةً لا تُعرض. لهذا يصلح التعليق لتذكير الفريق، لا لإخفاء معلومات.","html":"<!-- TODO: أضف جدول الأسعار قبل الإطلاق -->\n<h1>تحديث الأسعار قريبًا<\/h1>","css":""}],"quiz":[{"q":"أي وصف يصف HTML بدقة؟","options":["لغة برمجة كاملة فيها شروط وحلقات","لغة توصيف تحدد بنية المحتوى ومعناه","لغة تنسيق للألوان والخطوط","قاعدة بيانات تُخزّن منتجات المتجر"],"answer":1,"explain":"HTML توصيف: تُلبس الملصقات النص لتحديد نوعه. الألوان والخطوط مهمة CSS، والسلوك مهمة JavaScript."},{"q":"ما الذي يرسله السيرفر إلى المتصفح عند طلب صفحة HTML؟","options":["صورة جاهزة للصفحة","ملفًا نصيًا يفسّره المتصفح ويبنيه","ملف CSS فقط","أوامر JavaScript ترسم الصفحة"],"answer":1,"explain":"السيرفر يرسل نص HTML، والمتصفح يحوّله إلى شجرة DOM ثم يحسب التنسيق ويرسمه."},{"q":"أي مجموعة كلها وسوم ذاتية الإغلاق؟","options":["<p> و<h1> و<div>","<br> و<img> و<meta>","<a> و<section> و<span>","<ul> و<li> و<pre>"],"answer":1,"explain":"`br` و`img` و`meta` وسوم فارغة لا تحتوي محتوى، فتُكتب وحدها بلا وسم إغلاق."},{"q":"كتبت كلمة «التمور» في الملف فظهرت في المتصفح «Ø§Ù„ØªÙ…ÙˆØ±». ما السبب الأرجح؟","options":["نسيان وسم الإغلاق","حفظ الملف بترميز غير UTF-8","استخدام حروف كبيرة في أسماء الوسوم","المسافات الزائدة قبل النص"],"answer":1,"explain":"هذا نمط كلاسيكي لقراءة نص UTF-8 بترميز آخر؛ أعد حفظ الملف بترميز UTF-8 وأضف `<meta charset=\"UTF-8\">`."}],"tasks":[{"id":"html-01-t1","title":"بطاقة تعريف بمطعم","brief":"أنشئ بطاقة بسيطة لمطعم: عنوان `h1` واحد فيه اسم المطعم، وفقرة `p` تصف المطبخ، وفقرة ثانية بساعات العمل. وأضف في أعلى الملف تعليقًا HTML يذكر كلمة «مطعم» ليعرف زميلك سبب وجود الصفحة.","steps":["اكتب تعليقًا يبدأ بـ <!-- وينتهي بـ -->","أضف <h1> باسم المطعم ثم أغلق الوسم","أضف فقرتين <p> إحداهما لساعات العمل"],"files":{"html":"<!-- ابدأ هنا -->\n","css":""},"checks":[{"kind":"selector","label":"عنوان h1 واحد فقط","sel":"h1","min":1,"max":1},{"kind":"text","label":"اسم المطعم في العنوان","sel":"h1","regex":"مطعم"},{"kind":"selector","label":"فقرتان على الأقل","sel":"p","min":2},{"kind":"source","label":"تعليق يذكر كلمة مطعم","regex":"<!--[\\s\\S]*?مطعم[\\s\\S]*?-->"}],"hint":"التعليق يبدأ بـ <!-- وينتهي بـ -->، وكل عنصر يُفتح ثم يُغلق.","solution":{"html":"<!-- صفحة مطعم البيت الشامي -->\n<h1>مطعم البيت الشامي<\/h1>\n<p>نقدّم المأكولات الشامية الطازجة كل يوم.<\/p>\n<p>ساعات العمل: من الظهر حتى منتصف الليل.<\/p>","css":""}},{"id":"html-01-t2","title":"رابط بسمتين","brief":"أضف فقرة فيها رابط `<a>` نصه «زيارة المتجر» ويؤدي إلى `https://example.com`، وأضف للرابط سمة `title` قيمتها «افتح المتجر».","steps":["ابدأ بفقرة <p> لتضع الرابط داخل نص","اكتب <a href=\"https://example.com\">","أضف title=\"افتح المتجر\" داخل الوسم الافتتاحي"],"files":{"html":"<p>تعريف بالمتجر هنا.<\/p>\n","css":""},"checks":[{"kind":"selector","label":"رابط a واحد","sel":"a","min":1,"max":1},{"kind":"attr","label":"وجهة الرابط example.com","sel":"a","attr":"href","regex":"^https://example\\.com/?$"},{"kind":"attr","label":"الرابط يحمل سمة title","sel":"a","attr":"title","regex":"المتجر"},{"kind":"text","label":"نص الرابط «زيارة المتجر»","sel":"a","regex":"زيارة المتجر"}],"hint":"السمات تُكتب داخل الوسم الافتتاحي فقط، بهذه الصيغة: name=\"value\".","solution":{"html":"<p>للعروض الجديدة <a href=\"https://example.com\" title=\"افتح المتجر\">زيارة المتجر<\/a> قبل نفاد الكمية.<\/p>","css":""}}],"summary":["HTML لغة توصيف تحدد البنية، لا لغة برمجة","السيرفر يرسل نصًا، والمتصفح يبني منه DOM ويرسمه","العنصر = وسم افتتاحي + محتوى + وسم إغلاق","الوسوم الفارغة تُكتب وحدها بلا إغلاق","احفظ الملفات بترميز UTF-8 وسمِّ الصفحة الأولى index.html"]},{"id":"html-02","track":"html","chapter":"HTML · الأساسيات","order":2,"title":"هيكل المستند والبيانات الوصفية","subtitle":"تبني مستند HTML5 كاملًا من DOCTYPE إلى ترتيب وسوم head التي تقرأها المتصفحات ومحركات البحث.","minutes":16,"level":"مبتدئ","objectives":["تكتب هيكل مستند HTML5 كاملًا من الذاكرة","تضبط لغة الصفحة واتجاهها لعربية سليمة","تستخدم meta للترميز والوصف والاستجابة","تربط CSS وJavaScript بالسمات defer وasync وmodule","ترتب عناصر head بترتيب منطقي يحسّن سرعة الرسم"],"theory":[{"type":"h","text":"المستند كاملًا: أربع طبقات"},{"type":"p","text":"الصفحة البسيطة التي قد تكتبها أول مرة عملت لأن المتصفح متسامح ويُكمّل ما ينقص. لكن الصفحة الحقيقية تُعلن هيكلها بنفسها: تصريح النوع، ثم `html` جذرًا، ثم `head` للبيانات، ثم `body` للمحتوى المرئي."},{"type":"code","lang":"html","code":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>متجر التمور | الرئيسية<\/title>\n<\/head>\n<body>\n  <h1>أهلًا بك في متجر التمور<\/h1>\n  <p>تمور تُعبّأ في يوم الحصاد.<\/p>\n<\/body>\n<\/html>","caption":"الهيكل الأدنى لمستند HTML5"},{"type":"h","text":"<!DOCTYPE html> سطر لا وسم"},{"type":"p","text":"`<!DOCTYPE html>` تصريح يخبر المتصفح أن المستند مكتوب بمعيار HTML5، فيدخل في **وضع المعايير** (standards mode). إن نسيته دخل المتصفح في «الوضع الغريب» (quirks mode) واختلفت حسابات الصندوق والخطوط، فتبدو صفحتك مختلفة عمّا صمّمته. اكتبه في أول سطر، ولا تغلقه، ولا تكتبه بعد `<html>`."},{"type":"note","tone":"warn","title":"أشهر خطأ في الهيكل","text":"كتابة `<!DOCTYPE html>` في منتصف الملف أو نسيانها تمامًا. المتصفح يعرض الصفحة رغم ذلك، لكن التنسيق يصبح غير متوقع — وهذا النوع من الأخطاء يُتعب في التصحيح."},{"type":"h","text":"عنصر html: اللغة والاتجاه"},{"type":"p","text":"العنصر `html` هو جذر الشجرة، وله سمتان لا تنساهما في أي صفحة عربية: `lang=\"ar\"` تُخبر قارئات الشاشة ومحركات البحث والترجمة الآلية بأن المحتوى عربي، و`dir=\"rtl\"` تجعل الاتجاه من اليمين إلى اليسار فينعكس ترتيب الأعمدة ومحاذاة النص افتراضيًا."},{"type":"code","lang":"html","code":"<html lang=\"ar\" dir=\"rtl\">","caption":"جذر المستند بالعربية"},{"type":"note","tone":"tip","title":"لماذا dir مهم؟","text":"بلا `dir=\"rtl\"` تبقى الفواصل وعلامات الترقيم في الطرف الخطأ من السطر، ويظهر النص المختلط بالعربية والإنجليزية مرتبكًا. الاتجاه الصحيح يوفّر عليك تنسيقًا يدويًا كثيرًا."},{"type":"h","text":"الرأس والجسد: head و body"},{"type":"p","text":"`head` حاوية **بيانات وصفية**: لا يُرسم منها شيء على مساحة الصفحة (إلا نص `title` في تبويب المتصفح). و`body` هو كل ما يراه الزائر. القاعدة العملية: كل ما لا يُرى يذهب إلى `head`، وكل ما يُرى يذهب إلى `body`."},{"type":"table","head":["القسم","محتواه","هل يظهر؟"],"rows":[["head","title, meta, link, style, script","لا، إلا العنوان في التبويب"],["body","العناوين والفقرات والصور والنماذج","نعم، هذا ما يراه الزائر"]]},{"type":"h","text":"<title>: عنوان الصفحة"},{"type":"p","text":"`title` نص يظهر في تبويب المتصفح، ويُستخدم عنوانًا أزرق في نتائج البحث، واسمًا افتراضيًا عند حفظ الصفحة في المفضلة. اكتبه وصفًا فريدًا لكل صفحة: «متجر التمور | الرئيسية» أفضل من «صفحة» أو «مرحبًا»."},{"type":"note","tone":"warn","title":"عنوان واحد فقط","text":"`title` واحد في المستند كله، ويوضع داخل `head`. إن كتبته داخل `body` فقد يظهر كنص عادي في الصفحة، وهذا خلل في البنية حتى لو بدت النتيجة مقبولة."},{"type":"h","text":"<meta>: بيانات لا تُرى"},{"type":"p","text":"`meta` وسم فارغ يحمل معلومات عن المستند نفسه. هذه أشهر استخداماته في صفحة متجر حقيقية:"},{"type":"code","lang":"html","code":"<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"description\" content=\"متجر تمور عربية فاخرة مع توصيل سريع داخل المدينة.\">\n<meta name=\"keywords\" content=\"تمور, عجوة, سكري, متجر\">\n<meta name=\"author\" content=\"فريق متجر التمور\">\n<meta name=\"robots\" content=\"index, follow\">\n<meta http-equiv=\"refresh\" content=\"30\">","caption":"وسوم meta الشائعة"},{"type":"table","head":["السمة","الوظيفة","ملاحظة"],"rows":[["charset","تحديد ترميز النص","اجعله أول عنصر داخل head"],["name=\"viewport\"","ضبط العرض على شاشة الجوال","ضروري لأي تصميم متجاوب"],["name=\"description\"","وصف يظهر تحت العنوان في نتائج البحث","بين 120 و160 حرفًا"],["name=\"keywords\"","كلمات مفتاحية","تتجاهلها محركات البحث عمليًا"],["name=\"author\"","اسم المؤلف أو الفريق","للتوثيق الداخلي"],["name=\"robots\"","السماح بالفهرسة أو منعها","index/noindex وfollow/nofollow"],["http-equiv","محاكاة ترويسة HTTP","مثل refresh أو content-security-policy"]]},{"type":"p","text":"`charset` يجب أن يأتي مبكرًا جدًا: المتصفح يفحص أول 1024 بايت من الملف لتحديد الترميز، فإن وجده متأخرًا قد يعرض العربية رموزًا قبل أن يصحّح نفسه. أما `description` فلا ترفع ترتيبك مباشرة، لكنها النص الذي يقرأه الباحث قبل أن يقرر النقر، فهي إعلانك المختصر."},{"type":"note","tone":"warn","title":"keywords ليست حيلة","text":"محركات البحث الكبرى تتجاهل `keywords` منذ سنوات، وبعضها ينظر إلى حشوها كمؤشر سلبي. اكتبها للتوثيق إن شئت، ولا تبنِ عليها أملًا في الظهور. و`http-equiv=\"refresh\"` يعيد تحميل الصفحة تلقائيًا ويزعج القارئ — استخدمه بحذر شديد أو لا تستخدمه."},{"type":"h","text":"ربط الموارد: link و style و script"},{"type":"p","text":"`link` وسم فارغ يربط المستند بمورد خارجي. السمة `rel` تحدد نوع العلاقة، و`href` مسار المورد. ثلاث علاقات تحتاجها كثيرًا:"},{"type":"code","lang":"html","code":"<link rel=\"stylesheet\" href=\"css/style.css\">\n<link rel=\"icon\" href=\"favicon.ico\" type=\"image/x-icon\">\n<link rel=\"preload\" href=\"fonts/Cairo.woff2\" as=\"font\" type=\"font/woff2\" crossorigin>","caption":"ثلاث وظائف لوسم link"},{"type":"p","text":"أما `style` فيكتب CSS داخل المستند نفسه — مفيد لصفحة واحدة أو لتجربة سريعة، وأما `script` فيضمّن JavaScript أو يجلبها من ملف. موضع `script` وسماته يحددان **متى** ينفّذ السكربت، وهذا فرق حاسم:"},{"type":"code","lang":"html","code":"<script src=\"app.js\" defer><\/script>\n<script src=\"analytics.js\" async><\/script>\n<script type=\"module\" src=\"main.js\"><\/script>","caption":"ثلاث طرق لتحميل السكربت"},{"type":"table","head":["الطريقة","التحميل","التنفيذ"],"rows":[["<script src> بلا سمة","يحجب تحليل الصفحة","فور نزول الملف"],["defer","بالتوازي مع التحليل","بعد بناء DOM وبالترتيب"],["async","بالتوازي مع التحليل","فور نزوله وبلا ترتيب مضمون"],["type=\"module\"","مؤجّل تلقائيًا","بعد بناء DOM وبترتيب الوحدات"]]},{"type":"note","tone":"tip","title":"القاعدة العملية","text":"استخدم `defer` لسكربتاتك التي تتعامل مع DOM، و`async` للسكربتات المستقلة مثل التحليلات، و`type=\"module\"` إن كنت تستخدم `import`. السكربت الذي يعتمد على عناصر الصفحة بلا `defer` قد يبحث عن عنصر لم يُبنَ بعد."},{"type":"h","text":"noscript و base"},{"type":"p","text":"`noscript` يعرض بديلًا لمن عطّل JavaScript، فيوضع في `body` ويحتوي رسالة مفهومة بدل صفحة فارغة. أما `base` فيحدد عنوانًا أساسيًا تُحسب منه كل المسارات النسبية والروابط في الصفحة؛ وهو قوي وخطير في الوقت نفسه، لأن عنصرًا واحدًا منه يغيّر سلوك كل الروابط النسبية."},{"type":"code","lang":"html","code":"<head>\n  <base href=\"https://matjar.example/\">\n<\/head>\n<body>\n  <noscript><p>لعرض السلة يلزم تشغيل JavaScript.<\/p><\/noscript>\n<\/body>","caption":"base في الرأس و noscript في الجسد"},{"type":"h","text":"ترتيب العناصر داخل head"},{"type":"p","text":"الترتيب ليس عشوائيًا. ابدأ بالترميز ليقرأه المتصفح قبل أي نص عربي، ثم viewport، ثم العنوان والوصف، ثم الأنماط والخطوط، وأخيرًا السكربتات. هذا التسلسل يقلّل وميض النص غير المنسّق ويسرّع أول رسم."},{"type":"list","items":["`<meta charset=\"UTF-8\">` أولًا بلا استثناء","`<meta name=\"viewport\">` ثم `<title>`","`<meta name=\"description\">` وبقية البيانات الوصفية","`<link rel=\"stylesheet\">` وروابط الخطوط","`<style>` إن وُجد تنسيق داخلي","`<script defer>` في النهاية"],"ordered":true},{"type":"terms","items":[{"term":"<!DOCTYPE html>","desc":"تصريح يحدد معيار HTML5 ويشغّل وضع المعايير في المتصفح."},{"term":"lang","desc":"سمة على `<html>` تحدد لغة المحتوى لقارئات الشاشة ومحركات البحث."},{"term":"dir","desc":"سمة تحدد اتجاه النص: `rtl` للعربية و`ltr` للإنجليزية."},{"term":"viewport","desc":"بيانات وصفية تجعل عرض الصفحة مساويًا لعرض شاشة الجوال."},{"term":"defer","desc":"سمة سكربت تؤجل التنفيذ إلى ما بعد بناء DOM مع حفظ الترتيب."},{"term":"async","desc":"سمة سكربت تنفّذه فور نزوله دون انتظار DOM ودون ترتيب مضمون."},{"term":"http-equiv","desc":"سمة في `meta` تحاكي ترويسة HTTP مثل refresh."}]}],"examples":[{"title":"عنوان التبويب أم عنوان الصفحة؟","prompt":"ما الذي يظهر في تبويب المتصفح، وما الذي يظهر داخل الصفحة؟","answer":"التبويب يعرض «متجر التمور | العروض»، والصفحة تعرض «عروض الأسبوع» كعنوان كبير.","explain":"`title` في `head` يُعرض في التبويب ونتائج البحث، أما `h1` في `body` فيُرسم داخل الصفحة. وظيفتهما مختلفة حتى لو تشابه النص.","html":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>متجر التمور | العروض<\/title>\n<\/head>\n<body>\n  <h1>عروض الأسبوع<\/h1>\n  <p>خصم 20% على العجوة حتى نهاية الخميس.<\/p>\n<\/body>\n<\/html>","css":""},{"title":"زائر عطّل JavaScript","prompt":"ماذا يرى من عطّل JavaScript في متصفحه؟","answer":"يرى عنوان «سلة المشتريات» ثم الفقرة البديلة: «لعرض السلة يلزم تشغيل JavaScript». ولا تظهر عناصر السلة التفاعلية.","explain":"`noscript` لا يُرسم إلا حين يكون JavaScript معطّلًا في المتصفح. استخدمه لرسالة واضحة بدل صفحة تبدو معطوبة بلا سبب.","html":"<h1>سلة المشتريات<\/h1>\n<noscript><p>لعرض السلة يلزم تشغيل JavaScript.<\/p><\/noscript>","css":""},{"title":"لغة داخل لغة","prompt":"لماذا نضع `lang=\"en\"` على الكلمة الإنجليزية وحدها؟","answer":"ليقرأها قارئ الشاشة بالنطق الإنجليزي الصحيح بدل محاولة نطقها كأنها عربية.","explain":"سمة `lang` تُورَّث لكل الأبناء؛ وضعها على `span` يغيّر لغة ذلك الجزء فقط، و`dir=\"ltr\"` يحافظ على ترتيب الكلمات اللاتينية داخل سطر عربي.","html":"<p>في متجرنا نوفر خدمة <span lang=\"en\" dir=\"ltr\">Same Day Delivery<\/span> داخل المدينة.<\/p>","css":""}],"quiz":[{"q":"ما وظيفة <!DOCTYPE html>؟","options":["إغلاق المستند في نهايته","إخبار المتصفح بمعيار HTML5 وتشغيل وضع المعايير","تحميل ملف الأنماط تلقائيًا","تحديد لغة الصفحة"],"answer":1,"explain":"التصريح يحدد المعيار ويشغّل standards mode، وبغيابه قد يدخل المتصفح في quirks mode فتختلف الحسابات."},{"q":"أين يوضع <meta charset=\"UTF-8\"> ولماذا؟","options":["في نهاية body لتسريع الرسم","في أول head ليقرأه المتصفح قبل النص العربي","داخل title","في ملف CSS"],"answer":1,"explain":"المتصفح يفحص أول 1024 بايت لتحديد الترميز، فتأخير `charset` قد يعرض العربية رموزًا قبل التصحيح."},{"q":"لديك سكربت يقرأ عنصرًا من DOM فور تحميل الصفحة. أي سمة تختار؟","options":["async","defer","src وحده بلا سمات","type=\"text/css\""],"answer":1,"explain":"`defer` يؤجل التنفيذ إلى ما بعد بناء DOM ويحفظ الترتيب، فيجد السكربت العناصر جاهزة. `async` قد ينفّذ قبل وجودها."},{"q":"ما الخطأ في هذا الهيكل: `<html><head><title>...<\/title><\/head><body>...<\/body><\/html>`؟","options":["لا يوجد خطأ إطلاقًا","يفتقد تصريح DOCTYPE فقد يعمل المتصفح في الوضع الغريب","title يجب أن يكون داخل body","html لا يحتاج وسم إغلاق"],"answer":1,"explain":"بقية العناصر سليمة، لكن غياب `<!DOCTYPE html>` يترك المتصفح في quirks mode وتصبح الحسابات غير موثوقة."},{"q":"أي سمة تضبط لغة المحتوى ليقرأه قارئ الشاشة بالنطق الصحيح؟","options":["dir","lang","charset","rel"],"answer":1,"explain":"`lang` تحدد اللغة، أما `dir` فتحدد الاتجاه. لكل منهما وظيفة مختلفة، وتحتاج الاثنتين في صفحة عربية."}],"tasks":[{"id":"html-02-t1","title":"هيكل مستند صفحة المنتجات","brief":"اكتب مستند HTML5 كاملًا لصفحة منتجات: تصريح `DOCTYPE` في أول سطر، و`html` بسمتي `lang=\"ar\"` و`dir=\"rtl\"`، و`head` فيه `charset` بترميز UTF-8 و`title` نصه «المنتجات | متجر التمور»، و`body` فيه عنوان `h1` نصه «منتجاتنا» وفقرة قصيرة.","steps":["ابدأ بـ <!DOCTYPE html> ثم <html lang=\"ar\" dir=\"rtl\">","اكتب <head> وضع فيه <meta charset=\"UTF-8\"> ثم <title>","افتح <body> وأضف <h1>منتجاتنا<\/h1> وفقرة تحت العنوان"],"files":{"html":"<html>\n<head>\n  <title>صفحة جديدة<\/title>\n<\/head>\n<body>\n  <h1>عنوان مؤقت<\/h1>\n<\/body>\n<\/html>","css":""},"checks":[{"kind":"source","label":"تصريح DOCTYPE موجود","regex":"<!DOCTYPE\\s+html"},{"kind":"attr","label":"لغة المستند عربية","sel":"html","attr":"lang","regex":"^ar"},{"kind":"source","label":"اتجاه المستند من اليمين","regex":"dir=[\"']?rtl"},{"kind":"attr","label":"ترميز الصفحة UTF-8","sel":"meta[charset]","attr":"charset","regex":"utf-8"},{"kind":"text","label":"عنوان التبويب يذكر المنتجات","sel":"title","regex":"المنتجات"}],"hint":"السمات تُكتب داخل الوسم الافتتاحي: <html lang=\"ar\" dir=\"rtl\">، وليس بعد وسم الإغلاق.","solution":{"html":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>المنتجات | متجر التمور<\/title>\n<\/head>\n<body>\n  <h1>منتجاتنا<\/h1>\n  <p>تمور فاخرة تُعبّأ في يوم الحصاد وتوصل داخل المدينة.<\/p>\n<\/body>\n<\/html>","css":""}},{"id":"html-02-t2","title":"بيانات وصفية وربط الأنماط","brief":"أكمل رأس المستند: أضف `meta name=\"viewport\"` بمحتوى `width=device-width, initial-scale=1`، و`meta name=\"description\"` يذكر كلمة «متجر» في وصفه، ورابطًا لملف الأنماط `css/style.css` بعلاقة `stylesheet`، وسكربتًا من `app.js` بسمة `defer`.","steps":["ضع viewport بعد charset مباشرة","أضف description بجملة تصف الصفحة","أضف <link rel=\"stylesheet\" href=\"css/style.css\">","أضف <script src=\"app.js\" defer><\/script> في نهاية head"],"files":{"html":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>المنتجات | متجر التمور<\/title>\n<\/head>\n<body>\n  <h1>منتجاتنا<\/h1>\n<\/body>\n<\/html>","css":""},"checks":[{"kind":"attr","label":"إعداد viewport للجوال","sel":"meta[name=\"viewport\"]","attr":"content","regex":"width=device-width"},{"kind":"attr","label":"وصف الصفحة يذكر المتجر","sel":"meta[name=\"description\"]","attr":"content","regex":"متجر"},{"kind":"attr","label":"رابط ملف الأنماط style.css","sel":"link[rel=\"stylesheet\"]","attr":"href","regex":"style\\.css"},{"kind":"source","label":"سكربت مؤجّل بـ defer","regex":"<script[^>]*defer[^>]*>"}],"hint":"كل وسوم head فارغة تُكتب وحدها بلا إغلاق، وقيم السمات بين علامتي تنصيص.","solution":{"html":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"description\" content=\"متجر تمور عربية فاخرة مع توصيل سريع داخل المدينة.\">\n  <title>المنتجات | متجر التمور<\/title>\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <script src=\"app.js\" defer><\/script>\n<\/head>\n<body>\n  <h1>منتجاتنا<\/h1>\n<\/body>\n<\/html>","css":""}}],"summary":["المستند يبدأ بـ DOCTYPE ثم html ثم head ثم body","lang و dir ضروريتان لكل صفحة عربية","charset أول عنصر في head، وtitle واحد لكل صفحة","meta تحمل الوصف والاستجابة وسياسة الفهرسة","link يربط الأنماط والأيقونات، وscript بسمة defer ينتظر DOM"]},{"id":"html-03","track":"html","chapter":"HTML · الأساسيات","order":3,"title":"العناوين والفقرات وتنظيم النص","subtitle":"تبني خريطة محتوى واضحة بالعناوين الستة، وتتحكم في الأسطر والفواصل دون أن تفسد المعنى.","minutes":14,"level":"مبتدئ","objectives":["تستخدم h1 حتى h6 بتسلسل هرمي صحيح","تفرّق بين الفقرة وفاصل السطر والفاصل الموضوعي","تعرف متى تحفظ المسافات بـ pre ومتى لا","تتجنّب استخدام العناوين لتكبير الخط"],"theory":[{"type":"h","text":"العناوين خريطة لا زينة"},{"type":"p","text":"العنوان ليس نصًا كبيرًا فحسب، بل علامة على **موضوع قسم**. قارئ الشاشة يستطيع إحصاء عناوين الصفحة والتنقل بينها بمفتاح واحد، ومحركات البحث تبني فهرسها من هذه العناوين، ووضع القارئ في المتصفح يستخدمها كذلك. لو كبّرت نصًا بـ CSS لبدا عنوانًا، لكن لا أحد سيعرف أنه عنوان."},{"type":"code","lang":"html","code":"<h1>دليل التمور<\/h1>\n<h2>أنواع التمور<\/h2>\n<h3>السكري<\/h3>\n<h3>العجوة<\/h3>\n<h2>التخزين<\/h2>\n<h3>في الثلاجة<\/h3>","caption":"تسلسل هرمي سليم لصفحة دليل"},{"type":"h","text":"المستويات الستة"},{"type":"p","text":"`h1` أعلى مستوى و`h6` أدنى مستوى. المتصفح يعرضها بأحجام متناقصة افتراضيًا، لكن الحجم نتيجة جانبية لا هدفًا؛ المهم هو **عمق** القسم الذي يعنيه العنوان."},{"type":"table","head":["الوسم","المعنى","الاستخدام المعتاد"],"rows":[["<h1>","عنوان الصفحة","اسم المقال أو المنتج أو المتجر"],["<h2>","قسم رئيسي","محاور المقال أو أقسام الصفحة"],["<h3>","قسم فرعي","تفصيل داخل محور"],["<h4>–<h6>","مستويات أعمق","نادرة الاستخدام في الصفحات العادية"]]},{"type":"h","text":"خطأ تخطي المستويات"},{"type":"p","text":"لا تنتقل من `h2` إلى `h4` مباشرة لأنك تريد خطًا أصغر. التخطي يكسر الشجرة: يعلن قارئ الشاشة «عنوان مستوى رابع» دون أن يعرف تحت أي قسم يندرج. الصح أن تنزل درجة واحدة كل مرة، وأن تعود درجة واحدة عند بدء قسم جديد."},{"type":"note","tone":"warn","title":"العنوان أداة معنى لا أداة حجم","text":"إن أردت نصًا أصغر فاستخدم CSS: `h2 { font-size: 1.25rem; }`. لا تختر `h4` لأنه «أنسب شكلًا»، فذلك يفسد الخريطة ويُربك قارئات الشاشة."},{"type":"h","text":"كم h1 في الصفحة؟"},{"type":"p","text":"المعيار لا يمنع أكثر من `h1`، لكن **الاقتراح العملي** عنوان `h1` واحد لكل صفحة يمثل موضوعها. في صفحة قائمة منتجات يكون `h1` هو «منتجاتنا»، وكل منتج عنوان `h2`، وتفاصيل المنتج `h3`. بهذا يفهم الزائر — والآلة — أين يقف."},{"type":"h","text":"الفقرات: p"},{"type":"p","text":"`p` للفقرات النصية المتصلة. لا تستخدمه لتغليف كل شيء: القائمة لها `ul`، والاقتباس له `blockquote`، والعنوان له `h2`. المتصفح يضيف مسافة أعلى وأسفل كل فقرة تلقائيًا، فلا حاجة لإضافة أسطر فارغة بينها."},{"type":"note","tone":"info","title":"لا تستخدم فقرات فارغة للمسافات","text":"`<p><\/p>` المتكررة لصناعة فراغ لا تعمل بشكل موثوق، وتُربك قارئ الشاشة. المسافة بين العناصر مهمة CSS: `margin`."},{"type":"h","text":"فواصل وأسطر: br و hr و wbr"},{"type":"p","text":"`br` فاصل سطر داخل النص نفسه، ويُستخدم في العنوان البريدي والبيت الشعري حيث الفصل جزء من المعنى — لا لتنسيق الفقرات. و`hr` فاصل **موضوعي** بين قسمين، أي تحوّل في الموضوع، لا مجرد خط للزينة. أما `wbr` فنقطة اقتراح لكسر كلمة طويلة إذا لم تتسع الشاشة، ولا يظهر منه شيء إن لم يكن الكسر لازمًا."},{"type":"code","lang":"html","code":"<p>مطعم البيت الشامي<br>شارع الملك فهد<br>الرياض<\/p>\n<hr>\n<p>رابط طويل: https://example.com/<wbr>products/<wbr>dates-2026<\/p>","caption":"عنوان متعدد الأسطر وفاصل موضوعي"},{"type":"h","text":"pre: عندما تكون المسافات جزءًا من المعنى"},{"type":"p","text":"`pre` يعرض النص كما كُتب: كل المسافات والأسطر الجديدة محفوظة، وبخط ثابت العرض. مناسب للشِعر والجداول النصية والمخططات، وغير مناسب لفقرات عادية لأن السطر الطويل سيخرج عن حدود الشاشة."},{"type":"code","lang":"html","code":"<pre>\nالتمورُ في الصحنِ نورٌ\nوالبخلُ في القلبِ عارُ\n<\/pre>","caption":"بيتان داخل pre"},{"type":"note","tone":"tip","title":"pre مع code","text":"لعرض شفرة برمجية استخدم `<pre><code>…<\/code><\/pre>`: `pre` يحفظ المسافات و`code` يعطي الدلالة البرمجية. ولا تنسَ تهريب `<` و`>` إلى `&lt;` و`&gt;` إن أردت عرضهما كنص."},{"type":"terms","items":[{"term":"<h1>","desc":"عنوان المستوى الأول، يمثل موضوع الصفحة كله."},{"term":"<h2>–<h6>","desc":"عناوين أقسام متداخلة، تنزل درجة واحدة كل مرة."},{"term":"<p>","desc":"فقرة نصية متصلة، ولها مسافة افتراضية أعلى وأسفل."},{"term":"<br>","desc":"فاصل سطر داخل النص مثل عنوان بريدي أو بيت شعر."},{"term":"<hr>","desc":"فاصل موضوعي بين قسمين، لا خط للزينة."},{"term":"<wbr>","desc":"نقطة اقتراح كسر كلمة طويلة عند الحاجة فقط."},{"term":"<pre>","desc":"نص محفوظ المسافات والأسطر بخط ثابت العرض."}]}],"examples":[{"title":"ثلاثة مستويات في صفحة منتج","prompt":"أي نص يعرضه المتصفح بخط أكبر، ولماذا؟","answer":"«متجر التمور» أكبر (h1)، ثم «الأنواع» (h2)، ثم «السكري» (h3) الأصغر بينها.","explain":"الأحجام الافتراضية تتناقص مع المستوى، لكن الأهم أن الترتيب يخبر قارئ الشاشة بالعلاقة بين الأقسام.","html":"<h1>متجر التمور<\/h1>\n<h2>الأنواع<\/h2>\n<h3>السكري<\/h3>\n<p>حلو المذاق، لين القوام، وأشهر تمر في المنطقة.<\/p>","css":""},{"title":"فاصلان مختلفان","prompt":"ما الفرق بين الأثرين الظاهرين هنا؟","answer":"`br` يقطع السطر داخل الفقرة الأولى دون فراغ كبير، و`hr` يرسم خطًا أفقيًا يفصل بين فرعي الرياض وجدة.","explain":"`br` أداة تنسيق داخل النص، و`hr` أداة معنى بين قسمين. خلطهما يجعل بنية الصفحة غامضة للقارئ الآلي.","html":"<p>فرع الرياض<br>حي النخيل<br>طريق الملك فهد<\/p>\n<hr>\n<p>فرع جدة<br>حي الروضة<\/p>","css":""},{"title":"التكبير ليس عنوانًا","prompt":"السطران يبدوان متشابهين في الحجم. بأي شيء يختلفان فعلًا؟","answer":"السطر الأول نص عادي مكبّر بـ CSS، والثاني عنوان `h2` حقيقي يمكن التنقل إليه والقفز بينه وبين العناوين.","explain":"التنسيق يغيّر المظهر فقط، أما الوسم فيمنح الدلالة التي تعتمد عليها قارئات الشاشة ومحركات البحث.","html":"<p class=\"big\">التخزين في الثلاجة<\/p>\n<h2>التخزين في المجمّد<\/h2>","css":".big {\n  font-size: 1.5em;\n  font-weight: bold;\n}"}],"quiz":[{"q":"أي تسلسل عناوين سليم داخل مقال؟","options":["h1 ثم h3 ثم h2","h1 ثم h2 ثم h3 ثم h2","h2 ثم h1 ثم h4","h1 ثم h1 ثم h3"],"answer":1,"explain":"يبدأ بعنوان الصفحة ثم ينزل درجة واحدة لكل مستوى، ويعود إلى `h2` عند بدء قسم رئيسي جديد."},{"q":"ما الغرض الصحيح من <hr>؟","options":["رسم خط للزينة","فصل موضوعي بين قسمين مختلفين","إضافة مسافة رأسية كبيرة","كسر السطر داخل العنوان"],"answer":1,"explain":"`hr` يحمل معنى انتهاء موضوع وبدء آخر. المسافات والخطوط الزخرفية مكانها CSS."},{"q":"متى تستخدم <br>؟","options":["بين كل فقرتين","داخل عنوان بريدي أو بيت شعر","لإضافة مسافة كبيرة","لتوسيط النص"],"answer":1,"explain":"`br` فاصل سطر ذو معنى داخل النص. أما المسافات بين الفقرات فتأتي تلقائيًا من `p`."},{"q":"أي وسم يحفظ المسافات والأسطر كما كتبتها؟","options":["p","pre","br","wbr"],"answer":1,"explain":"`pre` يعرض النص بمسافاته وأسطره الأصلية بخط ثابت العرض، وهو المناسب للشِعر والمخططات النصية."},{"q":"لماذا لا نستخدم <h4> بدل CSS لتكبير نص؟","options":["لأن h4 لا يعمل على الجوال","لأن ذلك يخلق عنوانًا وهميًا يفسد خريطة المستند","لأن المتصفح يمنع تكرار h4","لأن h4 لا يقبل النص العربي"],"answer":1,"explain":"اختيار المستوى بحسب الحجم يجعل العناوين لا تعكس البنية، فيتوه قارئ الشاشة وتفقد الصفحة تسلسلها."}],"tasks":[{"id":"html-03-t1","title":"مقال في مدونة","brief":"اكتب مقالًا قصيرًا: عنوان `h1` واحد نصه «كيف تحفظ التمور؟»، ثم عنوانان `h2` نصّهما «التخزين في الثلاجة» و«التخزين في المجمّد»، وتحت كل عنوان فقرة `p` واحدة على الأقل. لا تستخدم `h3` في هذا التحدي حتى يبقى التسلسل بسيطًا.","steps":["ابدأ بعنوان h1 ثم أغلق الوسم","أضف h2 أول ثم فقرة تحته","أضف h2 ثانيًا ثم فقرة تحته"],"files":{"html":"<h1>عنوان المقال<\/h1>\n<p>اكتب الفقرة الأولى.<\/p>\n","css":""},"checks":[{"kind":"selector","label":"عنوان h1 واحد فقط","sel":"h1","min":1,"max":1},{"kind":"text","label":"عنوان المقال يذكر التمور","sel":"h1","regex":"التمور"},{"kind":"selector","label":"عنوانان h2 للقسمين","sel":"h2","min":2},{"kind":"selector","label":"فقرة على الأقل لكل قسم","sel":"p","min":2},{"kind":"sourceNot","label":"لا عناوين h3 في هذا التحدي","regex":"<h3"}],"hint":"العنوان الرئيسي للصفحة h1، وكل قسم رئيسي h2. اكتب النص بين الوسمين ثم أغلق.","solution":{"html":"<h1>كيف تحفظ التمور؟<\/h1>\n<h2>التخزين في الثلاجة<\/h2>\n<p>ضع التمور في علبة محكمة الإغلاق على الرف الأوسط مدة لا تتجاوز شهرين.<\/p>\n<h2>التخزين في المجمّد<\/h2>\n<p>التجميد يحفظ التمور أشهرًا، لكن افصلها عن الأطعمة ذات الرائحة القوية.<\/p>","css":""}},{"id":"html-03-t2","title":"بيتان وفاصل","brief":"أضف عنوانًا `h2` نصه «مقطوعة قصيرة»، ثم عنصر `pre` فيه بيتان على سطرين منفصلين، أحدهما يبدأ بـ «التمورُ»، ثم خطًا فاصلًا `hr` بعده، وفقرة `p` في النهاية. لا تستخدم `br` داخل `pre`.","steps":["اكتب <h2>مقطوعة قصيرة<\/h2>","افتح <pre> واكتب البيت الأول ثم اضغط Enter واكتب الثاني","أغلق <\/pre> ثم أضف <hr> ثم فقرة"],"files":{"html":"<h2>مقطوعة قصيرة<\/h2>\n<p>ضع البيتين هنا.<\/p>\n","css":""},"checks":[{"kind":"selector","label":"عنصر pre واحد","sel":"pre","min":1,"max":1},{"kind":"text","label":"البيت يذكر التمور","sel":"pre","regex":"التمور"},{"kind":"text","label":"البيتان على سطرين منفصلين","sel":"pre","regex":"\\n"},{"kind":"selector","label":"خط فاصل hr","sel":"hr","min":1},{"kind":"sourceNot","label":"لا br داخل pre","regex":"<pre[\\s\\S]*?<br"}],"hint":"داخل pre لا تحتاج br؛ اضغط Enter مباشرة في المحرر لينزل سطر جديد.","solution":{"html":"<h2>مقطوعة قصيرة<\/h2>\n<pre>\nالتمورُ في الصحنِ نورٌ\nوالبخلُ في القلبِ عارُ\n<\/pre>\n<hr>\n<p>من ديوان شاعر من المدينة القديمة.<\/p>","css":""}}],"summary":["العنوان علامة معنى، لا أداة تكبير","انزل درجة واحدة كل مرة ولا تتخطَّ المستويات","عنوان h1 واحد لكل صفحة كقاعدة عملية","br للسطر داخل النص، وhr للفصل الموضوعي","pre يحفظ المسافات والأسطر كما كتبتها"]},{"id":"html-04","track":"html","chapter":"HTML · النصوص والوسوم الدلالية","order":4,"title":"تنسيق النصوص دلاليًا","subtitle":"تختار الوسم الذي يعبّر عن معنى النص لا عن شكله فقط: أهمية، تشديد، حذف، اقتباس، وقت، ومصطلح.","minutes":18,"level":"مبتدئ","objectives":["تفرّق بين الوسم الدلالي والوسم البصري في النص","تستخدم strong وem وmark وdel وins في مواضعها الصحيحة","تكتب الكود والاقتباس والتعريف والوقت بوسوم مناسبة","تضبط اتجاه النص المختلط وتفهم دور span المحايد"],"theory":[{"type":"h","text":"لماذا يوجد وسمان للنص العريض؟"},{"type":"p","text":"لو كتبت `<b>مهم<\/b>` أو `<strong>مهم<\/strong>` فلن ترى فرقًا على الشاشة: الاثنان يظهران عريضين. الفرق في المعنى الذي يحمله الكود لا في الشكل. `strong` تعني **أهمية أو خطورة أو إلحاح**، أما `b` فتعني «اعرض هذا عريضًا» بلا أي دلالة إضافية. المتصفح يمنحهما التنسيق نفسه، لكن قارئ الشاشة ومحرك البحث يقرآن المعنى."},{"type":"table","head":["الدلالي","معناه","البصري","متى تستخدم البصري؟"],"rows":[["<strong>","أهمية أو تحذير","<b>","كلمة مفتاحية في ملخص أو اسم في قائمة بلا أهمية خاصة"],["<em>","تشديد يغيّر النبرة","<i>","مصطلح أجنبي أو اسم علم أو فكرة داخلية"],["<del>","نص محذوف موثّق","<s>","معلومة لم تعد صالحة مثل سعر منتهٍ"],["<ins>","نص مضاف","<u>","تنبيه إملائي أو اسم علم صيني؛ وليس للتزيين"]]},{"type":"h","text":"التشديد والنبرة: em و i"},{"type":"p","text":"`em` تشديد في النبرة: لو قرأت الجملة بصوت عالٍ لرفعت صوتك عند الكلمة الموضوعة داخلها، وقارئ الشاشة يستطيع إعلان هذا التشديد. أما `i` فتستخدمها للمصطلحات الأجنبية وأسماء الأعلام والأفكار الداخلية. لا تفرط في `em`: التشديد في كل سطر يعني ألّا شيء مشدد."},{"type":"code","lang":"html","code":"<p>لا <em>تغلق<\/em> النافذة قبل حفظ العمل.<\/p>\n<p>شغّلت الهاتف على وضع <i>الطيران<\/i> فور الإقلاع.<\/p>\n<p>الاسم العلمي للتمر هو <i>Phoenix dactylifera<\/i>.<\/p>","caption":"التشديد مقابل المصطلح"},{"type":"h","text":"التمييز والحذف والإضافة"},{"type":"p","text":"`mark` تظلل نصًا لأن له صلة بالسياق الحالي: نتيجة بحث أو كلمة مفتاحية في مقال. و`small` للنصوص الجانبية مثل الحقوق والشروط لا لتصغير الخط. و`del` و`ins` توثّقان تغييرًا في المحتوى: المحذوف والمضاف، ويعرضهما المتصفح مشطوبًا ومسطّرًا تلقائيًا. و`sub` و`sup` للمعادلات والوحدات والحواشي."},{"type":"list","ordered":false,"items":["`mark`: تظليل مرتبط بالسياق، مثل الكلمة التي بحث عنها الزائر.","`small`: تفاصيل جانبية وحقوق وشروط، ويُعرض بخط أصغر افتراضيًا.","`del` و`ins`: حذف وإضافة موثّقة، ويمكن إرفاق `datetime` بتاريخ التغيير.","`sub` و`sup`: أسفل السطر وأعلاه، مثل H2O ومساحة الشقة بالمتر المربع.","`s`: معلومة لم تعد صالحة، و`u`: تسطير تنبيهي فقط."]},{"type":"code","lang":"html","code":"<p>السعر بعد الخصم: <del>199<\/del> <ins>149<\/ins> ريال<\/p>\n<p>ينتهي العرض بعد <small>48 ساعة فقط<\/small>.<\/p>\n<p>ماء: H<sub>2<\/sub>O · شقة: 120 م<sup>2<\/sup><\/p>\n<p><mark>الشحن مجاني<\/mark> على الطلبات فوق 200 ريال.<\/p>","caption":"بطاقة منتج"},{"type":"h","text":"النص البرمجي والمدخلات"},{"type":"p","text":"هذه الوسوم تحمل معنى دقيقًا عند التقنيين: `code` جزء من كود، `kbd` ما يضغطه المستخدم على لوحة المفاتيح، `samp` مخرجات برنامج، و`var` اسم متغير في معادلة أو كود. لكتلة كود متعددة الأسطر ضع `code` داخل `pre` حتى تُحفظ الأسطر والمسافات."},{"type":"code","lang":"html","code":"<p>اضغط <kbd>Ctrl<\/kbd> + <kbd>S<\/kbd> للحفظ.<\/p>\n<p>ظهرت الرسالة <samp>Build finished<\/samp>.<\/p>\n<p>اجمع السعر في المتغير <var>total<\/var>.<\/p>\n<pre><code>&lt;p&gt;مرحبًا&lt;/p&gt;<\/code><\/pre>","caption":"وسوم الشيفرة"},{"type":"h","text":"الاقتباس والتعريف والاختصار"},{"type":"p","text":"`blockquote` اقتباس كتلي مستقل، و`q` اقتباس قصير داخل جملة يضيف المتصفح علامات التنصيص حوله تلقائيًا. السمة `cite` على `blockquote` تحمل رابط المصدر لكنها لا تظهر للزائر ولا تتحول إلى رابط. أما وسم `cite` فيكتب اسم العمل أو المؤلف. و`dfn` أول تعريف لمصطلح في الصفحة، و`abbr` اختصار يشرحه `title` عند مرور المؤشر."},{"type":"code","lang":"html","code":"<p>قال الكاتب إن القراءة <q>عادة تُبنى ولا تُولد<\/q>.<\/p>\n<blockquote cite=\"https://example.com/read\">\n  <p>عشر صفحات كل ليلة تكفي لإنهاء كتاب في شهر.<\/p>\n<\/blockquote>\n<p>المصدر: <cite>مجلة القارئ<\/cite><\/p>\n<p><dfn>تجربة المستخدم<\/dfn> مجموع انطباعات الزائر، وتُختصر <abbr title=\"User Experience\">UX<\/abbr>.<\/p>","caption":"اقتباس وتعريف"},{"type":"h","text":"الوقت والعنوان"},{"type":"p","text":"`time` يخبر الآلة بتاريخ، والسمة `datetime` تحمل الصيغة القياسية `YYYY-MM-DD` أو مع وقت `YYYY-MM-DDTHH:MM`. لا تكتب التاريخ داخل `datetime` بالعربية أبدًا. و`address` لمعلومات التواصل الخاصة بالمقال أو الصفحة، وليست للعنوان البريدي فقط، ويمكن أن تحتوي هاتفًا وبريدًا."},{"type":"code","lang":"html","code":"<p>نُشر في <time datetime=\"2026-03-01\">1 مارس 2026<\/time>.<\/p>\n<address>\n  فريق الدعم<br>\n  <a href=\"mailto:support@example.com\">support@example.com<\/a>\n<\/address>","caption":"تاريخ آلي ومعلومات تواصل"},{"type":"h","text":"اتجاه النص والقراءة فوق الحروف"},{"type":"p","text":"عندما تختلط العربية باللاتينية والأرقام قد يضطرب ترتيب النص. `bdi` يعزل نصًا مجهول الاتجاه مثل اسم مستخدم فلا يُفسد ما حوله، و`bdo` يفرض اتجاهًا محددًا بالسمة `dir`. و`ruby` تكتب النطق فوق الحرف وتُستخدم في اليابانية والصينية، مع `rt` للنطق و`rp` كأقواس احتياطية للمتصفحات التي لا تدعم ruby."},{"type":"code","lang":"html","code":"<p>المرسل: <bdi>@ali_99<\/bdi> والمتابع: <bdi>@سارة<\/bdi><\/p>\n<p><bdo dir=\"ltr\">HTML 2026<\/bdo><\/p>\n<p><ruby>漢<rp>(<\/rp><rt>kan<\/rt><rp>)<\/rp><\/ruby> تعني «صيني».<\/p>","caption":"عزل الاتجاه"},{"type":"h","text":"span: الوسم بلا معنى"},{"type":"p","text":"`span` حاوية سطرية محايدة لا تحمل أي دلالة. تُستخدم لتلوين كلمة أو ربط جزء من نص بجافاسكربت. إن كان لديك معنى — أهمية، اقتباس، كود — فاختر الوسم الدلالي، وإن أردت شكلًا فقط فمكان التنسيق هو CSS وspan مجرد خطاف للاختيار."},{"type":"code","lang":"html","code":"<p>اللون <span class=\"swatch\">الأزرق<\/span> هو لون الهوية.<\/p>","caption":"span كخطاف تنسيق"},{"type":"note","tone":"tip","title":"ثلاثة مستفيدين من الدلالة","text":"قارئ الشاشة يعلن «تأكيد» عند strong وem، ومحرك البحث يزن الكلمات داخل strong والعناوين أكثر من غيرها، والمتصفح يضيف سلوكًا جاهزًا مثل التنصيص في q والتسطير في ins. الوصف الدلالي يعمل مجانًا لثلاثة أنظمة في وقت واحد، أما b وi فلا تنقل شيئًا."},{"type":"terms","items":[{"term":"<strong>","desc":"نص ذو أهمية أو خطورة، يُعلن لقارئ الشاشة."},{"term":"<b>","desc":"عريض بصري بلا دلالة."},{"term":"<em>","desc":"تشديد في النبرة يغيّر معنى الجملة."},{"term":"<mark>","desc":"تظليل نص مرتبط بالسياق الحالي."},{"term":"<del> / <ins>","desc":"نص محذوف ونص مضاف، يُعرضان مشطوبًا ومسطّرًا."},{"term":"<code> / <kbd> / <samp> / <var>","desc":"كود، مفتاح يضغطه المستخدم، مخرج برنامج، اسم متغير."},{"term":"<blockquote> / <q>","desc":"اقتباس كتلي مستقل، واقتباس قصير داخل جملة."},{"term":"<dfn> / <abbr>","desc":"تعريف مصطلح أول مرة، واختصار يشرحه title."},{"term":"<time>","desc":"تاريخ بصيغة تفهمها الآلة عبر datetime."},{"term":"<address>","desc":"معلومات التواصل الخاصة بالمقال أو الصفحة."},{"term":"<bdi> / <bdo>","desc":"عزل نص مجهول الاتجاه، وفرض اتجاه محدد."},{"term":"<ruby> / <rt> / <rp>","desc":"كتابة النطق فوق الحرف مع بديل احتياطي."},{"term":"<span>","desc":"حاوية سطرية محايدة للتنسيق أو للجافاسكربت."}]}],"examples":[{"title":"strong أم b؟","prompt":"ماذا يرى المستخدم في السطرين، وماذا يختلف عند قارئ الشاشة؟","answer":"يرى المستخدم السطرين عريضين تمامًا، لكن قارئ الشاشة يرفع النبرة ويعلن الأهمية عند «لا تغلق النافذة» في السطر الأول، ويمر على السطر الثاني كنص عادي.","explain":"المتصفح يعطي strong وb الوزن نفسه، لكن strong وحدها تحمل دلالة الأهمية التي تصل إلى التقنيات المساعدة ومحركات البحث.","html":"<p><strong>لا تغلق النافذة<\/strong> قبل حفظ التعديلات.<\/p>\n<p><b>شعار<\/b> المتجر مكتوب بخط عريض في الترويسة.<\/p>","css":""},{"title":"بطاقة عرض سعر","prompt":"أي رقم سيظهر مشطوبًا، وأي رقم ستُسطَّر تحته خط، وأي كلمة ستُظلَّل؟","answer":"199 يظهر مشطوبًا لأنه السعر القديم، و149 يظهر بخط تحته لأنه السعر الجديد، و«الشحن مجاني» يظهر بخلفية صفراء.","explain":"del يعني محذوف وins يعني مضاف، والتنسيق الافتراضي للمتصفح يعبّر عن الدلالة نفسها: شطب للمحذوف وخط تحت المضاف. mark تظليل، وsub وsup يرفعان الرقم أو يخفضانه.","html":"<p>سعر الحزمة: <del>199<\/del> <ins>149<\/ins> ريال<\/p>\n<p>ينتهي العرض في <time datetime=\"2026-12-31\">31 ديسمبر 2026<\/time><\/p>\n<p>ماء: H<sub>2<\/sub>O · المساحة: 25 م<sup>2<\/sup> · <mark>الشحن مجاني<\/mark><\/p>","css":""},{"title":"اقتباس وتعريف واختصار","prompt":"لماذا استُخدم blockquote هنا ولم يُستخدم q؟ وهل cite في الوسم الأول رابط؟","answer":"الاقتباس جملة كاملة مستقلة عن النص فمكانه blockquote؛ ولو كان جزءًا من جملة لاستخدمنا q وأضاف المتصفح علامات التنصيص. وقيمة cite في blockquote رابط مصدر لا يظهر للزائر، بينما وسم cite هنا اسم المجلة وهو نص لا رابط.","explain":"blockquote للاقتباس الكتلي وq للاقتباس الداخلي، وcite في السمة توثّق المصدر للآلة فقط. dfn يعرّف المصطلح أول مرة، وabbr يشرح الاختصار في title عند المرور بالمؤشر.","html":"<p>كما كتبت <cite>مجلة القارئ<\/cite>:<\/p>\n<blockquote cite=\"https://example.com/read\">\n  <p>القراءة عادة تُبنى ولا تُولد.<\/p>\n<\/blockquote>\n<p><dfn>تجربة المستخدم<\/dfn> مجموع انطباعات الزائر، وتُختصر <abbr title=\"User Experience\">UX<\/abbr>.<\/p>","css":""}],"quiz":[{"q":"أي وسم يجعل النص مهمًا فعلًا وليس عريضًا فقط؟","options":["<b>","<strong>","<i>","<span>"],"answer":1,"explain":"strong تحمل دلالة الأهمية فيعلنها قارئ الشاشة ويعاملها محرك البحث بوزن أكبر، أما b فتنسيق عريض بلا معنى."},{"q":"في أي حالة يكون <i> الخيار الصحيح؟","options":["لتشديد كلمة تغيّر معنى الجملة","لكتابة اسم علم أجنبي أو مصطلح لاتيني","لتحذير المستخدم من خطأ في النموذج","لتعريف مصطلح لأول مرة"],"answer":1,"explain":"i للمصطلحات الأجنبية والأسماء والأفكار الداخلية، والتشديد لـem، والتعريف الأول لـdfn، والتحذير يكون بنص واضح لا بمجرد ميلان."},{"q":"كيف تكتب تاريخًا يفهمه الحاسوب ويظهر بالعربية للمستخدم؟","options":["<time datetime=\"2026-05-01\">1 مايو 2026<\/time>","<time>1 مايو 2026<\/time> بدون سمة","<date>2026-05-01<\/date>","<span class=\"date\">1 مايو 2026<\/span>"],"answer":0,"explain":"السمة datetime تحمل الصيغة القياسية التي تفهمها الآلة، والنص بين الوسمين يظهر للزائر بأي صيغة تريدها. ولا يوجد وسم اسمه date."},{"q":"ما الفرق بين blockquote وq؟","options":["لا فرق، كلاهما يقتبس نصًا","q اقتباس قصير داخل جملة ويضيف المتصفح علامات التنصيص، وblockquote اقتباس كتلي مستقل","q للكود وblockquote للاقتباس","blockquote يضيف رابطًا تلقائيًا إلى المصدر"],"answer":1,"explain":"الفرق في الحجم والسياق: q داخل السطر مع تنصيص تلقائي، وblockquote كتلة مستقلة قد تحتوي فقرات. السمة cite توثّق المصدر لكنها لا تُنشئ رابطًا مرئيًا."},{"q":"لماذا لا نستخدم <u> لتسطير نص للزينة؟","options":["لأنه محذوف من HTML5","لأنه يحمل دلالة تنبيه أو خطأ إملائي، والتزيين مكانه CSS","لأنه لا يعمل في المتصفحات الحديثة","لأنه يمنع نسخ النص"],"answer":1,"explain":"u ما زال موجودًا لكن بمعنى تنبيهي مثل خطأ إملائي أو اسم علم صيني. التسطير التزييني يُكتب بـ text-decoration في CSS."}],"tasks":[{"id":"html-04-t1","title":"بطاقة منتج بنصوص دلالية","brief":"أنشئ بطاقة منتج فيها عنوان h2، ثم فقرة باسم المنتج داخل strong، وسطر سعر فيه السعر القديم 799 داخل del والسعر الجديد 649 داخل ins، وتاريخ انتهاء العرض داخل time مع السمة datetime بالقيمة 2026-12-31، واختصار abbr يحمل السمة title.","steps":["اكتب h2 ثم فقرة الاسم وضع الاسم نفسه داخل strong","اكتب السعرين داخل del وins بالترتيب","أضف time مع datetime ثم abbr مع title"],"files":{"html":"<!-- اكتب بطاقة المنتج هنا -->\n<h2>ساعة ذكية<\/h2>\n","css":""},"checks":[{"kind":"selector","label":"يوجد نص داخلي بـ strong","sel":"strong","min":1},{"kind":"selector","label":"السعر القديم داخل del","sel":"del","min":1},{"kind":"selector","label":"السعر الجديد داخل ins","sel":"ins","min":1},{"kind":"attr","label":"datetime بصيغة سنة-شهر-يوم","sel":"time","attr":"datetime","regex":"^\\d{4}-\\d{2}-\\d{2}$"},{"kind":"attr","label":"كل abbr له title يشرحه","sel":"abbr","attr":"title","regex":".+"}],"hint":"داخل time اكتب التاريخ الظاهر بالعربية، وضع الصيغة الرقمية في datetime فقط.","solution":{"html":"<h2>ساعة نور الذكية<\/h2>\n<p><strong>ساعة نور<\/strong> بضمان سنتين.<\/p>\n<p>السعر: <del>799<\/del> <ins>649<\/ins> ريال<\/p>\n<p>ينتهي العرض في <time datetime=\"2026-12-31\">31 ديسمبر 2026<\/time><\/p>\n<p>يشمل السعر <abbr title=\"ضريبة القيمة المضافة\">ض.ق.م<\/abbr>.<\/p>","css":""}},{"id":"html-04-t2","title":"مقطع من مقال","brief":"اكتب مقطعًا فيه عنوان h2، وفقرة تحتوي اقتباسًا قصيرًا داخل q، ثم blockquote مستقل يحوي فقرة ووسم cite باسم المصدر داخل الـblockquote نفسه، ثم address لمعلومات التواصل، ووقت النشر داخل time مع datetime.","steps":["ضع q داخل فقرة عادية","اكتب blockquote وضع داخله p ثم footer فيه cite","أغلق المقطع بـ address وtime"],"files":{"html":"<article>\n  <h2>ملاحظات عن القراءة<\/h2>\n  <!-- أكمل الفقرة والاقتباس -->\n<\/article>\n","css":""},"checks":[{"kind":"selector","label":"يوجد اقتباس كتلي blockquote","sel":"blockquote","min":1},{"kind":"selector","label":"اسم المصدر داخل blockquote","sel":"blockquote cite","min":1},{"kind":"selector","label":"اقتباس قصير داخل جملة بـ q","sel":"q","min":1},{"kind":"selector","label":"معلومات تواصل داخل address","sel":"address","min":1},{"kind":"attr","label":"تاريخ نشر آلي في datetime","sel":"time","attr":"datetime","regex":"^\\d{4}-\\d{2}-\\d{2}$"}],"hint":"cite اسم العمل أو المؤلف، ضعه داخل blockquote لا خارجه.","solution":{"html":"<article>\n  <h2>ملاحظات عن القراءة<\/h2>\n  <p>يقول المؤلف إن القراءة <q>عادة تُبنى ولا تُولد<\/q>.<\/p>\n  <blockquote cite=\"https://example.com/read\">\n    <p>عشر صفحات كل ليلة تكفي لإنهاء كتاب في شهر.<\/p>\n    <footer>— <cite>مجلة القارئ<\/cite><\/footer>\n  <\/blockquote>\n  <p>نُشر في <time datetime=\"2026-02-10\">10 فبراير 2026<\/time><\/p>\n  <address>للمراسلة: reader@example.com<\/address>\n<\/article>","css":""}}],"summary":["الدلالي يقول معنى النص، والبصري يقول شكله فقط","strong وem وmark وdel وins تنقل معنى يقرأه قارئ الشاشة","code وkbd وsamp وvar لكل منها وظيفة تقنية محددة","time وabbr وdfn تضيف معلومات تفهمها الآلة"]},{"id":"css-01","track":"css","chapter":"CSS · الأساسيات","order":1,"title":"مقدمة CSS وطرق الربط","subtitle":"تكتب قاعدة CSS صحيحة، تربطها بالصفحة بالطريقة المناسبة، وتعرف لماذا يفوز نمط على آخر عند التعارض.","minutes":16,"level":"مبتدئ","objectives":["تفرّق بين المحدِّد والتعريف وتكتب قاعدة CSS بلا أخطاء صياغة","تربط ورقة أنماط بالصفحة بثلاث طرق وتختار الأنسب لكل حالة","تتتبع ترتيب الشلال لتعرف أي قيمة سيطبّقها المتصفح"],"theory":[{"type":"h","text":"لماذا توجد CSS أصلًا؟"},{"type":"p","text":"في مسار HTML بنيت **المعنى**: `h1` عنوان، `p` فقرة، `ul` قائمة، `a` رابط. لكن إن فتحت تلك الصفحة الآن فستراها بخط المتصفح الافتراضي: أسود على أبيض بلا مسافات ولا ترتيب، لأن HTML لا يعرف شيئًا عن الشكل. CSS هي الطبقة التي تقول للمتصفح **كيف** يُعرض هذا المعنى: اللون والحجم والخط والمسافات وموضع كل كتلة."},{"type":"p","text":"الفصل بين البنية والعرض ليس ترفًا: تستطيع تغيير ألوان موقع كامل من ملف واحد دون لمس HTML، ويقرأ قارئ الشاشة ومحرك البحث HTML نظيفًا من دون ضجيج التنسيق، ويستطيع مصمم آخر إعادة بناء المظهر وأنت لم تغيّر حرفًا في المحتوى."},{"type":"compare","left":{"title":"HTML: البنية والمعنى","code":"<article class=\"card\">\n  <h2>تمر سكري<\/h2>\n  <p>45 ر.س<\/p>\n<\/article>"},"right":{"title":"CSS: الشكل","code":".card {\n  padding: 20px;\n  border: 1px solid #e2e8f0;\n}\n.card h2 {\n  color: #0f172a;\n}"}},{"type":"h","text":"تشريح القاعدة"},{"type":"p","text":"كل تنسيق تكتبه هو **قاعدة** (rule): محدِّد يختار العناصر، ثم كتلة بين `{` و `}` فيها التعريفات. المحدِّد يجيب عن سؤال «من؟»، والكتلة تجيب عن «وماذا عليه أن يصير؟»."},{"type":"code","lang":"css","code":".card {\n  padding: 20px;\n  border: 1px solid #e2e8f0;\n  background: #ffffff;\n}","caption":"قاعدة واحدة: محدِّد واحد وثلاثة تعريفات"},{"type":"list","ordered":true,"items":["**المحدِّد** selector: `.card` يعني كل عنصر يحمل الصنف `card`.","**الكتلة** declaration block: كل ما بين `{` و `}`، ولا تحتوي إلا تعريفات.","**التعريف** declaration: `padding: 20px;` أي خاصية ثم `:` ثم قيمة ثم `;`.","**الفاصلة المنقوطة** الأخيرة اختيارية في CSS، لكن اكتبها دائمًا حتى لا تنساها عند إضافة تعريف جديد."]},{"type":"note","tone":"warn","title":"خطأان يفسدان القاعدة كلها","text":"نسيان `;` بين تعريفين يجعل المتصفح يتجاهل ما بعده، ونسيان `}` يجعل كل ما يأتي بعد القاعدة جزءًا منها. افتح أدوات المطوّر وراقب القاعدة المشطوبة بعلامة صفراء."},{"type":"h","text":"التعليقات"},{"type":"p","text":"التعليق في CSS يبدأ بـ `/*` وينتهي بـ `*/` ولا يُعرض في الصفحة، ويصلح لسطر أو لعدة أسطر. اكتب في التعليق **لماذا** اخترت القيمة أو من أين جاءت، لا مجرد تكرار اسم الخاصية؛ التعليق `/* اللون */` فوق `color` لا يضيف معلومة لأحد."},{"type":"code","lang":"css","code":"/* شريط علوي بلون العلامة التجارية */\n.header {\n  background: #0f766e;\n  /* مؤقتًا: سيُستبدل بصورة عند تصميم الوضع الليلي */\n}\n\n/* لا يوجد تعليق سطري في CSS: // غير صالح */","caption":"التعليقات لا تُطبَّق ولا تظهر في الصفحة"},{"type":"h","text":"ثلاث طرق لربط CSS بالصفحة"},{"type":"table","head":["الطريقة","الشكل","متى تستخدمها"],"rows":[["سطري inline","سمة `style` على العنصر نفسه","اختبار فوري أو بريد HTML؛ لا للمشاريع"],["داخلي internal","`<style>` داخل `<head>`","صفحة واحدة أو أنماط حرجة صغيرة"],["خارجي external","`<link rel=\"stylesheet\" href=\"style.css\">`","الاختيار الافتراضي لكل مشروع حقيقي"]]},{"type":"code","lang":"html","code":"<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>متجر التمور<\/title>\n  <link rel=\"stylesheet\" href=\"styles/main.css\">\n<\/head>\n<body>\n  <h1>متجر التمور<\/h1>\n<\/body>\n<\/html>","caption":"الطريقة الخارجية: سطر واحد في head يكفي"},{"type":"p","text":"يمكنك ربط أكثر من ملف بترتيب متتالٍ، مثل ملف تصفير `reset.css` ثم `main.css`؛ وعند التعارض المتساوي يفوز الملف **الأخير**. أما الربط السطري `style=\"color: red\"` فيُكتب على عنصر واحد، ولا يُعاد استخدامه، ولا يُتجاوز إلا بـ `!important` أو ورقة المستخدم؛ ولهذا يتحول المشروع سريعًا إلى فوضى إن اعتمدت عليه."},{"type":"h","text":"‏@import والفرق بينه وبين link"},{"type":"code","lang":"css","code":"/* @import يجب أن يأتي قبل أي قاعدة أخرى */\n@import url(\"base.css\");\n@import url(\"print.css\") print;\n\nbody {\n  font-family: system-ui, sans-serif;\n}","caption":"استيراد ورقة من داخل ورقة"},{"type":"p","text":"`@import` يُحمّل ورقة أنماط من داخل CSS ويعمل فعلًا، لكن المتصفح لا يكتشف الملف المستورد إلا بعد تنزيل الملف الأب ثم تحليله، فتتسلسل الطلبات ويتأخر أول رسم. لذلك `<link>` في `head` أسرع وأوضح، ويُترك `@import` لحالات نادرة مثل ورقة طباعة منفصلة. والخطأ الشائع: كتابته بعد قواعد أخرى فيتجاهله المتصفح بصمت."},{"type":"h","text":"الشلال: من يفوز عند التعارض؟"},{"type":"p","text":"قد تعلن ثلاث قواعد القيمة نفسها لعنصر واحد. المتصفح لا يدمج ولا يرمي خطأً؛ بل يطبّق **الشلال** (cascade): يجمع كل الإعلانات، يرتبها، ثم يترك **قيمة واحدة** لكل خاصية في كل عنصر."},{"type":"list","ordered":true,"items":["**الأصل والأهمية**: `!important` قبل غيره، وأنماط المؤلف قبل أنماط المتصفح الافتراضية.","**الأولوية** (specificity): المحدِّد الأدقّ يفوز، وسنحسبها بالتفصيل في درس المحددات.","**ترتيب الظهور**: عند التساوي الكامل يفوز الإعلان **الأخير** في ترتيب القراءة.","**الوراثة** ليست منافسًا: هي القيمة التي يأخذها العنصر من أبيه حين لا يوجد إعلان خاص به."]},{"type":"code","lang":"css","code":"p { color: #334155; }      /* عنصر: (0,0,1) */\n.note { color: #b45309; }   /* صنف: (0,1,0) يفوز على العنصر */\np.note { color: #1d4ed8; } /* صنف+عنصر: (0,1,1) يفوز على .note */\n.note { color: #15803d; }   /* (0,1,0) لكنه متأخر: يفوز على الأول فقط */","caption":"أربع قواعد، وقيمة واحدة تصل إلى الشاشة"},{"type":"note","tone":"tip","title":"قبل أن تكتب !important","text":"اسأل نفسك: هل يمكنني كتابة محدِّد أدقّ بدلًا منه؟ كل `!important` تحوّل التعديل التالي إلى معركة، وتجعل ورقة الأنماط غير قابلة للتنبؤ بعد أسبوعين."},{"type":"h","text":"كيف يقرأ المتصفح أنماطك؟"},{"type":"p","text":"يقرأ المتصفح HTML فيبني شجرة **DOM**، ويقرأ CSS فيبني شجرة **CSSOM**، ثم يدمجهما في **شجرة العرض** ويحسب لكل عنصر «النمط المحسوب» (computed style). لا يُلوَّن العنصر مرة لكل قاعدة؛ الناتج النهائي كائن واحد فيه قيمة نهائية لكل خاصية، وهو ما تراه في لوحة Styles بأدوات المطوّر."},{"type":"p","text":"التنزيل يحدث مرة واحدة وتُخزَّن الورقة في ذاكرة التخزين المؤقت فتُعاد في كل صفحة وكل زيارة. ولأن CSS **يحجب الرسم**، يؤجل المتصفح أول رسم حتى تجهز الأنماط؛ ولهذا يُفضّل ملف واحد مضغوط على عشرة ملفات صغيرة متتابعة."},{"type":"note","tone":"info","title":"أفضل ممارسة","text":"ملف خارجي واحد يُشار إليه من كل الصفحات: زيارة أولى أبطأ بقليل، وكل زيارة تالية أسرع بكثير، وتعديل واحد يغيّر الموقع كله."},{"type":"terms","items":[{"term":"قاعدة (rule)","desc":"محدِّد ثم كتلة تعريفات بين `{}`."},{"term":"التعريف","desc":"خاصية وقيمة تنتهي بفاصلة منقوطة، مثل `color: #0f766e;`."},{"term":"الشلال (cascade)","desc":"ترتيب المتصفح لكل الإعلانات ليختار قيمة واحدة لكل خاصية."},{"term":"CSSOM","desc":"تمثيل المتصفح لورقة الأنماط بعد تحليلها، ويُدمج مع DOM قبل الرسم."},{"term":"@import","desc":"استيراد ورقة أنماط من داخل CSS؛ أقل كفاءة من `<link>`."}]}],"examples":[{"title":"سطري أم ورقة أنماط؟","prompt":"ما لون الفقرتين في المتصفح؟ ولماذا لم تجعلهما قاعدة `p` أخضر؟","answer":"الأولى حمراء `#dc2626` والثانية رمادية `#64748b`؛ قاعدة `p` خسرت في الحالتين، مرة أمام النمط السطري ومرة أمام الصنف.","explain":"النمط السطري أقوى إعلان في ورقة المؤلف، فيتغلب على أي محدِّد عادي. أما `.muted` فأولويتها (0,1,0) أعلى من `p` ذات (0,0,1)، فتغلبها حتى لو جاءت قبلها في الملف.","html":"<p style=\"color: #dc2626;\">خصم اليوم فقط<\/p>\n<p class=\"muted\">الكمية محدودة<\/p>","css":"p {\n  color: #0f766e;\n}\n.muted {\n  color: #64748b;\n}"},{"title":"من يفوز عند التعارض؟","prompt":"ثلاث قواعد تعلن لون النص للفقرة نفسها. أي لون سيظهر؟","answer":"أزرق `#1d4ed8`؛ لأن `p.note` أولويته (0,1,1) أعلى من `.note` ذات (0,1,0).","explain":"الأولوية تُقارن قبل ترتيب الظهور: الصنف وحده لا يكفي أمام صنف مقترن بعنصر. والقاعدتان الأولى والثالثة متساويتان تمامًا فيفوز الأخير بينهما، لكنهما خسرتا أصلًا أمام `p.note`.","html":"<p class=\"note\">خصم 20% على كل التمور<\/p>","css":".note {\n  color: #b45309;\n}\np.note {\n  color: #1d4ed8;\n}\n.note {\n  color: #15803d;\n}"},{"title":"التعليق والقاعدة المكررة","prompt":"لماذا ظهر السعر بلون مختلف عن أول تعريف له؟ وهل أثّر التعليق في شيء؟","answer":"السعر أخضر مزرق `#0f766e` والعنوان `#0f172a`؛ التعليق لم يؤثر لأنه نص يتجاهله المتصفح، والقاعدة الثانية للسعر فازت لورودها لاحقًا.","explain":"القاعدتان `.price` متساويتان في المحدِّد والأولوية، فالحكم لترتيب الظهور. التعليق أداة للقارئ البشري فقط، ووجوده أو حذفه لا يغيّر الناتج على الشاشة.","html":"<h2>عرض الأسبوع<\/h2>\n<p class=\"price\">199 ر.س<\/p>","css":"/* اللون الأساسي للسعر */\n.price {\n  color: #64748b;\n}\n.price {\n  color: #0f766e;\n}\nh2 {\n  color: #0f172a;\n}"}],"quiz":[{"q":"لديك موقع من 12 صفحة وتريد توحيد تنسيقها. ما الطريقة الصحيحة؟","options":["سمة style على كل عنصر في كل صفحة","كتلة <style> مكررة في كل صفحة","ملف CSS خارجي واحد يُربط بـ <link> في كل صفحة","@import في نهاية كل ورقة"],"answer":2,"explain":"الملف الخارجي يُنزَّل مرة ويُخزَّن مؤقتًا ويُشارَك بين الصفحات، فأي تعديل واحد يسري على الموقع كله، بخلاف التكرار في كل صفحة."},{"q":"في القاعدة `.card { padding: 16px; }` ما هو المحدِّد؟","options":[".card","padding","16px","{ padding: 16px; }"],"answer":0,"explain":"المحدِّد هو ما يقف قبل `{`، وهو هنا الصنف `card`. أما `padding` فخاصية، و`16px` قيمة، وما بين القوسين كتلة تعريفات."},{"q":"قاعدتان لهما المحدِّد نفسه والأولوية نفسها تعلنان `color` لعنصر واحد. أي قيمة تظهر؟","options":["قيمة القاعدة الأولى في الملف","قيمة القاعدة الأخيرة في الملف","القيمة الأقصر","لا تُطبَّق أي قيمة ويظهر تحذير للمستخدم"],"answer":1,"explain":"عند التساوي الكامل في الأصل والأولوية يحكم ترتيب الظهور، فيفوز الإعلان الأخير. والشلال لا يدمج القيم ولا يعرض خطأً للمستخدم."},{"q":"ما وظيفة @import؟","options":["استيراد ورقة أنماط أخرى من داخل CSS","تحويل CSS إلى HTML","إخفاء القاعدة عن المتصفح","ربط ملف JavaScript بالصفحة"],"answer":0,"explain":"`@import` يستورد ورقة أنماط، ويجب أن يتقدم على كل القواعد وإلا تجاهله المتصفح. لكنه يبطئ التحميل لأن اكتشاف الملف يحتاج تحليل الملف الأب، لذا يُفضّل `<link>`."},{"q":"أي عبارة تصف بدقة ما يفعله المتصفح بورقة الأنماط؟","options":["يطبّق كل قاعدة على حدة ويجمع تأثيراتها","يختار لكل خاصية قيمة واحدة بعد ترتيب الإعلانات حسب الشلال","يتجاهل الأنماط الموروثة تمامًا","يحوّل CSS إلى وسوم HTML جديدة"],"answer":1,"explain":"المتصفح يبني CSSOM ثم يحسب لكل عنصر قيمة نهائية واحدة لكل خاصية، لا مجمو
